<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Asset Exporter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent !important;
      width: 1200px;
      height: 800px;
      overflow: hidden;
    }
    .grid-cell {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }
    .btn-wrap-bottom {
      width: 200px;
      height: 200px;
    }
    .btn-wrap-bottom svg {
      width: 168px;
      height: 168px;
      display: block;
      overflow: visible;
    }
    .btn-wrap-top {
      width: 200px;
      height: 200px;
    }
    .btn-wrap-top svg {
      width: 168px;
      height: 168px;
      display: block;
      overflow: visible;
    }
    .badge-wrap {
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .medallion-badge-empty {
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255, 248, 215, 0.94) 0%, rgba(235, 178, 62, 0.94) 100%);
      border: 4.2px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 8px 18px rgba(85, 48, 8, 0.28);
    }
    .burlap-wrap {
      width: 300px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .burlap-wrap svg {
      width: 280px;
      height: 130px;
      display: block;
      overflow: visible;
    }
  </style>
</head>
<body>
  <!-- 全局共享 SVG <defs> (100% 取自 v8.html) -->
  <svg id="shared-svg-defs" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none" aria-hidden="true">
    <defs id="global-ui-3d-defs">
      <filter id="btnDropShadow" x="-20%" y="-15%" width="140%" height="145%">
        <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#6e4414" flood-opacity="0.34"/>
      </filter>
      <filter id="rulesDropShadow" x="-20%" y="-15%" width="140%" height="145%">
        <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3c4c34" flood-opacity="0.34"/>
      </filter>
      <filter id="iconShadow" x="-25%" y="-25%" width="150%" height="150%">
        <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#8c581c" flood-opacity="0.42"/>
      </filter>
      <filter id="bulbGlow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="3.5" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <linearGradient id="warmGlassBase" x1="15%" y1="5%" x2="85%" y2="95%">
        <stop offset="0%" stop-color="#f7dfb8" stop-opacity="0.48"/>
        <stop offset="38%" stop-color="#dfad64" stop-opacity="0.28"/>
        <stop offset="72%" stop-color="#b87b31" stop-opacity="0.40"/>
        <stop offset="100%" stop-color="#d89d4e" stop-opacity="0.50"/>
      </linearGradient>
      <linearGradient id="hintGlassBase" x1="15%" y1="5%" x2="85%" y2="95%">
        <stop offset="0%" stop-color="#ede2be" stop-opacity="0.46"/>
        <stop offset="45%" stop-color="#b69f62" stop-opacity="0.30"/>
        <stop offset="80%" stop-color="#877b48" stop-opacity="0.40"/>
        <stop offset="100%" stop-color="#a8995c" stop-opacity="0.48"/>
      </linearGradient>
      <linearGradient id="rulesGlassBase" x1="15%" y1="5%" x2="85%" y2="95%">
        <stop offset="0%" stop-color="#e4efe2" stop-opacity="0.48"/>
        <stop offset="45%" stop-color="#9cb298" stop-opacity="0.30"/>
        <stop offset="82%" stop-color="#6b8368" stop-opacity="0.40"/>
        <stop offset="100%" stop-color="#8da387" stop-opacity="0.50"/>
      </linearGradient>
      <linearGradient id="topCrescentSheen" x1="30%" y1="0%" x2="65%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.64"/>
        <stop offset="45%" stop-color="#fff6e4" stop-opacity="0.30"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
      </linearGradient>
      <radialGradient id="innerBottomShade" cx="52%" cy="68%" r="48%">
        <stop offset="0%" stop-color="#8a5216" stop-opacity="0.26"/>
        <stop offset="65%" stop-color="#9c6222" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#9c6222" stop-opacity="0.0"/>
      </radialGradient>
      <linearGradient id="glassRimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
        <stop offset="30%" stop-color="#fff8eb" stop-opacity="0.72"/>
        <stop offset="65%" stop-color="#ffe7c2" stop-opacity="0.42"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.88"/>

      <radialGradient id="bulb3DGrad" cx="36%" cy="32%" r="64%">

        <stop offset="32%" stop-color="#ffea38"/>
        <stop offset="72%" stop-color="#f7b718"/>
        <stop offset="100%" stop-color="#d97f08"/>

        <stop offset="48%" stop-color="#d4ecff"/>
        <stop offset="100%" stop-color="#8ec0e4"/>

      <!-- 粗麻布桌垫渐变与纹理 -->

        <rect x="0.5" y="4.4" width="2.9" height="3.3" rx="1.1" fill="#d6ac72"/>
        <rect x="0.9" y="4.8" width="1.3" height="2.4" rx="0.5" fill="#f5dca8" opacity="0.65"/>
        <rect x="4.5" y="4.6" width="3.3" height="2.9" rx="1.1" fill="#e8c896"/>
        <rect x="4.9" y="4.9" width="2.4" height="1.2" rx="0.5" fill="#ffeed0" opacity="0.72"/>
      </pattern>
      <pattern id="burlapWeaveDarkPat" width="8" height="8" patternUnits="userSpaceOnUse">
        <rect width="8" height="8" fill="#362718"/>
        <rect x="0.5" y="0.6" width="3.3" height="2.9" rx="1.1" fill="#7c6348"/>
        <rect x="0.9" y="0.9" width="2.4" height="1.2" rx="0.5" fill="#9c8062" opacity="0.65"/>
        <rect x="4.4" y="0.5" width="2.9" height="3.3" rx="1.1" fill="#634d36"/>
        <rect x="0.5" y="4.4" width="2.9" height="3.3" rx="1.1" fill="#5e4832"/>
        <rect x="4.5" y="4.6" width="3.3" height="2.9" rx="1.1" fill="#755c42"/>
        <rect x="4.9" y="4.9" width="2.4" height="1.2" rx="0.5" fill="#94785a" opacity="0.6"/>
      </pattern>
      <linearGradient id="burlapTopShade" x1="12%" y1="8%" x2="88%" y2="92%">
        <stop offset="0%" stop-color="#fff8e6" stop-opacity="0.38"/>
        <stop offset="45%" stop-color="#d49e5c" stop-opacity="0.06"/>
        <stop offset="82%" stop-color="#5c3b18" stop-opacity="0.36"/>
        <stop offset="100%" stop-color="#38220c" stop-opacity="0.58"/>
      </linearGradient>
      <linearGradient id="burlapSideWallLight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#c4945a"/>
        <stop offset="38%" stop-color="#8c6032"/>
        <stop offset="78%" stop-color="#543618"/>
        <stop offset="100%" stop-color="#331f0c"/>
      </linearGradient>
      <linearGradient id="burlapSideWallDark" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#69523a"/>
        <stop offset="42%" stop-color="#473524"/>
        <stop offset="82%" stop-color="#2b1f14"/>
        <stop offset="100%" stop-color="#1a110a"/>
      </linearGradient>
      <radialGradient id="terracottaShadowGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="rgba(148, 62, 14, 0.62)"/>
        <stop offset="48%" stop-color="rgba(168, 78, 20, 0.36)"/>
        <stop offset="78%" stop-color="rgba(185, 92, 28, 0.12)"/>

        <stop offset="60%" stop-color="rgba(115, 62, 16, 0.18)"/>
        <stop offset="100%" stop-color="rgba(115, 62, 16, 0.0)"/>
      </radialGradient>
    </defs>
  </svg>
