    // 10. 瓶子交互与物理重力倾倒动画
    // ==========================================
    function onBagClick(bagIdx) {
      if (isAnimating) return;
      const bag = bags[bagIdx];
      if (!bag) return;
      if (bag.locked) {
        moveHistory.push(cloneState());
        bag.locked = false;
        bag.color = pickNextNeededBagColor();
        playSound('pack');
        showToast('🎬 激励视频辅助：已开启第 4 个高定礼盒槽位！');
        renderAll();
      } else if (bag.packedBottle) {
        showToast(`🛍️ 礼盒已封存整瓶【${COLORS[bag.packedBottle].name}】！`);
      } else {
        showToast(`🛍️ 凝萃满瓶【${COLORS[bag.color].name}】即可从袋口飞入封存！`);
      }
    }

    function pickNextNeededBagColor() {
      const activeBagColors = bags.filter(b => !b.locked && !b.packedBottle && b.color).map(b => b.color);
      const remainingColors = [];
      bottles.forEach(b => {
        if (b.removed || b.corked) return;
        b.layers.forEach(c => {
          if (!remainingColors.includes(c)) remainingColors.push(c);
        });
      });
      return remainingColors.find(c => !activeBagColors.includes(c)) || remainingColors[0] || 'green';
    }

    function isCompleteBottle(b) {
      if (!b || b.removed || b.corked) return false;
      const cap = b.maxCap || 4;
      return b.special === 'none' && (!b.mysteryCount || b.mysteryCount === 0) && b.layers.length === cap && b.layers.every(c => c === b.layers[0]);
    }

    function canSelectBottle(b) {
      if (!b || b.removed || b.corked) return false;
      if (b.isGiantCat) {
        const colName = COLORS[b.catTargetColor || 'pink'].name;
        showToast(`🐱 中央为皇家灵猫水晶瓶，请将外围【${colName}】汇入其中！`);
        return false;
      }
      if (b.special === 'silk_drape') {
        showToast(`🧣 星缎礼袍封印中！完成 ${b.unlockOrder} 份礼盒封存即可自动揭幕`);
        return false;
      }
      if (b.special === 'full_ice') {
        showToast(`🧊 极地全冰雕封印中！累计封存 ${b.unlockOrder} 份礼盒即可破冰`);
        return false;
      }
      if (b.special === 'paper_bag') {
        showToast(`🛍️ 复古羊皮礼袋封印中！完成 ${b.unlockOrder} 份礼盒封存即可解袋`);
        return false;
      }
      if (b.special === 'ice_base') {
        showToast(`❄️ 瓶底霜晶凝结（仍可承接秘药）！再倾倒 ${b.poursToBreak || 1} 次共振破冰`);
        return false;
      }
      if (b.special === 'stone_base') {
        showToast(`🪨 瓶底曜石锁定（仍可承接秘药）！再倾倒 ${b.poursToBreak || 1} 次共振碎石`);
        return false;
      }
      if (b.special === 'ad_cam' || b.special === 'ad_cam_blue') return false;
      if (b.layers.length === 0 || isCompleteBottle(b)) return false;
      return true;
    }

    function canPourInto(src, dst) {
      if (!src || !dst || src.removed || dst.removed || src.corked || dst.corked) return false;
      const openMouthSpecials = ['none', 'ice_base', 'stone_base'];
      if (!openMouthSpecials.includes(dst.special)) return false;
      const dstCap = dst.maxCap || 4;
      if (dst.layers.length >= dstCap || src.layers.length === 0) return false;
      if (dst.layers.length === 0) return true;
      return src.layers[src.layers.length - 1] === dst.layers[dst.layers.length - 1];
    }

    function onBottleClick(idx) {
      if (isAnimating) return;
      const clicked = bottles[idx];
      if (!clicked || clicked.removed) return;

      if (clicked.special === 'ad_cam' || clicked.special === 'ad_cam_blue') {
        moveHistory.push(cloneState());
        clicked.special = 'none';
        playSound('pack');
        showToast('🎬 激励视频奖励：已为您开启 +1 备用琉璃空瓶！');
        renderAll();
        return;
      }

      if (clicked.corked) {
        showToast('✅ 该琉璃瓶已完成同色凝萃并落塞封存！');
        return;
      }

      if (remainingMoves !== null && remainingMoves <= 0) {
        showToast('⚠️ 星晷步数已耗尽！请点击底部【+空瓶】增加步数或【撤回】');
        return;
      }

      if (selectedIndex === null) {
        if (canSelectBottle(clicked)) {
          selectedIndex = idx;
          playSound('select');
          renderAll();
          startSelectSloshAnimation(idx);
        }
        return;
      }

      if (selectedIndex === idx) {
        stopSelectSloshAnimation();
        selectedIndex = null;
        playSound('select');
        renderAll();
        return;
      }

      const src = bottles[selectedIndex];
      const dst = clicked;

      if (canPourInto(src, dst)) {
        stopSelectSloshAnimation();
        performLiquidPour(selectedIndex, idx);
      } else if (canSelectBottle(dst)) {
        selectedIndex = idx;
        playSound('select');
        renderAll();
        startSelectSloshAnimation(idx);
      } else {
        stopSelectSloshAnimation();
        selectedIndex = null;
        renderAll();
      }
    }

    function buildGravityStreamSVG(spoutX, spoutY, mouthX, mouthY, surfaceY, dstRect, pourDir, colObj, pourProgress, splashCtx) {
      const {
        initialDstLayers = 0,
        moveCount = 1,
        currentTotalLayers = 0,
        dstBottle = null
      } = splashCtx || {};

      const headRatio = Math.min(1, pourProgress / 0.10);
      const tailRatio = pourProgress > 0.90 ? Math.min(1, (pourProgress - 0.90) / 0.10) : 0;

      const totalDrop = Math.max(20, surfaceY - spoutY);
      const yStart = spoutY + totalDrop * (tailRatio * tailRatio * 0.82);
      const yEnd = spoutY + totalDrop * (headRatio * headRatio);
      if (yEnd - yStart < 4) return '';

      const N = 22;
      const leftEdge = [];
      const rightEdge = [];
      const centerCurve = [];

      const archHeight = Math.max(18, (mouthY - spoutY) + 12);
      const fluxRadiusBoost = 1 + Math.min(2, moveCount - 1) * 0.10;

      for (let i = 0; i <= N; i++) {
        const s = i / N;
        const y = yStart + (yEnd - yStart) * s;
        const dyFromSpout = Math.max(0, y - spoutY);
        const globalS = Math.max(0, Math.min(1, dyFromSpout / totalDrop));

        let x;
        if (dyFromSpout < archHeight) {
          const tArch = dyFromSpout / archHeight;
          const easeArch = Math.sin(tArch * Math.PI * 0.5);
          x = spoutX + (mouthX - spoutX) * easeArch;
        } else {
          x = mouthX;
        }

        const mouthTaper = dyFromSpout < 10 ? (0.58 + 0.42 * (dyFromSpout / 10)) : 1.0;
        const halfW = (4.2 * fluxRadiusBoost - 0.8 * Math.sqrt(globalS)) * mouthTaper * (tailRatio > 0 ? (1 - tailRatio * 0.45) : 1);

        leftEdge.push({ x: x - halfW, y, halfW });
        rightEdge.push({ x: x + halfW, y, halfW });
        centerCurve.push(`${(x - halfW * 0.15).toFixed(2)},${y.toFixed(2)}`);
      }

      const firstL = leftEdge[0];
      const firstR = rightEdge[0];
      const lastL = leftEdge[leftEdge.length - 1];
      const lastR = rightEdge[rightEdge.length - 1];

      let streamPath = `M ${firstL.x.toFixed(2)},${firstL.y.toFixed(2)} `;
      streamPath += `Q ${((firstL.x + firstR.x) * 0.5).toFixed(2)},${(firstL.y - 1.2).toFixed(2)} ${firstR.x.toFixed(2)},${firstR.y.toFixed(2)} `;
      for (let i = 1; i < rightEdge.length; i++) {
        streamPath += `L ${rightEdge[i].x.toFixed(2)},${rightEdge[i].y.toFixed(2)} `;
      }
      streamPath += `A ${lastL.halfW.toFixed(2)},${(lastL.halfW * 0.7).toFixed(2)} 0 0,1 ${lastL.x.toFixed(2)},${lastL.y.toFixed(2)} `;
      for (let i = leftEdge.length - 2; i >= 0; i--) {
        streamPath += `L ${leftEdge[i].x.toFixed(2)},${leftEdge[i].y.toFixed(2)} `;
      }
      streamPath += 'Z';

      const highlightPath = 'M ' + centerCurve.join(' L ');

      const isCatTarget = dstBottle && dstBottle.isGiantCat;
      const dstCapVal = dstBottle ? (dstBottle.maxCap || 4) : 4;
      const { vbMinX, vbMinY, vbW, vbH } = getBottleLayerMetrics(dstCapVal, isCatTarget);
      const dstNeckOffsetY = getNeckOffsetY(dstCapVal, isCatTarget);

      const scale = Math.min(dstRect.width / vbW, dstRect.height / vbH);
      const offX = dstRect.left + (dstRect.width - vbW * scale) * 0.5 - vbMinX * scale;
      const offY = dstRect.top + (dstRect.height - vbH * scale) * 0.5 - vbMinY * scale;
      const sx = (x) => (offX + x * scale).toFixed(2);
      const sy = (y) => (offY + (y + dstNeckOffsetY) * scale).toFixed(2);

      let impactFoamHTML = '';
      if (headRatio >= 0.98 && tailRatio < 0.88) {
        const cx = mouthX;
        const cy = surfaceY;
        const rScale = scale;

        const isEmptyBottleStart = (initialDstLayers === 0);
        const isMultiUnitPour = (moveCount >= 2);
        const buildup = isMultiUnitPour ? (0.88 + 0.38 * Math.sin(pourProgress * Math.PI)) : 0.85;
        const intensity = (0.85 + Math.min(2, moveCount - 1) * 0.28) * buildup;

        const w1 = Math.sin(pourProgress * (16 + moveCount * 4)) * (1.1 * intensity);
        const w2 = Math.cos(pourProgress * (18 + moveCount * 4)) * (0.95 * intensity);

        let subWaterFX = '';
        let ripplesFX = '';
        let crownAndBubblesFX = '';
        let airborneDropsFX = '';

        if (!isEmptyBottleStart || currentTotalLayers > 0.55) {
          const maxPoolDepthPx = Math.min(48, currentTotalLayers * 24);
          const plungeDepth = Math.min(maxPoolDepthPx, (isEmptyBottleStart ? 11 : 17) * intensity);

          subWaterFX += `
            <path d="M ${(-3.8 * fluxRadiusBoost).toFixed(1)},1
                     Q ${(-2.2 * fluxRadiusBoost).toFixed(1)},${(plungeDepth * 0.7).toFixed(1)} 0,${plungeDepth.toFixed(1)}
                     Q ${(2.2 * fluxRadiusBoost).toFixed(1)},${(plungeDepth * 0.7).toFixed(1)} ${(3.8 * fluxRadiusBoost).toFixed(1)},1 Z"
                  fill="${colObj.topLight}" opacity="0.42" />
          `;

          const bubbleCount = (isEmptyBottleStart ? 2 : 4) + Math.min(2, moveCount - 1) * 3;
          for (let b = 0; b < bubbleCount; b++) {
            const phaseB = (pourProgress * (2.6 + b * 0.35) + b * 0.27) % 1.0;
            const spreadDir = (b % 2 === 0 ? 1 : -1) * (1 + (b % 3) * 0.45);
            const bx = spreadDir * (3.2 + phaseB * 9.5 * intensity) + Math.sin(phaseB * 8 + b) * 1.4;
            const by = 3.0 + (1 - phaseB) * Math.min(maxPoolDepthPx - 3, plungeDepth * 1.35);
            const br = (1.5 + (b % 3) * 0.65) * (1 - phaseB * 0.25);
            subWaterFX += `
              <circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${br.toFixed(1)}"
                      fill="${colObj.topLight}" stroke="#ffffff" stroke-width="0.45" opacity="${(0.78 - phaseB * 0.45).toFixed(2)}" />
            `;
          }

          const ripplePhase1 = (pourProgress * 3.2) % 1.0;
          const ripplePhase2 = (pourProgress * 3.2 + 0.5) % 1.0;
          const rxMax = isMultiUnitPour ? 28 : 21;
          ripplesFX += `
            <ellipse cx="0" cy="0.6" rx="${(7 + ripplePhase1 * rxMax).toFixed(1)}" ry="${(1.8 + ripplePhase1 * 5.2).toFixed(1)}"
                     fill="none" stroke="${colObj.topLight}" stroke-width="${(1.3 * (1 - ripplePhase1)).toFixed(2)}"
                     opacity="${(0.75 * (1 - ripplePhase1)).toFixed(2)}" />
            <ellipse cx="0" cy="0.6" rx="${(7 + ripplePhase2 * rxMax).toFixed(1)}" ry="${(1.8 + ripplePhase2 * 5.2).toFixed(1)}"
                     fill="none" stroke="#ffffff" stroke-width="${(1.0 * (1 - ripplePhase2)).toFixed(2)}"
                     opacity="${(0.55 * (1 - ripplePhase2)).toFixed(2)}" />
          `;
        }

        if (isEmptyBottleStart && currentTotalLayers < 0.92) {
          const hardFactor = Math.max(0.15, 1 - currentTotalLayers / 0.95);
          const splashDropCount = 5 + Math.min(2, moveCount - 1) * 4;
          const crownSpread = (12 + Math.min(2, moveCount - 1) * 4.5) * (0.75 + 0.25 * hardFactor);
          const crownHeight = (11 + Math.min(2, moveCount - 1) * 4.0) * (0.75 + 0.25 * hardFactor);

          ripplesFX += `
            <ellipse cx="0" cy="0.8" rx="${(15 + Math.min(2, moveCount - 1) * 4 + Math.abs(w1) * 2.5).toFixed(1)}"
                     ry="${(3.4 + Math.abs(w2) * 0.6).toFixed(1)}"
                     fill="${colObj.topLight}" opacity="${(0.58 * hardFactor).toFixed(2)}" />
            <path d="M -3,0
                     Q ${(-crownSpread * 0.55).toFixed(1)},${(-crownHeight * 0.95 - w1).toFixed(1)} ${(-crownSpread).toFixed(1)},${(-crownHeight * 0.55 + w2).toFixed(1)}
                     Q ${(-crownSpread * 0.65).toFixed(1)},${(-crownHeight * 0.15).toFixed(1)} -2,1 Z"
                  fill="${colObj.topLight}" opacity="${(0.88 * hardFactor).toFixed(2)}" />
            <path d="M 3,0
                     Q ${(crownSpread * 0.55).toFixed(1)},${(-crownHeight * 0.95 + w2).toFixed(1)} ${(crownSpread).toFixed(1)},${(-crownHeight * 0.55 - w1).toFixed(1)}
                     Q ${(crownSpread * 0.65).toFixed(1)},${(-crownHeight * 0.15).toFixed(1)} 2,1 Z"
                  fill="${colObj.topLight}" opacity="${(0.88 * hardFactor).toFixed(2)}" />
          `;

          for (let d = 0; d < splashDropCount; d++) {
            const tDrop = (pourProgress * (3.8 + d * 0.35) + d * 0.17) % 1.0;
            const side = d % 2 === 0 ? 1 : -1;
            const maxXReach = side * (9 + (d % 3) * 5.2 + Math.min(2, moveCount - 1) * 3.5);
            const peakHeight = (10 + (d % 3) * 4.8 + Math.min(2, moveCount - 1) * 3.8) * (0.7 + 0.3 * hardFactor);
            const dx = maxXReach * (0.25 + 0.75 * tDrop);
            const dy = -Math.sin(tDrop * Math.PI) * peakHeight - 1.5;
            const dr = (1.6 + (d % 2) * 0.65 + Math.min(2, moveCount - 1) * 0.25) * (1 - tDrop * 0.35);
            airborneDropsFX += `
              <circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="${dr.toFixed(1)}"
                      fill="${colObj.topLight}" stroke="#ffffff" stroke-width="0.35" opacity="${(0.92 * hardFactor).toFixed(2)}" />
            `;
          }
        }

        const cW = 10.5 * intensity;
        const cH = (9.5 + Math.min(2, moveCount - 1) * 3.2) * buildup;
        crownAndBubblesFX += `
          <path d="M ${(-cW).toFixed(1)},-0.5
                   Q ${(-cW * 0.65).toFixed(1)},${(-cH - w1).toFixed(1)} 0,${(-cH * 0.82 + w2).toFixed(1)}
                   Q ${(cW * 0.65).toFixed(1)},${(-cH - w2).toFixed(1)} ${cW.toFixed(1)},-0.5 Z"
                fill="${colObj.mid}" />
          <path d="M ${(-cW * 0.7).toFixed(1)},-0.5
                   Q 0,${(-cH * 1.12 - w1).toFixed(1)} ${(cW * 0.7).toFixed(1)},-0.5 Z"
                fill="${colObj.topMid}" opacity="0.94" />
        `;

        const bScale = 0.86 + Math.min(2, moveCount - 1) * 0.18;
        crownAndBubblesFX += `
          <g transform="translate(${(-4.6 * bScale + w1 * 0.25).toFixed(1)}, ${(0.8 + w2 * 0.15).toFixed(1)}) scale(${bScale.toFixed(2)})">
            <circle cx="0" cy="0" r="4.1" fill="${colObj.right}" opacity="0.62" />
            <circle cx="0.5" cy="-0.8" r="3.3" fill="${colObj.topMid}" />
            <circle cx="0.9" cy="-1.3" r="2.0" fill="${colObj.topLight}" />
          </g>
          <g transform="translate(${(4.6 * bScale - w2 * 0.25).toFixed(1)}, ${(1.0 - w1 * 0.15).toFixed(1)}) scale(${bScale.toFixed(2)})">
            <circle cx="0" cy="0" r="3.9" fill="${colObj.right}" opacity="0.62" />
            <circle cx="-0.5" cy="-0.8" r="3.1" fill="${colObj.topMid}" />
            <circle cx="-0.9" cy="-1.3" r="1.8" fill="${colObj.topLight}" />
          </g>
        `;

        if (isMultiUnitPour) {
          const extraS = 0.72 + Math.min(1, moveCount - 2) * 0.22;
          crownAndBubblesFX += `
            <g transform="translate(${(-9.2 + w2 * 0.35).toFixed(1)}, ${(-0.4 - w1 * 0.2).toFixed(1)}) scale(${extraS.toFixed(2)})">
              <circle cx="0" cy="0" r="3.8" fill="${colObj.right}" opacity="0.55" />
              <circle cx="0.4" cy="-0.7" r="3.1" fill="${colObj.topMid}" />
              <circle cx="0.8" cy="-1.2" r="1.8" fill="${colObj.topLight}" />
            </g>
            <g transform="translate(${(9.2 - w1 * 0.35).toFixed(1)}, ${(-0.2 + w2 * 0.2).toFixed(1)}) scale(${extraS.toFixed(2)})">
              <circle cx="0" cy="0" r="3.7" fill="${colObj.right}" opacity="0.55" />
              <circle cx="-0.4" cy="-0.7" r="3.0" fill="${colObj.topMid}" />
              <circle cx="-0.8" cy="-1.2" r="1.7" fill="${colObj.topLight}" />
            </g>
          `;
        }

        impactFoamHTML = `
          <g transform="translate(${cx.toFixed(2)}, ${cy.toFixed(2)}) scale(${rScale.toFixed(3)})">
            ${ripplesFX}
            ${subWaterFX}
            ${crownAndBubblesFX}
            ${airborneDropsFX}
          </g>
        `;
      }

      return `
        <defs>
          <linearGradient id="liveStreamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="${colObj.left}" />
            <stop offset="45%" stop-color="${colObj.topLight}" />
            <stop offset="82%" stop-color="${colObj.mid}" />
            <stop offset="100%" stop-color="${colObj.right}" />
          </linearGradient>
          <linearGradient id="frontCollarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#1c2747"/>
            <stop offset="22%" stop-color="#52689c"/>
            <stop offset="48%" stop-color="#253561"/>
            <stop offset="75%" stop-color="#ffffff"/>
            <stop offset="88%" stop-color="#6884c7"/>
            <stop offset="100%" stop-color="#16203d"/>
          </linearGradient>
        </defs>
        <path d="${streamPath}" fill="url(#liveStreamGrad)" />
        <path d="${highlightPath}" fill="none" stroke="rgba(255,255,255,0.48)" stroke-width="1.6" stroke-linecap="round" />
        ${impactFoamHTML}
        <path d="M ${sx(33.8)},${sy(22.5)}
                 Q ${sx(35.2)},${sy(26.0)} ${sx(34.5)},${sy(28.5)}
                 A ${(15.8 * scale).toFixed(2)},${(3.2 * scale).toFixed(2)} 0 0,0 ${sx(65.5)},${sy(28.5)}
                 Q ${sx(64.8)},${sy(26.0)} ${sx(66.2)},${sy(22.5)} Z"
              fill="#081642" opacity="0.46" />
        <path d="M ${sx(28.5)},${sy(11.0)}
                 C ${sx(26.8)},${sy(15.2)} ${sx(28.0)},${sy(20.5)} ${sx(33.8)},${sy(23.2)}
                 A ${(17.2 * scale).toFixed(2)},${(4.2 * scale).toFixed(2)} 0 0,0 ${sx(66.2)},${sy(23.2)}
                 C ${sx(72.0)},${sy(20.5)} ${sx(73.2)},${sy(15.2)} ${sx(71.5)},${sy(11.0)}
                 A ${(21.5 * scale).toFixed(2)},${(4.4 * scale).toFixed(2)} 0 0,0 ${sx(28.5)},${sy(11.0)} Z"
              fill="url(#frontCollarGrad)" opacity="0.52"
              stroke="#4d88e5" stroke-width="${(1.1 * scale).toFixed(2)}" />
        <path d="M ${sx(58.5)},${sy(13.2)}
                 C ${sx(63.0)},${sy(13.0)} ${sx(65.2)},${sy(13.5)} ${sx(64.5)},${sy(17.2)}
                 C ${sx(63.8)},${sy(20.2)} ${sx(61.5)},${sy(22.2)} ${sx(57.5)},${sy(22.6)}
                 C ${sx(58.2)},${sy(19.5)} ${sx(58.8)},${sy(16.2)} ${sx(58.5)},${sy(13.2)} Z"
              fill="rgba(225, 242, 255, 0.68)" />
        <path d="M ${sx(29.5)},${sy(11.4)} A ${(20.8 * scale).toFixed(2)},${(4.1 * scale).toFixed(2)} 0 0,0 ${sx(70.5)},${sy(11.4)}"
              fill="none" stroke="#b8d8ff" stroke-width="${(1.3 * scale).toFixed(2)}" />
        <path d="M ${sx(33.2)},${sy(23.0)} A ${(17.5 * scale).toFixed(2)},${(4.2 * scale).toFixed(2)} 0 0,0 ${sx(66.8)},${sy(23.0)}"
              fill="none" stroke="#6ea6f7" stroke-width="${(1.4 * scale).toFixed(2)}" stroke-linecap="round" />
      `;
    }

    function performLiquidPour(srcIdx, dstIdx) {
      isAnimating = true;
      moveHistory.push(cloneState());

      if (remainingMoves !== null) {
        remainingMoves = Math.max(0, remainingMoves - 1);
        const movesBadge = document.getElementById('moves-badge');
        movesBadge.classList.toggle('danger', remainingMoves <= 4);
        document.getElementById('moves-left-num').textContent = remainingMoves;
      }

      const gridEl = document.getElementById('bottles-grid');
      const srcEl = gridEl.children[srcIdx];
      const dstEl = gridEl.children[dstIdx];

      srcEl.classList.remove('selected');
      srcEl.classList.add('pouring-source');
      dstEl.classList.add('pouring-target');

      const srcRect = srcEl.getBoundingClientRect();
      const dstRect = dstEl.getBoundingClientRect();
      const startCenterX = srcRect.left + srcRect.width * 0.5;
      const startCenterY = srcRect.top + srcRect.height * 0.5;

      const srcBottle = bottles[srcIdx];
      const dstBottle = bottles[dstIdx];
      const srcCap = srcBottle.maxCap || 4;
      const dstCap = dstBottle.maxCap || 4;
      const initialDstLayers = dstBottle.layers.length;
      const pourColorKey = srcBottle.layers[srcBottle.layers.length - 1];
      const colObj = COLORS[pourColorKey];

      const srcRevealedStart = srcBottle.mysteryCount || 0;
      let moveCount = 0;
      for (let i = srcBottle.layers.length - 1; i >= srcRevealedStart; i--) {
        if (srcBottle.layers[i] === pourColorKey && dstBottle.layers.length + moveCount < dstCap) {
          moveCount++;
        } else {
          break;
        }
      }

      let srcTopSameCount = 0;
      for (let i = srcBottle.layers.length - 1; i >= srcRevealedStart; i--) {
        if (srcBottle.layers[i] === pourColorKey) srcTopSameCount++;
        else break;
      }

      const dstFullLayers = [...dstBottle.layers];
      for (let k = 0; k < moveCount; k++) dstFullLayers.push(pourColorKey);

      const dstMyst = dstBottle.mysteryCount || 0;
      let dstTopSameAfter = 0;
      for (let i = dstFullLayers.length - 1; i >= dstMyst; i--) {
        if (dstFullLayers[i] === pourColorKey) dstTopSameAfter++;
        else break;
      }
      const dstInitialScale = (dstTopSameAfter - moveCount) / dstTopSameAfter;

      const pourDir = (srcRect.left <= dstRect.left) ? 1 : -1;

      const srcNeckOffsetY = getNeckOffsetY(srcCap, !!srcBottle.isGiantCat);
      const dstNeckOffsetY = getNeckOffsetY(dstCap, !!dstBottle.isGiantCat);
      const { vbMinX: srcVbMinX, vbMinY: srcVbMinY, vbW: srcVbW, vbH: srcVbH } = getBottleLayerMetrics(srcCap, !!srcBottle.isGiantCat);
      const { vbMinX: dstVbMinX, vbMinY: dstVbMinY, vbW: dstVbW, vbH: dstVbH } = getBottleLayerMetrics(dstCap, !!dstBottle.isGiantCat);

      const pivotSvgX = 50 + pourDir * 12.0;
      const pivotSvgY = 12.5 + srcNeckOffsetY;
      const pivotXRatio = (pivotSvgX - srcVbMinX) / srcVbW;
      const pivotYRatio = (pivotSvgY - srcVbMinY) / srcVbH;
      srcEl.style.transformOrigin = `${(pivotXRatio * 100).toFixed(2)}% ${(pivotYRatio * 100).toFixed(2)}%`;

      const srcLipX = srcRect.left + srcRect.width * pivotXRatio;
      const srcLipY = srcRect.top + srcRect.height * pivotYRatio;

      const dstMouthX = dstRect.left + dstRect.width * ((50 - dstVbMinX) / dstVbW);
      const dstMouthY = dstRect.top + dstRect.height * ((11.5 + dstNeckOffsetY - dstVbMinY) / dstVbH);

      const targetLipX = dstMouthX - pourDir * 1.0;
      const targetLipY = dstMouthY - 6.0;

      const targetTranslateX = targetLipX - srcLipX;
      const targetTranslateY = targetLipY - srcLipY;

      const startVol = srcBottle.layers.length;
      const endVol = srcBottle.layers.length - moveCount;
      const startTiltDeg = pourDir * getPhysicalSpillAngleDeg(startVol, srcCap);
      const endTiltDeg = pourDir * getPhysicalSpillAngleDeg(endVol, srcCap);

      const srcLiquidGroup = document.getElementById(`liquid-group-${srcIdx}`);
      const dstLiquidGroup = document.getElementById(`liquid-group-${dstIdx}`);
      const fxSvg = document.getElementById('fx-overlay');

      const moveDuration = 260;
      const pourDuration = 460 + (moveCount - 1) * 105;
      const returnDuration = 240;
      const startTime = performance.now();
      let soundPlayed = false;

      const { bottomY: dstBotY, layerH: dstLayerH } = getBottleLayerMetrics(dstCap, !!dstBottle.isGiantCat);

      function getTiltedBottleCenter(tx, ty, deg) {
        const rad = (deg * Math.PI) / 180;
        const dxC = (0.5 - pivotXRatio) * srcRect.width;
        const dyC = (0.55 - pivotYRatio) * srcRect.height;
        const rotX = dxC * Math.cos(rad) - dyC * Math.sin(rad);
        const rotY = dxC * Math.sin(rad) + dyC * Math.cos(rad);
        return {
          cx: srcLipX + tx + rotX,
          cy: srcLipY + ty + rotY
        };
      }

      function step(now) {
        const elapsed = now - startTime;
        const animTimeSec = elapsed / 1000;

        if (elapsed < moveDuration) {
          const p = elapsed / moveDuration;
          const ease = 1 - Math.pow(1 - p, 3);
          const curX = targetTranslateX * ease;
          const curY = targetTranslateY * ease;
          const curDeg = startTiltDeg * ease;

          srcEl.style.transform = `translate(${curX.toFixed(2)}px, ${curY.toFixed(2)}px) rotate(${curDeg.toFixed(2)}deg)`;
          srcLiquidGroup.innerHTML = buildLiquidLayersMarkup(srcBottle.layers, srcIdx, {
            topLayerScale: 1,
            tiltAngle: curDeg,
            pourDir,
            spillProgress: ease,
            mysteryCount: srcBottle.mysteryCount || 0,
            maxCap: srcCap,
            isGiantCat: !!srcBottle.isGiantCat
          });

          const bCenter = getTiltedBottleCenter(curX, curY, curDeg);
          fxSvg.innerHTML = buildBottleMoveTrailSVG(
            startCenterX, startCenterY,
            bCenter.cx, bCenter.cy,
            srcRect.width, srcRect.height,
            curDeg, colObj, animTimeSec, Math.sin(p * Math.PI * 0.5)
          );

          requestAnimationFrame(step);

        } else if (elapsed < moveDuration + pourDuration) {
          if (!soundPlayed) {
            soundPlayed = true;
            playSound('pour', {
              maxCap: dstCap,
              isGiantCat: !!dstBottle.isGiantCat,
              initialLayers: initialDstLayers,
              moveCount,
              durationMs: pourDuration
            });
          }

          const p = (elapsed - moveDuration) / pourDuration;
          const curRemainingVol = startVol - moveCount * p;
          const curDeg = pourDir * getPhysicalSpillAngleDeg(curRemainingVol, srcCap);

          srcEl.style.transform = `translate(${targetTranslateX.toFixed(2)}px, ${targetTranslateY.toFixed(2)}px) rotate(${curDeg.toFixed(2)}deg)`;

          const srcEndScale = (srcTopSameCount - moveCount) / srcTopSameCount;
          const curSrcScale = 1 - (1 - srcEndScale) * p;
          srcLiquidGroup.innerHTML = buildLiquidLayersMarkup(srcBottle.layers, srcIdx, {
            topLayerScale: curSrcScale,
            tiltAngle: curDeg,
            pourDir,
            spillProgress: 1,
            mysteryCount: srcBottle.mysteryCount || 0,
            maxCap: srcCap,
            isGiantCat: !!srcBottle.isGiantCat
          });

          const fillP = Math.max(0, Math.min(1, (p - 0.08) / 0.92));
          const curDstScale = dstInitialScale + (1 - dstInitialScale) * fillP;
          dstLiquidGroup.innerHTML = buildLiquidLayersMarkup(dstFullLayers, dstIdx, {
            topLayerScale: curDstScale,
            tiltAngle: 0,
            mysteryCount: dstBottle.mysteryCount || 0,
            maxCap: dstCap,
            isGiantCat: !!dstBottle.isGiantCat
          });

          const currentTotalLayers = initialDstLayers + moveCount * fillP;
          const svgSurfaceY = dstBotY - currentTotalLayers * dstLayerH;
          const screenSurfaceY = dstRect.top + ((svgSurfaceY - dstVbMinY) / dstVbH) * dstRect.height;

          const spoutStartX = dstMouthX;
          const spoutStartY = targetLipY - 1.5;

          const bCenter = getTiltedBottleCenter(targetTranslateX, targetTranslateY, curDeg);
          const trailHTML = buildBottleMoveTrailSVG(
            startCenterX, startCenterY,
            bCenter.cx, bCenter.cy,
            srcRect.width, srcRect.height,
            curDeg, colObj, animTimeSec, 0.92
          );

          fxSvg.innerHTML = trailHTML + buildGravityStreamSVG(
            spoutStartX,
            spoutStartY,
            dstMouthX,
            dstMouthY,
            screenSurfaceY + 2,
            dstRect,
            pourDir,
            colObj,
            p,
            {
              initialDstLayers,
              moveCount,
              currentTotalLayers,
              dstBottle
            }
          );

          requestAnimationFrame(step);

        } else if (elapsed < moveDuration + pourDuration + returnDuration) {
          const p = (elapsed - moveDuration - pourDuration) / returnDuration;
          const ease = 1 - Math.pow(1 - p, 3);
          const curX = targetTranslateX * (1 - ease);
          const curY = targetTranslateY * (1 - ease);
          const curDeg = endTiltDeg * (1 - ease);

          srcEl.style.transform = `translate(${curX.toFixed(2)}px, ${curY.toFixed(2)}px) rotate(${curDeg.toFixed(2)}deg)`;

          const remainingSrcLayers = srcBottle.layers.slice(0, srcBottle.layers.length - moveCount);
          const nextSrcMystery = Math.min(srcBottle.mysteryCount || 0, Math.max(0, remainingSrcLayers.length - 1));
          srcLiquidGroup.innerHTML = buildLiquidLayersMarkup(remainingSrcLayers, srcIdx, {
            topLayerScale: 1,
            tiltAngle: curDeg,
            pourDir,
            spillProgress: 1 - ease,
            mysteryCount: nextSrcMystery,
            maxCap: srcCap,
            isGiantCat: !!srcBottle.isGiantCat
          });

          dstLiquidGroup.innerHTML = buildLiquidLayersMarkup(dstFullLayers, dstIdx, {
            topLayerScale: 1,
            tiltAngle: 0,
            mysteryCount: dstBottle.mysteryCount || 0,
            maxCap: dstCap,
            isGiantCat: !!dstBottle.isGiantCat
          });

          const bCenter = getTiltedBottleCenter(curX, curY, curDeg);
          fxSvg.innerHTML = buildBottleMoveTrailSVG(
            startCenterX, startCenterY,
            bCenter.cx, bCenter.cy,
            srcRect.width, srcRect.height,
            curDeg, colObj, animTimeSec, Math.max(0, 1 - ease) * 0.75
          );

          requestAnimationFrame(step);

        } else {
          fxSvg.innerHTML = '';
          srcEl.style.transform = '';
          srcEl.style.transformOrigin = '';
          srcEl.classList.remove('pouring-source');
          dstEl.classList.remove('pouring-target');

          for (let k = 0; k < moveCount; k++) {
            srcBottle.layers.pop();
            dstBottle.layers.push(pourColorKey);
          }

          let revealedMysteryLayerIdx = null;
          let revealedMysteryColorKey = null;
          if (srcBottle.mysteryCount && srcBottle.mysteryCount > 0 && srcBottle.layers.length <= srcBottle.mysteryCount) {
            revealedMysteryLayerIdx = srcBottle.layers.length - 1;
            revealedMysteryColorKey = srcBottle.layers[revealedMysteryLayerIdx];
            srcBottle.mysteryCount = Math.max(0, srcBottle.layers.length - 1);
          }

          pourCountTotal++;
          const brokenObstacles = [];
          bottles.forEach((b, bIdx) => {
            if (!b.removed && !b.corked && (b.special === 'ice_base' || b.special === 'stone_base') && b.poursToBreak) {
              b.poursToBreak--;
              if (b.poursToBreak <= 0) {
                const wasIce = b.special === 'ice_base';
                b.special = 'none';
                brokenObstacles.push({ bIdx, type: wasIce ? 'ice_shatter' : 'stone_shatter', wasIce });
              }
            }
          });

          selectedIndex = null;
          const cfg = getLevelConfig(currentLevelId);

          if (isCompleteBottle(dstBottle)) {
            dstBottle.corked = true;
            dstBottle.corkAnimProgress = 0;
            renderAll();

            if (revealedMysteryLayerIdx !== null && revealedMysteryLayerIdx >= 0) {
              playSound('mystery_reveal');
              triggerBottleVFX(srcIdx, 'mystery_reveal', {
                layerIdx: revealedMysteryLayerIdx,
                colorKey: revealedMysteryColorKey
              });
            }
            brokenObstacles.forEach(item => {
              playSound(item.wasIce ? 'ice_break' : 'stone_break');
              triggerBottleVFX(item.bIdx, item.type);
            });

            const targetSlotEl = document.getElementById('bottles-grid').children[dstIdx];
            const neckGroupEl = document.getElementById(`neck-group-${dstIdx}`);
            const corkFxEl = document.getElementById(`cork-fx-${dstIdx}`);
            const neckOff = getNeckOffsetY(dstCap, !!dstBottle.isGiantCat);

            const corkStart = performance.now();
            const useBagSpiral = !!cfg.hasBags;
            const corkDur = useBagSpiral ? 680 : 480;
            let slamSoundPlayed = false;
            let packSoundPlayed = false;

            function stepCorkAnim(tNow) {
              const cp = Math.min(1, (tNow - corkStart) / corkDur);
              dstBottle.corkAnimProgress = cp;

              if (cp >= 0.16 && !slamSoundPlayed) {
                slamSoundPlayed = true;
                playSound('cork_slam');
              }

              if (cp >= 0.16 && cp < 0.38) {
                const hitP = (cp - 0.16) / 0.22;
                const squash = Math.sin(hitP * Math.PI * 2.2) * Math.exp(-3.0 * hitP);
                if (targetSlotEl) {
                  const bScaleX = 1 + squash * 0.07;
                  const bScaleY = 1 - squash * 0.09;
                  const bTransY = squash * 6.5;
                  targetSlotEl.style.transformOrigin = '50% 100%';
                  targetSlotEl.style.transform = `translateY(${bTransY.toFixed(2)}px) scale(${bScaleX.toFixed(3)}, ${bScaleY.toFixed(3)})`;
                }
                if (neckGroupEl) {
                  const nScaleX = 1 + squash * 0.12;
                  const nScaleY = 1 - squash * 0.22;
                  const nTransY = squash * 5.2;
                  neckGroupEl.setAttribute(
                    'transform',
                    `translate(50, ${(16 + neckOff + nTransY).toFixed(2)}) scale(${nScaleX.toFixed(3)}, ${nScaleY.toFixed(3)}) translate(-50, -16)`
                  );
                }
              } else if (cp >= 0.38) {
                if (targetSlotEl) targetSlotEl.style.transform = '';
                if (neckGroupEl) neckGroupEl.setAttribute('transform', `translate(0, ${neckOff})`);
              }

              if (useBagSpiral && cp >= 0.20 && !packSoundPlayed) {
                packSoundPlayed = true;
                playSound('pack');
              } else if (!useBagSpiral && cp >= 0.35 && !packSoundPlayed) {
                packSoundPlayed = true;
                playSound('pack');
              }

              if (corkFxEl) {
                corkFxEl.innerHTML = renderRibbonAndDroppingCorkMarkup(dstIdx, cp, neckOff, dstBotY, useBagSpiral);
              }

              if (cp < 1) {
                requestAnimationFrame(stepCorkAnim);
              } else {
                if (useBagSpiral) {
                  packCompletedBottleIntoBag(dstIdx, pourColorKey);
                } else {
                  dstBottle.corkAnimProgress = 1.0;
                  packedTotal++;
                  const unveiledList = unlockBagOrderObstacles();
                  isAnimating = false;
                  renderAll();
                  unveiledList.forEach(u => triggerBottleVFX(u.bIdx, u.vfxType, u.opts));
                  if (dstBottle.isGiantCat || bottles.every(b => b.corked || b.removed || b.layers.length === 0)) {
                    setTimeout(() => showWinModal(!!dstBottle.isGiantCat), 220);
                  } else {
                    checkStepLimitOut();
                  }
                }
              }
            }
            requestAnimationFrame(stepCorkAnim);
          } else {
            isAnimating = false;
            renderAll();

            if (revealedMysteryLayerIdx !== null && revealedMysteryLayerIdx >= 0) {
              playSound('mystery_reveal');
              triggerBottleVFX(srcIdx, 'mystery_reveal', {
                layerIdx: revealedMysteryLayerIdx,
                colorKey: revealedMysteryColorKey
              });
              showToast(`✨ 星雾散尽：显露【${COLORS[revealedMysteryColorKey].name}】！`);
            }
            brokenObstacles.forEach(item => {
              playSound(item.wasIce ? 'ice_break' : 'stone_break');
              triggerBottleVFX(item.bIdx, item.type);
              showToast(item.wasIce ? '❄️ 共振破冰：极地霜晶座已碎裂！' : '🪨 共振碎石：曜石底座已崩解！');
            });

            checkStepLimitOut();
          }
        }
      }

      requestAnimationFrame(step);
    }

    function unlockBagOrderObstacles() {
      const unveiled = [];
      bottles.forEach((b, bIdx) => {
        if (!b.removed && ['silk_drape', 'full_ice', 'paper_bag'].includes(b.special) && packedTotal >= (b.unlockOrder || 1)) {
          const prevSpec = b.special;
          b.special = 'none';
          if (prevSpec === 'full_ice') {
            playSound('ice_break');
            unveiled.push({ bIdx, vfxType: 'ice_shatter', opts: { fullBody: true } });
            showToast('🧊 礼盒契约达成：极地全冰雕瓶已破冰！');
          } else {
            playSound('mystery_reveal');
            unveiled.push({ bIdx, vfxType: 'cover_unveil', opts: { coverType: prevSpec } });
            showToast(prevSpec === 'silk_drape' ? '🧣 礼盒契约达成：星缎礼袍已揭幕！' : '🛍️ 礼盒契约达成：羊皮礼袋已解封！');
          }
        }
      });
      return unveiled;
    }

    function checkStepLimitOut() {
      if (remainingMoves !== null && remainingMoves <= 0 && !bottles.every(b => b.corked || b.removed || b.layers.length === 0)) {

    function packCompletedBottleIntoBag(bottleIdx, colorKey) {
      const completedBottle = bottles[bottleIdx];
      const wasGiantCat = !!completedBottle.isGiantCat;

      let targetBagIdx = bags.findIndex(b => !b.locked && !b.packedBottle && b.color === colorKey);
      if (targetBagIdx === -1) {
        targetBagIdx = bags.findIndex(b => !b.locked && !b.packedBottle);
      }
      if (targetBagIdx === -1) {
        targetBagIdx = bags.findIndex(b => !b.locked && b.color === colorKey);
      }
      if (targetBagIdx === -1) {
        targetBagIdx = bags.findIndex(b => !b.locked);
      }
      if (targetBagIdx !== -1) {
        bags[targetBagIdx].color = colorKey;
      }

      const gridEl = document.getElementById('bottles-grid');
      const bagsEl = document.getElementById('bags-stage');
      const bottleEl = gridEl.children[bottleIdx];
      const bagEl = bagsEl.children[targetBagIdx];

      if (!bagEl || !bottleEl) {
        bottles[bottleIdx].layers = [];
        bottles[bottleIdx].corked = false;
        bottles[bottleIdx].removed = true;
        packedTotal++;
        const unveiledList = unlockBagOrderObstacles();
        isAnimating = false;
        renderAll();
        unveiledList.forEach(u => triggerBottleVFX(u.bIdx, u.vfxType, u.opts));
        if (wasGiantCat || bottles.every(b => b.corked || b.removed || b.layers.length === 0)) {
          showWinModal(wasGiantCat);
        }
        return;
      }

      const corkFxEl = document.getElementById(`cork-fx-${bottleIdx}`);
      if (corkFxEl) {
        const neckOff = getNeckOffsetY(completedBottle.maxCap || 4, !!completedBottle.isGiantCat);
        corkFxEl.innerHTML = `<g transform="translate(0, ${neckOff})">${renderIkeaWoodCorkSVG(bottleIdx, true, false)}</g>`;
      }

      const bRect = bottleEl.getBoundingClientRect();
      const bagRect = bagEl.getBoundingClientRect();
      const startX = bRect.left + bRect.width * 0.5;
      const startY = bRect.top + bRect.height * 0.5;

      const mouthX = bagRect.left + bagRect.width * 0.48;
      const mouthY = bagRect.top + bagRect.height * 0.14;
      const insideWindowX = bagRect.left + bagRect.width * 0.48;
      const insideWindowY = bagRect.top + bagRect.height * 0.62;

      bottleEl.style.zIndex = '120';
      bottleEl.style.transition = 'none';

      const fxSvg = document.getElementById('fx-overlay');
      const colObj = COLORS[colorKey] || COLORS.green;
      const flyDur = 400;
      const dropInDur = 180;
      const flyStart = performance.now();

      function stepFlyToBag(now) {
        const elapsed = now - flyStart;
        if (elapsed < flyDur) {
          const t = elapsed / flyDur;
          const ease = 1 - Math.pow(1 - t, 2.6);
          const ctrlX = (startX + mouthX) * 0.5;
          const ctrlY = Math.min(startY, mouthY) - 68;

          const mt = 1 - ease;
          const curX = mt * mt * startX + 2 * mt * ease * ctrlX + ease * ease * mouthX;
          const curY = mt * mt * startY + 2 * mt * ease * ctrlY + ease * ease * mouthY;
          const curScale = 1 - 0.64 * ease;
          const curRot = Math.sin(t * Math.PI) * (mouthX >= startX ? 12 : -12);

          const tx = curX - startX;
          const ty = curY - startY;
          bottleEl.style.transform = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) rotate(${curRot.toFixed(1)}deg) scale(${curScale.toFixed(3)})`;

          fxSvg.innerHTML = buildBottleMoveTrailSVG(
            startX, startY, curX, curY,
            bRect.width * curScale, bRect.height * curScale,
            curRot, colObj, elapsed / 1000, 0.85
          );
          requestAnimationFrame(stepFlyToBag);

        } else if (elapsed < flyDur + dropInDur) {
          fxSvg.innerHTML = '';
          const t2 = (elapsed - flyDur) / dropInDur;
          const ease2 = t2 * t2;
          const curX = mouthX + (insideWindowX - mouthX) * ease2;
          const curY = mouthY + (insideWindowY - mouthY) * ease2;
          const curScale = 0.36 - 0.08 * ease2;
          const tx = curX - startX;
          const ty = curY - startY;

          bottleEl.style.transform = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) scale(${curScale.toFixed(3)})`;
          bottleEl.style.opacity = (1 - ease2 * 0.85).toFixed(2);
          requestAnimationFrame(stepFlyToBag);

        } else {
          // 阶段 1：塞着木塞的满瓶落入购物袋透明窗内，触发吧台「叮——！」清脆出餐铃声与 🛎️ 金色声波光环！
          fxSvg.innerHTML = '';
          bottleEl.style.transform = '';
          bottleEl.style.opacity = '';
          bottles[bottleIdx].layers = [];
          bottles[bottleIdx].corked = false;
          bottles[bottleIdx].removed = true;

          bags[targetBagIdx].color = colorKey;
          bags[targetBagIdx].packedBottle = colorKey;
          packedTotal++;

          const unveiledList = unlockBagOrderObstacles();

          renderAll();
          playSound('service_bell');

          const bagsStageEl = document.getElementById('bags-stage');
          const updatedBagEl = bagsStageEl ? bagsStageEl.children[targetBagIdx] : null;
          if (updatedBagEl) {
            updatedBagEl.classList.add('packing-bounce');
            showBagServiceBellEffect(updatedBagEl);
          }
          unveiledList.forEach(u => triggerBottleVFX(u.bIdx, u.vfxType, u.opts));

          const isLevelCleared = wasGiantCat || bottles.every(b => b.corked || b.removed || b.layers.length === 0);

          // 阶段 2：出餐铃响、购物袋弹性接住瓶子后，以顶部白色圆绳提手为支点向上摇摆拎走（伴随上扬音效与底部星尘尾迹）
          setTimeout(() => {
            const bagSlotNow = document.getElementById('bags-stage')?.children[targetBagIdx];
            if (!bagSlotNow) {
              isAnimating = false;
              renderAll();
              if (isLevelCleared) showWinModal(wasGiantCat);
              else checkStepLimitOut();
              return;
            }

            bagSlotNow.classList.remove('packing-bounce');
            bagSlotNow.classList.add('bag-carry-away');
            playSound('bag_whoosh');

            // 拎走购物袋底部飘落的璀璨星尘尾迹
            const bSlotRect = bagSlotNow.getBoundingClientRect();
            const trailStart = performance.now();
            const trailDur = 520;
            function stepBagCarryTrail(tNow) {
              const p = Math.min(1, (tNow - trailStart) / trailDur);
              if (p < 1) {
                const liftY = bSlotRect.bottom - 18 - Math.pow(p, 1.5) * 115;
                const centerX = bSlotRect.left + bSlotRect.width * 0.5 + Math.sin(p * Math.PI * 2.5) * 6;
                let sparkles = '';
                for (let s = 0; s < 10; s++) {
                  const u1 = hash01(s * 11 + 1);
                  const u2 = hash01(s * 11 + 2);
                  const sx = centerX + (u1 - 0.5) * bSlotRect.width * 0.72;
                  const sy = liftY + u2 * 38;
                  const sr = (1.5 + (s % 3) * 0.9) * (1 - p * 0.75);
                  const sCol = (s % 2 === 0) ? '#fde047' : colObj.topLight;
                  sparkles += `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${sr.toFixed(2)}" fill="${sCol}" opacity="${((1 - p) * 0.88).toFixed(2)}" />`;
                }
                fxSvg.innerHTML = sparkles;
                requestAnimationFrame(stepBagCarryTrail);
              } else {
                fxSvg.innerHTML = '';
              }
            }
            requestAnimationFrame(stepBagCarryTrail);

            // 阶段 3：旧购物袋拎走完毕，判断盘面是否还有剩余未装袋药水瓶，若有则从上方落下新的目标色购物袋并弹性回弹就位！
            setTimeout(() => {
              fxSvg.innerHTML = '';
              if (isLevelCleared) {
                isAnimating = false;
                renderAll();
                showWinModal(wasGiantCat);
                return;
              }

              // 计算盘面剩余未打包的药水颜色，为当前槽位补充新的目标色空购物袋
              bags[targetBagIdx].packedBottle = null;
              bags[targetBagIdx].lastPackedColor = null;
              bags[targetBagIdx].color = pickNextNeededBagColor();
              bags.forEach(bg => {
                if (!bg.locked && !bg.packedBottle) {
                  bg.color = pickNextNeededBagColor();
                }
              });

              renderAll();
              const newBagSlotEl = document.getElementById('bags-stage')?.children[targetBagIdx];
              if (newBagSlotEl) {
                newBagSlotEl.classList.add('bag-drop-in');
                playSound('bag_drop');
              }

              setTimeout(() => {
                isAnimating = false;
                renderAll();
                checkStepLimitOut();
              }, 460);
            }, 540);
          }, 420);
        }
      }

      requestAnimationFrame(stepFlyToBag);
    }

    // ==========================================
    // 11. 底部 4 大果冻玻璃按钮与弹窗事件绑定
    // ==========================================
    const levelModalMask = document.getElementById('level-modal-mask');

    document.getElementById('shuffle-btn').addEventListener('click', () => {
      if (isAnimating) return;
      const wasFree = shuffleUses > 0;

      for (let i = 0; i < bottles.length; i++) {
        const src = bottles[i];

        for (let j = 0; j < bottles.length; j++) {

            renderAll();
            showToast(wasFree ? '💡 工坊推演：已为您寻得最佳凝萃步！' : '🎬 激励视频推演：已为您自动执行一步！');
            setTimeout(() => performLiquidPour(i, j), 120);
            return;
          }
        }
      }

      for (let i = 0; i < bottles.length; i++) {
        const src = bottles[i];
        if (!canSelectBottleNoToast(src) || new Set(src.layers).size <= 1) continue;
        for (let j = 0; j < bottles.length; j++) {
          if (i === j) continue;
          const dst = bottles[j];
          if (canPourInto(src, dst) && dst.layers.length === 0) {
            selectedIndex = i;
            renderAll();
            showToast('💡 工坊推演：先将顶层秘药腾挪至空瓶！');
            setTimeout(() => performLiquidPour(i, j), 120);
            return;
          }
        }
      }

      const camBottle = bottles.find(b => !b.removed && (b.special === 'ad_cam' || b.special === 'ad_cam_blue'));
      if (camBottle) {
        moveHistory.push(cloneState());
        camBottle.special = 'none';
        playSound('pack');
        showToast('🎬 激励视频辅助：已为您开启一只备用琉璃瓶！');
        renderAll();

    document.getElementById('add-bottle-btn').addEventListener('click', () => {

      const lockedIdx = bottles.findIndex(b => !b.removed && !b.corked && (b.special !== 'none' || (b.mysteryCount && b.mysteryCount > 0)));
      if (lockedIdx !== -1) {
        const lockedBottle = bottles[lockedIdx];

    function showWinModal(wasGiantCat) {
      const cfg = getLevelConfig(currentLevelId);
      const userSteps = Math.max(1, pourCountTotal);
      const optSteps = cfg.optimalMoves || 17;
      const diff = Math.max(0, userSteps - optSteps);

      document.getElementById('modal-badge-pill').textContent = 'PASSED';
      document.getElementById('modal-title').textContent = wasGiantCat
        ? '皇家灵猫凝萃大成'
        : `第 ${currentLevelId} 关完美封存`;
      document.getElementById('modal-sub').textContent = wasGiantCat
        ? '八层秘药尽数汇入灵猫水晶瓶，原木塞已落定封存！'
        : '秘药尽数归宗，星光流转完美封存！';

      document.getElementById('score-user-moves').textContent = `${userSteps} 步`;
      document.getElementById('score-opt-moves').textContent = `${optSteps} 步`;
      document.getElementById('score-diff-moves').textContent = `+${diff}`;

      let praise = '✨ 炉火纯青！你的凝萃技艺逼近理论极致！';
      if (diff === 0) praise = '🏆 传世宗师！你达成了零误差理论最优解！';
      else if (diff > 6) praise = '🎉 渐入佳境！所有特殊器皿均已圆满封存！';
      document.getElementById('score-praise-line').textContent = praise;

      modalMask.classList.add('show');
    }

    function initGame() {
      stopSelectSloshAnimation();
      const cfg = getLevelConfig(currentLevelId);
      bottles = cfg.bottles();
      bags = cfg.hasBags ? JSON.parse(JSON.stringify(cfg.bags)) : [];
      remainingMoves = cfg.moveLimit;
      packedTotal = 0;
      pourCountTotal = 0;
      selectedIndex = null;
      isAnimating = false;
      moveHistory = [];
      shuffleUses = 1;
      renderAll();
      checkAndShowMechanicIntro();
    }

    initGame();
  </script>
</body>
</html>
