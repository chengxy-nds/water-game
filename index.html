<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>倒水不能停 - 星光琉璃工坊商业完整版</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --app-max-w: 460px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 18%, #162a54 0%, #0c1833 48%, #070d1e 100%);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Arial Rounded MT Bold", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      position: fixed;
      inset: 0;
    }

    .ambient-glow {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: min(100vw, 460px);
      height: 300px;
      background: radial-gradient(ellipse at center, rgba(72, 165, 255, 0.22) 0%, rgba(15, 32, 68, 0) 72%);
      pointer-events: none;
      z-index: 0;
    }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: min(100vw, var(--app-max-w));
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(4px, 1dvh, 10px);
      padding: calc(var(--safe-top) + 8px) clamp(6px, 2vw, 12px) calc(var(--safe-bottom) + 10px);
      overflow: hidden;
      z-index: 2;
    }

    /* ==================== 1. 顶部导航栏 ==================== */
    .top-bar {
      width: 100%;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      justify-items: center;
      padding: 0 2px;
      height: clamp(40px, 6.2dvh, 48px);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .jelly-icon-btn {
      width: clamp(38px, 5.6dvh, 42px);
      height: clamp(38px, 5.6dvh, 42px);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(125, 211, 252, 0.42) 0%, rgba(56, 189, 248, 0.22) 52%, rgba(29, 78, 216, 0.38) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.8px solid rgba(255, 255, 255, 0.78);
      box-shadow:
        inset 0 3px 4px rgba(255, 255, 255, 0.82),
        inset 0 -3px 5px rgba(14, 116, 144, 0.45),
        0 6px 14px rgba(4, 12, 32, 0.48);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.15s;
    }
    .jelly-icon-btn:active {
      transform: scale(0.93) translateY(2px);
    }

    .top-center-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      max-width: 100%;
    }

    .level-pill {
      position: relative;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.26) 0%, rgba(148, 197, 255, 0.14) 55%, rgba(96, 165, 250, 0.24) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.8px solid rgba(255, 255, 255, 0.78);
      border-radius: 22px;
      padding: 5px clamp(14px, 3.5vw, 22px);
      font-size: clamp(12.5px, 2dvh, 15px);
      font-weight: 900;
      letter-spacing: 0.6px;
      color: #ffffff;
      text-shadow: 0 1.5px 4px rgba(8, 24, 64, 0.75);
      box-shadow:
        inset 0 2.5px 4px rgba(255, 255, 255, 0.85),
        inset 0 -2px 5px rgba(59, 130, 246, 0.35),
        0 6px 16px rgba(3, 10, 28, 0.45);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .moves-badge {
      display: none;
      align-items: center;
      gap: 3px;
      background: linear-gradient(180deg, #fb923c 0%, #ea580c 100%);
      border: 1.8px solid rgba(255, 255, 255, 0.85);
      border-radius: 16px;
      padding: 4px 10px;
      font-size: clamp(11px, 1.8dvh, 13px);
      font-weight: 900;
      color: #ffffff;
      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, 0.75),
        0 4px 10px rgba(234, 88, 12, 0.5);
      animation: pulseBadge 1.6s infinite ease-in-out;
      white-space: nowrap;
    }
    .moves-badge.show {
      display: inline-flex;
    }
    .moves-badge.danger {
      background: linear-gradient(180deg, #f43f5e 0%, #be123c 100%);
    }
    @keyframes pulseBadge {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* ==================== 2. 顶部 3D 礼盒购物袋 ==================== */
    .bags-stage {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(6px, 2vw, 12px);
      padding: 2px clamp(4px, 1.8vw, 10px) 0;
      height: clamp(94px, 15.2dvh, 134px);
      align-items: end;
      justify-items: center;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      min-width: 0;
    }
    .bags-stage.hidden {
      display: none !important;
    }

    .bag-slot {
      width: 100%;
      max-width: 106px;
      height: 100%;
      min-width: 0;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .bag-slot svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      display: block;
      overflow: visible;
    }
    .bag-slot.packing-bounce {
      animation: bagPackBounce 0.46s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes bagPackBounce {
      0% { transform: scale(1); }
      32% { transform: scale(1.13, 0.89) translateY(5px); }
      68% { transform: scale(0.96, 1.06) translateY(-6px); }
      100% { transform: scale(1); }
    }

    /* 提手受力拎走购物袋动画（以顶部圆绳提手 50% 8% 为支点产生自然钟摆摇晃并加速向上拎走） */
    .bag-slot.bag-carry-away {
      transform-origin: 50% 8%;
      animation: bagCarryAwayAnim 0.56s cubic-bezier(0.32, 0, 0.67, 0) forwards;
      pointer-events: none;
    }
    @keyframes bagCarryAwayAnim {
      0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      24% { transform: translateY(5px) rotate(-7deg) scale(1.03, 0.96); opacity: 1; }
      54% { transform: translateY(-34px) rotate(8.5deg) scale(0.97, 1.05); opacity: 0.95; }
      100% { transform: translateY(-148px) rotate(-5deg) scale(0.84); opacity: 0; }
    }

    /* 新目标色购物袋从上方轻巧落下并带弹性回弹就位 */
    .bag-slot.bag-drop-in {
      transform-origin: 50% 100%;
      animation: bagDropInAnim 0.48s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes bagDropInAnim {
      0% { transform: translateY(-115px) scale(0.86, 1.12); opacity: 0; }
      58% { transform: translateY(7px) scale(1.08, 0.91); opacity: 1; }
      80% { transform: translateY(-4px) scale(0.97, 1.03); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* 袋口上方弹出的 🛎️ 出餐铃金色声波光环动效 */
    .bag-bell-fx {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 68px;
      height: 52px;
      pointer-events: none;
      z-index: 40;
      animation: bellPopSwing 0.62s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes bellPopSwing {
      0% { transform: translateX(-50%) translateY(10px) scale(0.3) rotate(0deg); opacity: 0; }
      26% { transform: translateX(-50%) translateY(-4px) scale(1.16) rotate(-15deg); opacity: 1; }
      48% { transform: translateX(-50%) translateY(-6px) scale(1.06) rotate(13deg); opacity: 1; }
      70% { transform: translateX(-50%) translateY(-8px) scale(1.0) rotate(-7deg); opacity: 0.92; }
      100% { transform: translateX(-50%) translateY(-16px) scale(0.85) rotate(0deg); opacity: 0; }
    }

    .mode-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      width: 94%;
      margin: 2px auto 0;
      padding: 7px 14px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.20) 0%, rgba(148, 197, 255, 0.10) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.58);
      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, 0.65),
        0 4px 14px rgba(0, 0, 0, 0.32);
      font-size: clamp(11.5px, 1.75dvh, 13px);
      font-weight: 800;
      color: #e0f2fe;
      flex-shrink: 0;
      z-index: 10;
    }
    .mode-banner.show {
      display: flex;
    }
    .mode-banner-tag {
      padding: 2px 9px;
      border-radius: 10px;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.75);
      white-space: nowrap;
    }

    /* ==================== 3. 中央自适应瓶子舞台 ==================== */
    .bottles-stage {
      flex: 1;
      width: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(6px, 1.5dvh, 16px) clamp(2px, 1vw, 6px) clamp(10px, 2.2dvh, 22px);
      position: relative;
      overflow: visible;
    }

    .bottles-grid {
      width: 100%;
      height: auto;
      max-height: 100%;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-template-rows: repeat(2, auto);
      column-gap: clamp(5px, 1.5vw, 9px);
      row-gap: clamp(30px, 5.2dvh, 46px);
      padding: 2px 2px;
      align-content: center;
      align-items: end;
      justify-items: center;
    }

    .bottles-grid.layout-5col {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      column-gap: clamp(7px, 2vw, 12px);
    }

    .bottles-grid.layout-varied {
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-template-rows: repeat(2, auto);
      row-gap: clamp(22px, 4dvh, 36px);
    }

    .bottles-grid.layout-tall8 {
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-template-rows: auto;
      column-gap: clamp(3px, 1vw, 6px);
      align-items: center;
      padding: 6px 1px;
    }

    .bottles-grid.layout-cat-boss {
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-template-rows: repeat(2, auto);
      column-gap: clamp(3px, 1vw, 6px);
      row-gap: clamp(20px, 3.8dvh, 34px);
      align-items: center;
    }

    .bottles-grid.layout-21 {
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-template-rows: repeat(3, auto);
      column-gap: clamp(2px, 0.8vw, 4px);
      row-gap: clamp(10px, 1.8dvh, 18px);
      padding: 0;
    }

    .bottle-slot {
      position: relative;
      width: 100%;
      max-width: 82px;
      min-width: 0;
      min-height: 0;
      aspect-ratio: 78 / 202;
      height: auto;
      max-height: clamp(126px, 24.5dvh, 184px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s, opacity 0.25s;
      will-change: transform;
      z-index: 20;
    }

    .bottles-grid.layout-21 .bottle-slot {
      max-height: clamp(90px, 16.2dvh, 132px);
    }

    .bottle-slot.bottle-removed {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .bottle-slot.tall-8-slot {
      width: 100%;
      max-width: 72px;
      aspect-ratio: 78 / 298;
      height: auto;
      max-height: clamp(190px, 42dvh, 290px);
    }

    .bottle-slot.giant-cat-slot {
      grid-column: 3 / 6;
      grid-row: 1 / 3;
      max-width: 200px;
      aspect-ratio: 124 / 224;
      width: 100%;
      max-height: clamp(210px, 44dvh, 310px);
      align-self: center;
      z-index: 30;
    }

    .bottle-slot.selected {
      transform: translateY(-18px);
      filter: drop-shadow(0 15px 16px rgba(0, 0, 0, 0.78));
      z-index: 50;
    }

    .bottle-slot.pouring-source {
      z-index: 100 !important;
      transition: none !important;
      filter: drop-shadow(0 18px 22px rgba(0, 0, 0, 0.75));
    }
    .bottle-slot.pouring-source .shoulder-sheen {
      opacity: 0.14 !important;
    }
    .bottle-slot.pouring-source .capacity-tag-badge {
      opacity: 0 !important;
      transition: opacity 0.12s ease;
    }

    .bottle-slot.pouring-target {
      z-index: 85 !important;
    }

    .bottle-svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      display: block;
      overflow: visible;
    }

    /* ==================== 4. 底部果冻玻璃操作栏 ==================== */
    .bottom-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 4vw, 22px);
      padding: 2px 4px;
      height: clamp(60px, 9.6dvh, 74px);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .big-action-btn {
      position: relative;
      flex: 1;
      max-width: 84px;
      height: clamp(50px, 7.8dvh, 60px);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.32) 0%, rgba(125, 211, 252, 0.18) 52%, rgba(56, 189, 248, 0.28) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.82);
      box-shadow:
        inset 0 3px 5px rgba(255, 255, 255, 0.88),
        inset 0 -3px 6px rgba(14, 116, 144, 0.42),
        0 6px 16px rgba(3, 10, 28, 0.52);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.15s;
    }
    .big-action-btn::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 10%;
      width: 80%;
      height: 36%;
      border-radius: 12px 12px 6px 6px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.58) 0%, rgba(255, 255, 255, 0.0) 100%);
      pointer-events: none;
    }
    .big-action-btn:active {
      transform: scale(0.94) translateY(2px);
    }

    .big-action-btn.jelly-cyan {
      background: linear-gradient(180deg, #67e8f9 0%, #22d3ee 32%, #0284c7 88%, #1d4ed8 100%);
      border-color: rgba(255, 255, 255, 0.92);
      box-shadow:
        inset 0 3.5px 6px rgba(255, 255, 255, 0.92),
        inset 0 -4px 6px rgba(12, 74, 160, 0.55),
        0 8px 18px rgba(14, 165, 233, 0.42);
    }

    .big-action-btn.jelly-gold {
      background: linear-gradient(180deg, #fde047 0%, #facc15 35%, #ea580c 100%);
      border-color: rgba(255, 255, 255, 0.92);
      box-shadow:
        inset 0 3.5px 6px rgba(255, 255, 255, 0.92),
        inset 0 -4px 6px rgba(154, 52, 18, 0.55),
        0 8px 18px rgba(234, 179, 8, 0.38);
    }

    .btn-label {
      font-size: clamp(10.5px, 1.55dvh, 12px);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-shadow: 0 1.5px 3px rgba(8, 24, 68, 0.85);
      line-height: 1.05;
    }

    .badge-jelly {
      position: absolute;
      top: -7px;
      right: -6px;
      min-width: 22px;
      height: 20px;
      padding: 0 5px;
      border-radius: 11px;
      background: linear-gradient(180deg, #fb7185 0%, #e11d48 100%);
      border: 1.8px solid #ffffff;
      box-shadow:
        inset 0 1.5px 2px rgba(255, 255, 255, 0.8),
        0 3px 6px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10.5px;
      font-weight: 900;
      color: #fff;
    }
    .badge-jelly.ad-tag {
      background: linear-gradient(180deg, #a855f7 0%, #6d28d9 100%);
    }

    #fx-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      pointer-events: none;
      z-index: 95;
    }

    .toast-msg {
      position: fixed;
      top: 15%;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, rgba(30, 58, 138, 0.88) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.8px solid rgba(255, 255, 255, 0.85);
      color: #ffffff;
      padding: 9px 18px;
      border-radius: 24px;
      font-size: clamp(12px, 1.8dvh, 14px);
      font-weight: 800;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.65);
      box-shadow:
        inset 0 2px 4px rgba(255, 255, 255, 0.75),
        0 10px 28px rgba(0, 0, 0, 0.55);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ==================== 5. 果冻+磨砂水晶玻璃弹窗系统 ==================== */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, rgba(56, 130, 216, 0.36) 0%, rgba(8, 18, 42, 0.84) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 160;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.26s ease;
      padding: 16px;
    }
    .modal-mask.show {
      opacity: 1;
      pointer-events: auto;
    }

    .glass-jelly-card {
      position: relative;
      width: min(92vw, 376px);
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.34) 0%, rgba(186, 224, 255, 0.18) 48%, rgba(125, 185, 250, 0.26) 100%);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 2.2px solid rgba(255, 255, 255, 0.85);
      border-radius: 34px;
      padding: 26px 20px 22px;
      text-align: center;
      box-shadow:
        inset 0 3px 6px rgba(255, 255, 255, 0.92),
        inset 0 -4px 10px rgba(148, 205, 255, 0.38),
        0 24px 54px rgba(4, 12, 34, 0.65);
      overflow: hidden;
    }
    .glass-jelly-card::before {
      content: "";
      position: absolute;
      top: 6px;
      left: 14px;
      right: 14px;
      height: 46px;
      border-radius: 26px 26px 40px 40px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.52) 0%, rgba(255, 255, 255, 0.0) 100%);
      pointer-events: none;
    }

    .new-mech-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 14px;
      border-radius: 16px;
      background: linear-gradient(180deg, #fde047 0%, #f59e0b 100%);
      border: 1.8px solid #ffffff;
      color: #451a03;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.8px;
      box-shadow: inset 0 2px 3px rgba(255,255,255,0.9), 0 6px 14px rgba(245, 158, 11, 0.45);
      margin-bottom: 10px;
    }
    .mech-preview-pedestal {
      position: relative;
      width: 128px;
      height: 176px;
      margin: 4px auto 14px;
      padding: 12px 22px 14px;
      border-radius: 28px;
      background: radial-gradient(circle at 50% 42%, rgba(56, 189, 248, 0.35) 0%, rgba(15, 23, 42, 0.65) 100%);
      border: 2px solid rgba(255, 255, 255, 0.72);
      box-shadow:
        inset 0 3px 8px rgba(255, 255, 255, 0.65),
        0 12px 28px rgba(4, 12, 36, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatPreview 2.4s infinite ease-in-out;
    }
    @keyframes floatPreview {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .mech-rule-box {

    // 2. 温润治愈系物理玻璃瓶水位声学引擎（滤除高频燥音，按水位实时爬升）
    // ==========================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let cachedPinkNoiseBuffer = null;

    function ensureAudio() {
      if (!audioCtx && AudioCtx) audioCtx = new AudioCtx();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function getPinkNoiseBuffer() {
      if (!audioCtx) return null;
      if (cachedPinkNoiseBuffer) return cachedPinkNoiseBuffer;
      const sampleRate = audioCtx.sampleRate;
      const length = sampleRate * 2.5;
      const buffer = audioCtx.createBuffer(1, length, sampleRate);
      const data = buffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < length; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.045;
        b6 = white * 0.115926;
      }
      cachedPinkNoiseBuffer = buffer;
      return buffer;
    }

    function playRealisticPourSound(options = {}) {
      ensureAudio();
      if (!audioCtx) return;

      const {
        maxCap = 4,
        isGiantCat = false,
        initialLayers = 0,
        moveCount = 1,
        durationMs = 500
      } = options;

      const now = audioCtx.currentTime;
      const durSec = Math.max(0.34, durationMs / 1000);
      const noiseBuf = getPinkNoiseBuffer();
      if (!noiseBuf) return;

      let baseStartFreq, baseMaxFreq, cavityQ, glugRateHz, streamGainLevel;

      if (isGiantCat) {
        baseStartFreq = 155;
        baseMaxFreq = 395;
        cavityQ = 5.2;
        glugRateHz = 5.8;
        streamGainLevel = 0.22;
      } else if (maxCap <= 2) {
        baseStartFreq = 510;
        baseMaxFreq = 980;
        cavityQ = 3.6;
        glugRateHz = 11.5;
        streamGainLevel = 0.16;
      } else if (maxCap === 4) {
        baseStartFreq = 295;
        baseMaxFreq = 680;
        cavityQ = 4.2;
        glugRateHz = 8.4;
        streamGainLevel = 0.19;
      } else if (maxCap === 6) {
        baseStartFreq = 220;
        baseMaxFreq = 540;
        cavityQ = 4.8;
        glugRateHz = 7.0;
        streamGainLevel = 0.21;
      } else {
        baseStartFreq = 175;
        baseMaxFreq = 450;
        cavityQ = 5.5;
        glugRateHz = 6.0;
        streamGainLevel = 0.22;
      }

      const fillStartFrac = Math.min(0.94, initialLayers / maxCap);
      const fillEndFrac = Math.min(0.98, (initialLayers + moveCount) / maxCap);
      const freqStart = baseStartFreq + (baseMaxFreq - baseStartFreq) * Math.pow(fillStartFrac, 1.2);
      const freqEnd = baseStartFreq + (baseMaxFreq - baseStartFreq) * Math.pow(fillEndFrac, 1.2);

      const noiseSrc = audioCtx.createBufferSource();
      noiseSrc.buffer = noiseBuf;
      noiseSrc.loop = true;

      const cavityFilter = audioCtx.createBiquadFilter();
      cavityFilter.type = 'bandpass';
      cavityFilter.Q.setValueAtTime(cavityQ, now);
      cavityFilter.frequency.setValueAtTime(freqStart, now);
      cavityFilter.frequency.exponentialRampToValueAtTime(Math.max(freqStart + 18, freqEnd), now + durSec);

      // 920Hz 温润低通滤波器，消除刺耳嘶嘶声
      const warmthLowpass = audioCtx.createBiquadFilter();
      warmthLowpass.type = 'lowpass';
      warmthLowpass.frequency.setValueAtTime(maxCap <= 2 ? 1250 : 920, now);

      const mainGain = audioCtx.createGain();
      mainGain.gain.setValueAtTime(0.0005, now);
      mainGain.gain.linearRampToValueAtTime(streamGainLevel, now + 0.055);
      mainGain.gain.setValueAtTime(streamGainLevel, now + durSec - 0.075);
      mainGain.gain.exponentialRampToValueAtTime(0.0005, now + durSec);

      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.type = 'sine';
      lfo.frequency.setValueAtTime(glugRateHz, now);
      lfoGain.gain.setValueAtTime(streamGainLevel * 0.15, now);
      lfo.connect(lfoGain).connect(mainGain.gain);

      noiseSrc.connect(cavityFilter).connect(warmthLowpass).connect(mainGain).connect(audioCtx.destination);

      noiseSrc.start(now);
      lfo.start(now);
      noiseSrc.stop(now + durSec + 0.02);
      lfo.stop(now + durSec + 0.02);

      // 随当前水位逐渐升高的圆润水珠气泡音
      const dropletCount = Math.floor(6 + moveCount * 2.8 + (maxCap >= 6 ? 2 : 0));
      for (let i = 0; i < dropletCount; i++) {
        const progress = (i + 0.18 + Math.random() * 0.62) / dropletCount;
        const tDrop = now + 0.025 + progress * (durSec - 0.055);
        const dropDur = maxCap <= 2 ? 0.032 : (maxCap >= 6 ? 0.052 : 0.042);

        const curWaterPitch = freqStart + (freqEnd - freqStart) * progress;
        const bubbleStartF = curWaterPitch * (0.98 + Math.random() * 0.24);
        const bubbleEndF = bubbleStartF * (1.28 + Math.random() * 0.10);

        const dropOsc = audioCtx.createOscillator();
        const dropGain = audioCtx.createGain();

        dropOsc.type = 'sine';
        dropOsc.frequency.setValueAtTime(bubbleStartF, tDrop);
        dropOsc.frequency.exponentialRampToValueAtTime(bubbleEndF, tDrop + dropDur);

        const levelToneWeight = 0.85 + 0.25 * Math.sin(progress * Math.PI);
        const peakG = (isGiantCat ? 0.048 : 0.038) * levelToneWeight * (0.75 + Math.random() * 0.35);
        dropGain.gain.setValueAtTime(0.0004, tDrop);
        dropGain.gain.linearRampToValueAtTime(peakG, tDrop + 0.008);
        dropGain.gain.exponentialRampToValueAtTime(0.0004, tDrop + dropDur);

        dropOsc.connect(dropGain).connect(audioCtx.destination);
        dropOsc.start(tDrop);
        dropOsc.stop(tDrop + dropDur + 0.006);
      }
    }

    // ==========================================
    // 3. 预计算瓶身内壁几何轮廓点
    // ==========================================
    const BOTTLE_INNER_POLY = (() => {
      const pts = [];
      pts.push({ x: 35.5, y: 11 });
      pts.push({ x: 64.5, y: 11 });
      pts.push({ x: 64.5, y: 25.5 });
      for (let i = 1; i <= 10; i++) {
        const t = i / 10;
        const mt = 1 - t;
        pts.push({
          x: mt*mt*mt*64.5 + 3*mt*mt*t*78.8 + 3*mt*t*t*85.3 + t*t*t*85.3,
          y: mt*mt*mt*25.5 + 3*mt*mt*t*29.7 + 3*mt*t*t*39.0 + t*t*t*55.0
        });
      }
      for (let i = 1; i <= 10; i++) {
        pts.push({ x: 85.3, y: 55.0 + (193 - 55.0) * (i / 10) });
      }
      for (let i = 1; i < 12; i++) {
        const ang = (i / 12) * Math.PI;
        pts.push({
          x: 50 + 35.3 * Math.cos(ang),
          y: 193 + 10.2 * Math.sin(ang)
        });
      }
      for (let i = 0; i <= 10; i++) {
        pts.push({ x: 14.7, y: 193 - (193 - 55.0) * (i / 10) });
      }
      for (let i = 1; i <= 10; i++) {
        const t = i / 10;
        const mt = 1 - t;
        pts.push({
          x: mt*mt*mt*14.7 + 3*mt*mt*t*14.7 + 3*mt*t*t*21.2 + t*t*t*35.5,
          y: mt*mt*mt*55.0 + 3*mt*mt*t*39.0 + 3*mt*t*t*29.7 + t*t*t*25.5
        });
      }
      return pts;
    })();

    function getTransformedContour(rad) {
      const cosA = Math.cos(rad);
      const sinA = Math.sin(rad);
      const tPts = new Array(BOTTLE_INNER_POLY.length);
      for (let i = 0; i < BOTTLE_INNER_POLY.length; i++) {
        const p = BOTTLE_INNER_POLY[i];
        const dx = p.x - 50;
        const dy = p.y - 115;
        tPts[i] = {
          X: 50 + dx * cosA - dy * sinA,
          Y: 115 + dx * sinA + dy * cosA
        };
      }
      return tPts;
    }

    function getChordAtGravityY(tPts, targetY) {
      let minX = Infinity;
      let maxX = -Infinity;
      const n = tPts.length;
      for (let i = 0; i < n; i++) {
        const p1 = tPts[i];
        const p2 = tPts[(i + 1) % n];
        if ((p1.Y <= targetY && p2.Y >= targetY) || (p2.Y <= targetY && p1.Y >= targetY)) {
          const dy = p2.Y - p1.Y;
          if (Math.abs(dy) < 1e-5) {
            if (p1.X < minX) minX = p1.X;
            if (p1.X > maxX) maxX = p1.X;
          } else {
            const t = (targetY - p1.Y) / dy;
            const x = p1.X + t * (p2.X - p1.X);
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
          }
        }
      }
      if (minX > maxX) {
        return { leftX: 14.7, rightX: 85.3, cx: 50, rx: 35.3 };
      }
      const cx = 0.5 * (minX + maxX);
      const rx = Math.max(8, 0.5 * (maxX - minX));
      return { leftX: minX, rightX: maxX, cx, rx };
    }

    function getPhysicalSpillAngleDeg(volumeLayers, maxCap = 4) {
      const normV = (volumeLayers / maxCap) * 4.0;
      const v = Math.max(0.0, Math.min(4.0, normV));
      if (v >= 1.0) {
        return 96.0 - (v - 1.0) * 11.0;
      }
      return 96.0 + (1.0 - v) * 7.0;
    }

    // ==========================================
    // 4. 200 关深层交错难度生成算法与星光琉璃工坊新玩法图鉴
    // ==========================================
    function mulberry32(seed) {
      let state = seed >>> 0;
      return function() {
        state = (state + 0x6D2B79F5) >>> 0;
        let t = Math.imul(state ^ (state >>> 15), 1 | state);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296.0;
      };
    }

    function buildVerifiedColorTubes(palette, cap, rng) {
      const n = palette.length;
      if (n <= 1) return [Array(cap).fill(palette[0])];

      const pool = [];
      palette.forEach(c => {
        for (let k = 0; k < cap; k++) pool.push(c);
      });

      let bestCandidate = null;
      let bestScore = -1;

      for (let attempt = 0; attempt < 90; attempt++) {
        const arr = pool.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(rng() * (i + 1));
          const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
        }
        const tubes = [];
        let valid = true;
        let totalTransitions = 0;
        let distinctBottoms = new Set();
        let distinctTops = new Set();

        for (let i = 0; i < n; i++) {
          const t = arr.slice(i * cap, (i + 1) * cap);
          if (t.every(c => c === t[0])) { valid = false; break; }
          let trans = 0;
          let maxRun = 1, curRun = 1;
          for (let k = 1; k < cap; k++) {
            if (t[k] !== t[k - 1]) { trans++; curRun = 1; }
            else { curRun++; if (curRun > maxRun) maxRun = curRun; }
          }
          const allowedRun = cap >= 8 ? 2 : 1;
          if (maxRun > allowedRun && attempt < 65) { valid = false; break; }
          if (cap >= 4 && t[cap - 1] === t[cap - 2] && attempt < 75) { valid = false; break; }

          distinctBottoms.add(t[0]);
          distinctTops.add(t[cap - 1]);
          totalTransitions += trans;
          tubes.push(t);
        }
        if (!valid) continue;

        const score = totalTransitions * 10 + distinctBottoms.size * 6 + distinctTops.size * 8;
        if (score > bestScore) {
          bestScore = score;
          bestCandidate = tubes;
        }
        if (totalTransitions >= n * (cap - 1) * 0.94 && distinctTops.size >= Math.min(n, 4)) {
          return tubes;
        }
      }

      if (bestCandidate) return bestCandidate;

      const fallback = [];
      for (let i = 0; i < n; i++) {
        const t = [];
        for (let k = 0; k < cap; k++) {
          t.push(palette[(i + k * 2 + 1) % n]);
        }
        fallback.push(t);
      }
      return fallback;
    }

    function startSelectSloshAnimation(bottleIdx) {
      if (selectSloshRaf) cancelAnimationFrame(selectSloshRaf);
      selectSloshStart = performance.now();

      function tickSlosh(now) {
        if (selectedIndex !== bottleIdx || isAnimating) {
          selectSloshRaf = null;
          return;
        }
        const b = bottles[bottleIdx];
        const liqGroup = document.getElementById(`liquid-group-${bottleIdx}`);
        if (!b || b.removed || !liqGroup || b.layers.length === 0) return;

        const dt = (now - selectSloshStart) / 1000;
        const amp = Math.exp(-2.45 * dt) * 1.05;
        const phase = dt * 13.8;

        if (amp < 0.008) {
          liqGroup.innerHTML = buildLiquidLayersMarkup(b.layers, bottleIdx, {
            topLayerScale: 1,
            tiltAngle: 0,
            mysteryCount: b.mysteryCount || 0,
            maxCap: b.maxCap || 4,
            isGiantCat: !!b.isGiantCat,
            sloshPhase: 0,
            sloshAmplitude: 0
          });
          selectSloshRaf = null;
          return;
        }

        liqGroup.innerHTML = buildLiquidLayersMarkup(b.layers, bottleIdx, {
          topLayerScale: 1,
          tiltAngle: 0,
          mysteryCount: b.mysteryCount || 0,
          maxCap: b.maxCap || 4,
          isGiantCat: !!b.isGiantCat,
          sloshPhase: phase,
          sloshAmplitude: amp
        });

        selectSloshRaf = requestAnimationFrame(tickSlosh);
      }

      selectSloshRaf = requestAnimationFrame(tickSlosh);
    }

    function getNeckOffsetY(maxCap, isGiantCat) {
      if (isGiantCat) return 0;
      const cfg = getLevelConfig(currentLevelId);
      if (maxCap === 2) return 82;
      if (maxCap === 4 && cfg.isVariedHeight) return 38;
      return 0;
    }

    function getBottleLayerMetrics(maxCap, isGiantCat) {
      const cfg = getLevelConfig(currentLevelId);
      if (isGiantCat) {
        return { bottomY: 194, layerH: 17.5, rx: 43.5, ry: 9.5, vbMinX: -12, vbMinY: -6, vbW: 124, vbH: 224 };
      }
      if (maxCap === 8) {
        return { bottomY: 288, layerH: 30.2, rx: 35.3, ry: 8.6, vbMinX: 11, vbMinY: 6, vbW: 78, vbH: 298 };
      }
      if (maxCap === 2) {
        return { bottomY: 193, layerH: 33.5, rx: 35.3, ry: 8.8, vbMinX: 11, vbMinY: 6, vbW: 78, vbH: 202 };
      }
      if (maxCap === 4 && cfg.isVariedHeight) {
        return { bottomY: 193, layerH: 27.8, rx: 35.3, ry: 8.8, vbMinX: 11, vbMinY: 6, vbW: 78, vbH: 202 };
      }
      if (maxCap === 6) {
        return { bottomY: 193, layerH: 24.8, rx: 35.3, ry: 8.8, vbMinX: 11, vbMinY: 6, vbW: 78, vbH: 202 };
      }
      return { bottomY: 193, layerH: 37.3, rx: 35.3, ry: 8.8, vbMinX: 11, vbMinY: 6, vbW: 78, vbH: 202 };
    }

    function buildLiquidLayersMarkup(layers, idx, options = {}) {
      const {
        topLayerScale = 1,
        tiltAngle = 0,
        pourDir = 1,
        spillProgress = 0,
        mysteryCount = 0,
        maxCap = 4,
        isGiantCat = false,
        sloshPhase = 0,
        sloshAmplitude = 0
      } = options;

      if (layers.length === 0) return '';

      const effectiveLayers = layers.map((c, i) => (i < mysteryCount ? 'mystery_dark' : c));

      let topSameCount = 1;
      for (let i = effectiveLayers.length - 2; i >= 0; i--) {
        if (effectiveLayers[i] === effectiveLayers[effectiveLayers.length - 1]) topSameCount++;
        else break;
      }
      const baseLayersCount = effectiveLayers.length - topSameCount;

      const groups = [];
      let idxCursor = 0;
      while (idxCursor < baseLayersCount) {
        const cKey = effectiveLayers[idxCursor];
        let cnt = 1;
        while (idxCursor + cnt < baseLayersCount && effectiveLayers[idxCursor + cnt] === cKey) {
          cnt++;
        }
        groups.push({ colorKey: cKey, amount: cnt });
        idxCursor += cnt;
      }
      const topAmount = topSameCount * Math.max(0, topLayerScale);
      if (topAmount > 0.005) {
        groups.push({ colorKey: effectiveLayers[effectiveLayers.length - 1], amount: topAmount });
      }
      if (groups.length === 0) return '';

      const totalVolume = groups.reduce((acc, g) => acc + g.amount, 0);
      if (totalVolume <= 0.005) return '';

      const { bottomY, layerH, rx, ry } = getBottleLayerMetrics(maxCap, isGiantCat);
      const neckOff = getNeckOffsetY(maxCap, isGiantCat);
      const leftX = 50 - rx;
      const rightX = 50 + rx;

      const effectiveTiltDeg = tiltAngle;
      const absTilt = Math.abs(effectiveTiltDeg);

      if (absTilt < 0.08) {
        let html = '';
        let curY = bottomY;

        const sloshSin = Math.sin(sloshPhase);
        const sloshCos = Math.cos(sloshPhase * 1.35);
        const topTiltY = sloshAmplitude * 7.2 * sloshSin;
        const waveCrest = sloshAmplitude * 4.2 * sloshCos;
        const ryDynamic = ry + sloshAmplitude * 1.8 * sloshCos;

        for (let i = 0; i < groups.length; i++) {
          const g = groups[i];
          const h = g.amount * layerH;
          const yBot = curY;
          const yTop = curY - h;
          curY = yTop;
          const yBotDraw = (i === 0) ? yBot + 3.5 : yBot;
          const gradId = g.colorKey === 'mystery_dark' ? `liq-mystery-${idx}` : `liq-${g.colorKey}-${idx}`;

          const isTopGroup = (i === groups.length - 1);
          const prevTiltY = (i > 0 && sloshAmplitude > 0.01) ? (topTiltY * 0.32 * (i / groups.length)) : 0;
          const curTiltY = isTopGroup ? topTiltY : (topTiltY * 0.32 * ((i + 1) / groups.length));
          const curWave = isTopGroup ? waveCrest : (waveCrest * 0.25);

          const yTL = yTop - curTiltY;
          const yTR = yTop + curTiltY;
          const yBL = yBotDraw - prevTiltY;
          const yBR = yBotDraw + prevTiltY;

          if (sloshAmplitude > 0.01 && isTopGroup) {
            html += `
              <path d="M ${leftX},${yTL.toFixed(2)}
                       C ${50 - rx * 0.45},${(yTop - curTiltY * 0.3 + curWave).toFixed(2)} ${50 + rx * 0.45},${(yTop + curTiltY * 0.3 - curWave).toFixed(2)} ${rightX},${yTR.toFixed(2)}
                       L ${rightX},${yBR.toFixed(2)}
                       A ${rx},${ry} 0 0,1 ${leftX},${yBL.toFixed(2)}
                       Z"
                    fill="url(#${gradId})" />
            `;
          } else {
            html += `
              <path d="M ${leftX},${yTL.toFixed(2)}
                       L ${rightX},${yTR.toFixed(2)}
                       L ${rightX},${yBR.toFixed(2)}
                       A ${rx},${ry} 0 0,1 ${leftX},${yBL.toFixed(2)}
                       Z"
                    fill="url(#${gradId})" />
            `;
          }
        }

        if (mysteryCount > 0) {
          for (let m = 0; m < Math.min(mysteryCount, layers.length); m++) {
            const qY = bottomY - m * layerH - layerH * 0.50 + 11.8;
            html += `
              <text x="50" y="${qY.toFixed(1)}" text-anchor="middle" fill="#ffffff"
                    font-size="20.5" font-weight="900" font-family="Arial Rounded MT Bold, Arial Black, sans-serif"
                    style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.95));">?</text>
            `;
          }
        }

        const topColorKey = groups[groups.length - 1].colorKey;
        const colTop = COLORS[topColorKey] || { topLight: '#7a96ff' };
        const topGradId = topColorKey === 'mystery_dark' ? `top-mystery-${idx}` : `top-${topColorKey}-${idx}`;
        const surfaceTiltDeg = (Math.atan2(topTiltY * 2, rx * 2) * 180) / Math.PI;

        let topRxEff = rx + 0.4;
        if (isGiantCat) {
          topRxEff = curY < 102 ? 33.5 : 42.5;
        } else {
          const shoulderStart = 55.0 + neckOff;
          if (curY < shoulderStart) {
            const fracInShoulder = Math.min(1, (shoulderStart - curY) / 26.0);
            topRxEff = (rx + 0.3) - fracInShoulder * 7.2;
          }
        }

        html += `
          <g transform="translate(50, ${curY.toFixed(2)}) rotate(${surfaceTiltDeg.toFixed(2)})">
            <ellipse cx="0" cy="${(waveCrest * 0.22).toFixed(2)}" rx="${topRxEff.toFixed(2)}" ry="${ryDynamic.toFixed(2)}"
                     fill="url(#${topGradId})" />
            <path d="M ${-(topRxEff - 1.2)},${(0.35 + waveCrest * 0.22).toFixed(2)}
                     A ${topRxEff - 1.2},${(ryDynamic - 0.25).toFixed(2)} 0 0,0 ${topRxEff - 1.2},${(0.35 + waveCrest * 0.22).toFixed(2)}"
                  fill="none" stroke="${colTop.topLight}" stroke-width="1.15" stroke-linecap="round" opacity="0.78" />
          </g>
        `;
        return html;
      }

      const rad = (effectiveTiltDeg * Math.PI) / 180;
      const absSin = Math.abs(Math.sin(rad));
      const cosR = Math.cos(rad);
      const tPtsTop = getTransformedContour(rad);

      const neckOffsetY = getNeckOffsetY(maxCap, isGiantCat);
      const scaleLen = bottomY / 193;
      let yBotGravity = -Infinity;
      for (let i = 0; i < tPtsTop.length; i++) {
        const origP = BOTTLE_INNER_POLY[i];
        if (origP.y >= 25.5) {
          const clampedY = Math.min(bottomY, origP.y * scaleLen);
          const dx = origP.x - 50;
          const dy = clampedY - 115;
          const gY = 115 + dx * Math.sin(rad) + dy * cosR;
          if (gY > yBotGravity) yBotGravity = gY;
        }
      }

      const neckShoulderY = 26.0 + neckOffsetY;
      const lipOffsetFromCenter = 115 - neckShoulderY;
      const yLipGravity = 115 + 14.0 * absSin - lipOffsetFromCenter * cosR;
      const uprightTotalH = totalVolume * layerH;
      const fullSpillDepth = Math.max(12, yBotGravity - yLipGravity);

      const normVol4 = (totalVolume / maxCap) * 4.0;
      const drainFactor = normVol4 < 0.85
        ? Math.max(0.12, Math.pow(normVol4 / 0.85, 0.52))
        : 1.0;
      const spillTotalH = fullSpillDepth * drainFactor;

      const totalGravityDepth = (1 - spillProgress) * uprightTotalH + spillProgress * spillTotalH;
      const yTopGravity = yBotGravity - totalGravityDepth;

      const SAMPLES = 24;
      const dY = totalGravityDepth / SAMPLES;
      const cumArea = new Float64Array(SAMPLES + 1);
      cumArea[0] = 0;
      for (let s = 1; s <= SAMPLES; s++) {
        const sampleY = yBotGravity - (s - 0.5) * dY;
        const chord = getChordAtGravityY(tPtsTop, sampleY);
        const effWidth = 0.45 * (chord.rx * 2) + 0.55 * 69;
        cumArea[s] = cumArea[s - 1] + effWidth * dY;
      }
      const totalArea = cumArea[SAMPLES] || 1;

      const interpY = (targetA) => {
        if (targetA <= 0) return yBotGravity;
        if (targetA >= totalArea) return yTopGravity;
        let lo = 0, hi = SAMPLES;
        while (lo < hi - 1) {
          const mid = (lo + hi) >> 1;
          if (cumArea[mid] < targetA) lo = mid;
          else hi = mid;
        }
        const span = (cumArea[hi] - cumArea[lo]) || 1e-6;
        const frac = (targetA - cumArea[lo]) / span;
        return yBotGravity - (lo + frac) * dY;
      };

      const numGroups = groups.length;
      const multiLayerShearFade = numGroups > 1 ? Math.max(0, Math.min(1, (82 - absTilt) / 22)) : 0;
      const interfaces = [];
      let accVol = 0;
      for (let k = 0; k <= numGroups; k++) {
        const volFrac = k === 0 ? 0 : (k === numGroups ? 1 : accVol / totalVolume);
        const areaTarget = volFrac * totalArea;
        const yG = k === 0 ? yBotGravity : (k === numGroups ? yTopGravity : interpY(areaTarget));

        const rawShear = (k === 0 || k === numGroups) ? 1.0 : (0.74 + 0.22 * volFrac);
        const shearFactor = 1.0 - (1.0 - rawShear) * multiLayerShearFade;
        const chord = getChordAtGravityY(tPtsTop, yG);
        interfaces.push({ yG, shearFactor, chord });
        if (k < numGroups) accVol += groups[k].amount;
      }

      let html = '';
      for (let i = 0; i < numGroups; i++) {
        const g = groups[i];
        const lowerIf = interfaces[i];
        const upperIf = interfaces[i + 1];

        const upperRelDeg = (1 - upperIf.shearFactor) * effectiveTiltDeg;
        const lowerRelDeg = (1 - lowerIf.shearFactor) * effectiveTiltDeg;
        const upperTan = Math.tan((upperRelDeg * Math.PI) / 180);
        const lowerTan = Math.tan((lowerRelDeg * Math.PI) / 180);

        const minX = -125;
        const maxX = 225;
        const cxU = upperIf.chord.cx;
        const cxL = lowerIf.chord.cx;

        const yUL = upperIf.yG + (minX - cxU) * upperTan;
        const yUR = upperIf.yG + (maxX - cxU) * upperTan;

        const yBotBase = (i === 0) ? (lowerIf.yG + 18) : lowerIf.yG;
        const yBL = yBotBase + (minX - cxL) * lowerTan;
        const yBR = yBotBase + (maxX - cxL) * lowerTan;

        const botRx = (maxX - minX) * 0.52;
        const botRy = (i === 0) ? 4 : Math.min(11.5, Math.max(7.2, lowerIf.chord.rx * 0.23));
        const gradId = g.colorKey === 'mystery_dark' ? `liq-mystery-${idx}` : `liq-${g.colorKey}-${idx}`;

        html += `
          <path d="M ${minX},${yUL.toFixed(2)}
                   L ${maxX},${yUR.toFixed(2)}
                   L ${maxX},${yBR.toFixed(2)}
                   A ${botRx.toFixed(2)},${botRy.toFixed(2)} ${lowerRelDeg.toFixed(2)} 0,1 ${minX},${yBL.toFixed(2)}
                   Z"
                fill="url(#${gradId})" />
        `;
      }

      const topIf = interfaces[numGroups];
      const topChord = topIf.chord;
      const topCx = topChord.cx;
      const topRx = topChord.rx + 0.4;
      const maxRyByDepth = Math.max(6.8, totalGravityDepth * 0.72);
      const topRy = Math.min(10.8, maxRyByDepth, Math.max(7.2, topChord.rx * 0.22));
      const topColorKey = groups[numGroups - 1].colorKey;
      const topGradId = topColorKey === 'mystery_dark' ? `top-mystery-${idx}` : `top-${topColorKey}-${idx}`;

      html += `
        <ellipse cx="${topCx.toFixed(2)}" cy="${topIf.yG.toFixed(2)}"
                 rx="${topRx.toFixed(2)}" ry="${topRy.toFixed(2)}"
                 fill="url(#${topGradId})" />
      `;

      return `
        <g transform="rotate(${(-effectiveTiltDeg).toFixed(2)}, 50, 115)">
          ${html}
        </g>
      `;
    }

    function hash01(n) {
      const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
      return x - Math.floor(x);
    }

    function renderRibbonAndDroppingCorkMarkup(idx, animP = 0.0, neckOffsetY = 0, bBotY = 193, useSpiral = true) {
      let fx = `<g transform="translate(0, ${neckOffsetY})">`;

      if (animP < 0.16) {
        const t = animP / 0.16;
        const easeIn = t * t * t;
        const corkY = -88 * (1 - easeIn);
        const stretchY = 1 + 0.18 * t;
        const scaleX = 1 - 0.06 * t;
        fx += `
          <rect x="37" y="${(corkY - 22).toFixed(1)}" width="26" height="22" rx="8"
                fill="rgba(245, 226, 196, ${(0.35 * t).toFixed(2)})" />
          <g transform="translate(50, ${corkY.toFixed(1)}) scale(${scaleX.toFixed(3)}, ${stretchY.toFixed(3)}) translate(-50, 0)">
            ${renderIkeaWoodCorkSVG(idx, false, false)}
          </g>
        `;
      } else {
        let impactOffsetY = 0;
        let impactScaleX = 1;
        let impactScaleY = 1;

        if (animP < 0.34) {
          const hitP = (animP - 0.16) / 0.18;
          const squash = Math.sin(hitP * Math.PI * 2.2) * Math.exp(-3.2 * hitP);
          impactOffsetY = squash * 5.2;
          impactScaleX = 1 + squash * 0.11;
          impactScaleY = 1 - squash * 0.14;

          const shockP = Math.min(1, hitP * 1.4);
          const shockRx = 18 + shockP * 26;
          const shockRy = 4 + shockP * 5;
          const shockOp = Math.max(0, (1 - shockP) * 0.9);
          fx += `
            <ellipse cx="50" cy="11.5" rx="${shockRx.toFixed(1)}" ry="${shockRy.toFixed(1)}"
                     fill="none" stroke="#ffffff" stroke-width="${(3.2 * (1 - shockP)).toFixed(2)}"
                     opacity="${shockOp.toFixed(2)}" />
          `;
        }

        const showCheck = (!useSpiral && animP >= 0.40);
        fx += `
          <g transform="translate(50, ${(11.5 + impactOffsetY).toFixed(2)}) scale(${impactScaleX.toFixed(3)}, ${impactScaleY.toFixed(3)}) translate(-50, -11.5)">
            ${renderIkeaWoodCorkSVG(idx, true, showCheck)}
          </g>
        `;

        if (useSpiral && animP >= 0.18) {
          const swirlP = Math.min(1, (animP - 0.18) / 0.82);
          const botY = (bBotY - 2) - neckOffsetY;
          const topLimitY = 26;
          const spanH = botY - topLimitY;
          const activeTopY = Math.max(topLimitY, botY - Math.min(1, swirlP * 1.35) * spanH);
          const activeBotY = Math.max(topLimitY + 28, botY - Math.max(0, (swirlP - 0.62) / 0.38) * spanH * 0.65);

          fx += `<g style="filter: drop-shadow(0 0 6px rgba(255, 250, 220, 0.95));">`;

          const buildSpiralRibbon = (phaseOffset) => {
            const N = 32;
            const leftPts = [];
            const rightPts = [];
            for (let i = 0; i <= N; i++) {
              const u = i / N;
              const y = activeBotY - (activeBotY - activeTopY) * u;
              const globalHeightFrac = (botY - y) / Math.max(40, spanH);
              const theta = globalHeightFrac * Math.PI * 2.35 - swirlP * Math.PI * 6.4 + phaseOffset;
              const radiusX = y < 44 ? (18 + (y - 24) * 0.95) : 39.5;
              const x = 50 + Math.sin(theta) * radiusX;
              const depthScale = 0.65 + 0.35 * Math.cos(theta);
              const halfW = Math.sin(u * Math.PI) * 4.4 * depthScale;
              leftPts.push(`${(x - halfW).toFixed(1)},${y.toFixed(1)}`);
              rightPts.push(`${(x + halfW).toFixed(1)},${y.toFixed(1)}`);
            }
            return `M ${leftPts.join(' L ')} L ${rightPts.reverse().join(' L ')} Z`;
          };

          fx += `<path d="${buildSpiralRibbon(0)}" fill="#ffffff" opacity="0.96" />`;
          fx += `<path d="${buildSpiralRibbon(Math.PI)}" fill="#fef08a" opacity="0.90" />`;

          const ringY = Math.max(27.5, activeTopY + 2);
          const ringRx = ringY < 42 ? 21 : 36;
          fx += `
            <ellipse cx="50" cy="${ringY.toFixed(1)}" rx="${ringRx}" ry="5.5"
                     fill="rgba(255, 255, 255, 0.28)" stroke="#ffffff" stroke-width="2.4" />
          `;

          const starY = 0.5 * (activeTopY + activeBotY);
          const starScale = 0.8 + 0.4 * Math.sin(swirlP * Math.PI);
          fx += `
            <g transform="translate(88, ${starY.toFixed(1)}) scale(${starScale.toFixed(2)})">
              <path d="M 0,-12 L 2.8,-2.8 L 12,0 L 2.8,2.8 L 0,12 L -2.8,2.8 L -12,0 L -2.8,-2.8 Z"
                    fill="#ffffff" stroke="#f5d0fe" stroke-width="0.8" />
            </g>
          `;

          for (let p = 0; p < 78; p++) {
            const u1 = hash01(p * 3 + 1);
            const u2 = hash01(p * 3 + 2);
            const u3 = hash01(p * 3 + 3);
            const py = activeBotY - u1 * (activeBotY - activeTopY);
            if (py >= 20 && py <= botY + 4) {
              const hFrac = (botY - py) / Math.max(40, spanH);
              const ang = hFrac * Math.PI * 2.35 - swirlP * Math.PI * 6.4 + (p % 2) * Math.PI + (u2 - 0.5) * 1.3;
              const radX = (py < 44 ? (18 + (py - 24) * 0.95) : 39.5) + (u3 - 0.5) * 18;
              const px = 50 + Math.sin(ang) * radX;
              const pr = 0.85 + (p % 4) * 0.55;
              const op = Math.sin(u1 * Math.PI) * (0.65 + 0.35 * u3);
              const pCol = (p % 3 === 0) ? '#fde047' : '#ffffff';
              fx += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${pr.toFixed(2)}" fill="${pCol}" opacity="${op.toFixed(2)}" />`;
            }
          }
          fx += `</g>`;
        }
      }

      fx += `</g>`;
      return fx;
    }

    // ==========================================
    // 8. 特殊瓶揭晓/破冰/碎石/掀布过渡特效引擎
    // ==========================================
    function triggerBottleVFX(bottleIdx, vfxType, extraOpts = {}) {
      const startT = performance.now();
      const dur = extraOpts.duration || 540;

      function stepVFX(now) {
        const vfxEl = document.getElementById(`bottle-vfx-${bottleIdx}`);
        if (!vfxEl) return;
        const p = Math.min(1, (now - startT) / dur);
        const easeOut = 1 - Math.pow(1 - p, 3);
        const fade = Math.max(0, 1 - Math.pow(p, 1.6));

        let html = '';

        if (vfxType === 'mystery_reveal') {
          const layerIdx = typeof extraOpts.layerIdx === 'number' ? extraOpts.layerIdx : 1;
          const colorKey = extraOpts.colorKey || 'green';
          const col = COLORS[colorKey] || COLORS.green;
          const b = bottles[bottleIdx];
          const { bottomY, layerH, rx } = getBottleLayerMetrics(b ? (b.maxCap || 4) : 4, b ? !!b.isGiantCat : false);
          const cy = bottomY - layerIdx * layerH - layerH * 0.45;

          const mistOp = Math.max(0, (1 - p * 1.35) * 0.88);
          if (mistOp > 0.01) {
            html += `
              <rect x="${(50 - rx).toFixed(1)}" y="${(bottomY - (layerIdx + 1) * layerH).toFixed(1)}"
                    width="${(rx * 2).toFixed(1)}" height="${layerH.toFixed(1)}"
                    rx="4" fill="#090c16" opacity="${mistOp.toFixed(2)}" />
            `;
          }

          const ringRx = 10 + easeOut * (rx + 12);
          const ringRy = 4 + easeOut * 11;
          html += `
            <ellipse cx="50" cy="${cy.toFixed(1)}" rx="${ringRx.toFixed(1)}" ry="${ringRy.toFixed(1)}"
                     fill="none" stroke="${col.topLight}" stroke-width="${(3.8 * fade).toFixed(2)}" opacity="${fade.toFixed(2)}" />
            <ellipse cx="50" cy="${cy.toFixed(1)}" rx="${(ringRx * 0.72).toFixed(1)}" ry="${(ringRy * 0.72).toFixed(1)}"
                     fill="${col.topLight}" opacity="${(0.45 * fade).toFixed(2)}" />
          `;

          const qScale = p < 0.35 ? (1 + (p / 0.35) * 0.65) : (1.65 * (1 - (p - 0.35) / 0.65));
          const qRot = p * 38;
          const qY = cy + 6 - easeOut * 22;
          html += `
            <g transform="translate(50, ${qY.toFixed(1)}) rotate(${qRot.toFixed(1)}) scale(${Math.max(0.05, qScale).toFixed(2)})"
               opacity="${fade.toFixed(2)}">
              <text x="0" y="0" text-anchor="middle" fill="#fef08a" font-size="24" font-weight="900"
                    style="filter: drop-shadow(0 0 8px ${col.topLight});">?</text>
            </g>
          `;

          for (let i = 0; i < 12; i++) {
            const ang = (i / 12) * Math.PI * 2 + 0.3;
            const dist = 8 + easeOut * 34 * (0.7 + 0.3 * (i % 3));
            const px = 50 + Math.cos(ang) * dist;
            const py = cy + Math.sin(ang) * dist * 0.65 - easeOut * 14;
            const pr = (2.2 + (i % 3) * 0.9) * fade;
            const pColor = (i % 2 === 0) ? '#fde047' : col.topLight;
            html += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${pr.toFixed(2)}" fill="${pColor}" opacity="${fade.toFixed(2)}" />`;
          }

        } else if (vfxType === 'ice_shatter') {
          const cy = extraOpts.fullBody ? 115 : 172;
          const ringRx = 16 + easeOut * 42;
          html += `
            <ellipse cx="50" cy="${cy}" rx="${ringRx.toFixed(1)}" ry="${(ringRx * 0.32).toFixed(1)}"
                     fill="none" stroke="#bae6fd" stroke-width="${(3.5 * fade).toFixed(2)}" opacity="${fade.toFixed(2)}" />
          `;
          const shardCount = extraOpts.fullBody ? 16 : 11;
          for (let i = 0; i < shardCount; i++) {
            const seedA = (i / shardCount) * Math.PI * 2 + 0.2;
            const vx = Math.cos(seedA) * (26 + (i % 4) * 11);
            const vy = Math.sin(seedA) * 18 - 22;
            const gravityY = 48 * p * p;
            const sx = 50 + vx * easeOut;
            const sy = (extraOpts.fullBody ? (55 + (i % 5) * 28) : 170) + vy * easeOut + gravityY;
            const rot = (i % 2 === 0 ? 1 : -1) * p * (140 + i * 18);
            const sScale = (0.85 + (i % 3) * 0.25) * fade;
            const shardCol = (i % 3 === 0) ? '#e0f2fe' : (i % 3 === 1 ? '#7dd3fc' : '#38bdf8');
            html += `
              <g transform="translate(${sx.toFixed(1)}, ${sy.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${sScale.toFixed(2)})"
                 opacity="${fade.toFixed(2)}">
                <polygon points="0,-8 7,-2 4,7 -5,6 -7,-3" fill="${shardCol}" stroke="#ffffff" stroke-width="0.9" />
              </g>
            `;
          }

        } else if (vfxType === 'stone_shatter') {
          const cy = 178;
          for (let c = 0; c < 6; c++) {
            const cAng = (c / 6) * Math.PI * 2;
            const cx = 50 + Math.cos(cAng) * easeOut * 34;
            const cY = cy + Math.sin(cAng) * easeOut * 12 - easeOut * 8;
            const cr = (8 + easeOut * 12) * fade;
            html += `<circle cx="${cx.toFixed(1)}" cy="${cY.toFixed(1)}" r="${cr.toFixed(1)}" fill="rgba(231, 203, 169, ${(0.45 * fade).toFixed(2)})" />`;
          }
          for (let i = 0; i < 10; i++) {
            const seedA = (i / 10) * Math.PI * 2 + 0.4;
            const vx = Math.cos(seedA) * (28 + (i % 3) * 12);
            const vy = Math.sin(seedA) * 14 - 26;
            const gravityY = 58 * p * p;
            const sx = 50 + vx * easeOut;
            const sy = cy + vy * easeOut + gravityY;
            const rot = (i % 2 === 0 ? 1 : -1) * p * 165;
            const rScale = (0.85 + (i % 3) * 0.22) * fade;
            const rockCol = (i % 2 === 0) ? '#e7cba9' : '#cfa67e';
            html += `
              <g transform="translate(${sx.toFixed(1)}, ${sy.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${rScale.toFixed(2)})"
                 opacity="${fade.toFixed(2)}">
                <polygon points="-6,-6 5,-7 8,2 2,7 -7,5" fill="${rockCol}" stroke="#785230" stroke-width="1.0" />
              </g>
            `;
          }

        } else if (vfxType === 'cover_unveil') {
          const liftY = -easeOut * 95;
          const scaleX = 1 + easeOut * 0.16;
          const isSilk = extraOpts.coverType === 'silk_drape';
          const fillCol = isSilk ? 'rgba(219, 234, 254, 0.78)' : 'rgba(223, 168, 114, 0.78)';
          const strokeCol = isSilk ? '#ffffff' : '#f5d0a9';
          html += `
            <g transform="translate(50, ${(105 + liftY).toFixed(1)}) scale(${scaleX.toFixed(2)}, ${(1 - p * 0.35).toFixed(2)}) translate(-50, -105)"
               opacity="${fade.toFixed(2)}">
              <path d="M 12,35 Q 50,20 88,35 L 92,165 Q 50,180 8,165 Z"
                    fill="${fillCol}" stroke="${strokeCol}" stroke-width="1.5" />
            </g>
          `;
          for (let s = 0; s < 10; s++) {
            const ang = (s / 10) * Math.PI * 2;
            const sx = 50 + Math.cos(ang) * (14 + easeOut * 32);
            const sy = 105 + Math.sin(ang) * (24 + easeOut * 36) - easeOut * 25;
            html += `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${(2.6 * fade).toFixed(1)}" fill="#fef08a" opacity="${fade.toFixed(2)}" />`;
          }
        }

        vfxEl.innerHTML = html;
        if (p < 1) {
          requestAnimationFrame(stepVFX);
        } else {
          vfxEl.innerHTML = '';
        }
      }

      requestAnimationFrame(stepVFX);
    }

    // ==========================================
    // 8B. 倒水瓶星芒光效渲染器（彻底移除不规则斜向多边形灰白块！）
    // ==========================================
    function buildBottleMoveTrailSVG(startCenterX, startCenterY, curCenterX, curCenterY, bottleW, bottleH, curDeg, colObj, animTimeSec, intensity = 1.0) {
      if (intensity <= 0.02) return '';
      const dx = curCenterX - startCenterX;
      const dy = curCenterY - startCenterY;
      const dist = Math.hypot(dx, dy);
      const dirX = dist > 4 ? (dx / dist) : 1;

      const rad = (curDeg * Math.PI) / 180;
      const cosA = Math.cos(rad);
      const sinA = Math.sin(rad);
      const hw = bottleW * 0.44;
      const hh = bottleH * 0.36;

      let html = '';

      for (let i = 0; i < 16; i++) {
        const u1 = hash01(i * 7 + 1);
        const u2 = hash01(i * 7 + 3);
        const side = (i % 2 === 0) ? -1 : 1;
        const phase = (animTimeSec * (2.0 + (i % 4) * 0.4) + u1) % 1.0;
        const localY = (u2 - 0.48) * hh * 1.65;
        const localX = side * (hw + 4 + phase * 13) - dirX * phase * 14;

        const px = curCenterX + localX * cosA - localY * sinA;
        const py = curCenterY + localX * sinA + localY * cosA;
        const pr = (1.2 + (i % 3) * 0.95) * (1 - phase * 0.45) * intensity;
        const pOp = Math.sin(phase * Math.PI) * 0.90 * intensity;
        const pCol = (i % 3 === 0) ? '#fde047' : (i % 3 === 1 ? colObj.topLight : '#ffffff');

        html += `
          <circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${pr.toFixed(2)}"
                  fill="${pCol}" opacity="${pOp.toFixed(2)}" />
        `;
      }

      return html;
    }
