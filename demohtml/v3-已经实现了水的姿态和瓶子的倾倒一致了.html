<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>第 5 关 - 2.5D 真实物理重力倾倒精修版 (3x7)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #0b1c36 0%, #091326 40%, #060b18 100%);
      font-family: "PingFang SC", "Microsoft YaHei", "Arial Rounded MT Bold", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      position: relative;
    }

    .ambient-glow {
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 520px;
      height: 300px;
      background: radial-gradient(ellipse at center, rgba(42, 112, 196, 0.28) 0%, rgba(11, 28, 54, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .app-shell {
      position: relative;
      width: min(100vw, 530px);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 8px 14px;
    }

    /* ==================== 1. 顶部导航栏 ==================== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 6px;
      height: 46px;
      flex-shrink: 0;
    }

    .settings-btn {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: linear-gradient(180deg, #4db8ff 0%, #1f7ae0 65%, #155cb0 100%);
      border: 2px solid #8cdcff;
      box-shadow:
        inset 0 2px 2px rgba(255, 255, 255, 0.65),
        0 4px 0 #0d3b78,
        0 6px 12px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s;
    }
    .settings-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0d3b78;
    }

    .level-pill {
      background: linear-gradient(180deg, #6b85c9 0%, #4d64a8 55%, #3c508f 100%);
      border: 2.5px solid #9bb5f7;
      outline: 2.5px solid #1b2d5e;
      border-radius: 22px;
      padding: 5px 28px;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-shadow: 0 2px 3px rgba(15, 26, 66, 0.85);
      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, 0.45),
        0 5px 12px rgba(0, 0, 0, 0.45);
    }

    .mini-icons {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .gamepad-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(15, 26, 48, 0.55);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .capsule-menu {
      height: 30px;
      padding: 0 10px;
      border-radius: 15px;
      background: rgba(10, 18, 34, 0.65);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .capsule-divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.25);
    }

    /* ==================== 2. 顶部 4 个 2.5D 手提礼盒袋 ==================== */
    .bags-stage {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 4px 8px 2px;
      height: 130px;
      align-items: end;
      justify-items: center;
      flex-shrink: 0;
    }

    .bag-slot {
      width: 100%;
      max-width: 108px;
      height: 124px;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .bag-slot:hover {
      transform: translateY(-3px);
    }
    .bag-slot.packing-bounce {
      animation: bagPackBounce 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes bagPackBounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.14, 0.9) translateY(4px); }
      70% { transform: scale(0.95, 1.08) translateY(-8px); }
      100% { transform: scale(1); }
    }

    /* ==================== 3. 中央 3排 × 7列 2.5D 瓶子网格 ==================== */
    .bottles-stage {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 2px;
      min-height: 0;
    }

    .bottles-grid {
      width: 100%;
      height: 100%;
      max-height: 540px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(3, 1fr);
      column-gap: 4px;
      row-gap: 10px;
      align-items: end;
      justify-items: center;
    }

    .bottle-slot {
      position: relative;
      width: 100%;
      max-width: 70px;
      height: 100%;
      max-height: 165px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
      will-change: transform;
    }

    .bottle-slot.selected {
      transform: translateY(-20px) scale(1.05);
      filter: drop-shadow(0 14px 16px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 10px rgba(130, 190, 255, 0.65));
      z-index: 40;
    }

    .bottle-slot.pouring-source {
      z-index: 100 !important;
      transition: none !important;
      filter: drop-shadow(0 18px 22px rgba(0, 0, 0, 0.75));
    }

    .bottle-slot.pouring-target {
      z-index: 85 !important;
    }

    .bottle-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* ==================== 4. 底部 2.5D 双大按钮栏 ==================== */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 78px;
      padding: 6px 0 4px;
      height: 82px;
      flex-shrink: 0;
    }

    .big-action-btn {
      position: relative;
      width: 72px;
      height: 70px;
      border-radius: 18px;
      background: linear-gradient(180deg, #52bfff 0%, #2684eb 55%, #1760ba 100%);
      border: 2.5px solid #9be0ff;
      box-shadow:
        inset 0 3px 5px rgba(255, 255, 255, 0.7),
        inset 0 -4px 6px rgba(10, 42, 94, 0.6),
        0 6px 0 #0c3975,
        0 10px 18px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s, filter 0.15s;
    }
    .big-action-btn:hover {
      filter: brightness(1.08);
    }
    .big-action-btn:active {
      transform: translateY(4px);
      box-shadow:
        inset 0 3px 5px rgba(255, 255, 255, 0.5),
        0 2px 0 #0c3975,
        0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .badge-red {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ff5252, #c62828 75%, #8e0000);
      border: 2px solid #ffcdd2;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      color: #fff;
    }

    .badge-cam {
      position: absolute;
      top: -7px;
      right: -10px;
      width: 30px;
      height: 22px;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.5));
    }

    /* 全屏 2.5D 液态水柱层（位于目标瓶与倾倒瓶之间） */
    #fx-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 95;
    }

    .toast-msg {
      position: fixed;
      top: 19%;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(16, 33, 68, 0.95);
      border: 2px solid #6ec6ff;
      color: #ffffff;
      padding: 8px 20px;
      border-radius: 22px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
      z-index: 120;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
    }
    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 24, 0.82);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s;
    }
    .modal-mask.show {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      width: 310px;
      background: linear-gradient(180deg, #1e3c78 0%, #102247 100%);
      border: 3px solid #75b8ff;
      border-radius: 24px;
      padding: 24px 26px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
    }
    .modal-title {
      font-size: 24px;
      font-weight: 900;
      color: #ffdf5d;
      margin-bottom: 10px;
      text-shadow: 0 3px 0 #784700;
    }
    .modal-sub {
      font-size: 14px;
      color: #cbe6ff;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .modal-btn {
      width: 100%;
      padding: 10px 0;
      margin-top: 10px;
      border-radius: 16px;
      border: 2px solid #9be0ff;
      background: linear-gradient(180deg, #4db8ff 0%, #1d72d6 100%);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #0c3975;
    }
    .modal-btn.gold {
      border-color: #ffe57f;
      background: linear-gradient(180deg, #ffd54f 0%, #f57c00 100%);
      color: #3b1700;
      box-shadow: 0 4px 0 #8f3f00;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="app-shell">
    <!-- 1. 顶部栏 -->
    <div class="top-bar">
      <div class="settings-btn" id="settings-btn" title="游戏菜单">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#ffffff">
          <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03-0.7,1.62-0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
      </div>

      <div class="level-pill">第 5 关</div>

      <div class="mini-icons">
        <div class="gamepad-icon" id="quick-unlock-btn" title="一键揭开所有布套">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dbeaff" stroke-width="2">
            <rect x="2" y="6" width="20" height="12" rx="6"/>
            <line x1="6" y1="12" x2="10" y2="12"/>
            <line x1="8" y1="10" x2="8" y2="14"/>
            <circle cx="15" cy="11" r="1" fill="#dbeaff"/>
            <circle cx="17" cy="13" r="1" fill="#dbeaff"/>
          </svg>
        </div>
        <div class="capsule-menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#ffffff">
            <circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/>
          </svg>
          <div class="capsule-divider"></div>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2">
            <circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="#ffffff"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- 2. 顶部 4 个 2.5D 手提礼盒袋 -->
    <div class="bags-stage" id="bags-stage"></div>

    <!-- 3. 中央 3排 × 7列 2.5D 瓶子舞台 -->
    <div class="bottles-stage">
      <div class="bottles-grid" id="bottles-grid"></div>
    </div>

    <!-- 4. 底部操作按钮 -->
    <div class="bottom-bar">
      <div class="big-action-btn" id="shuffle-btn" title="智能提示 / 洗牌">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none">
          <path d="M10,34 C18,34 20,16 32,16 L37,16" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
          <polygon points="34,9 44,16 34,23" fill="#ffffff"/>
          <path d="M10,16 C18,16 20,34 32,34 L37,34" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
          <polygon points="34,27 44,34 34,41" fill="#ffffff"/>
        </svg>
        <div class="badge-red" id="shuffle-count">1</div>
      </div>

      <div class="big-action-btn" id="undo-btn" title="撤回一步">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none">
          <path d="M22,16 L11,24 L22,32 L22,26 C30,26 34,30 34,37 C37,31 37,20 26,19 L22,19 Z"
                fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <svg class="badge-cam" viewBox="0 0 36 26">
          <rect x="2" y="3" width="22" height="20" rx="5" fill="#ffffff" stroke="#4a7bbd" stroke-width="1.5"/>
          <polygon points="24,9 34,4 34,22 24,17" fill="#ffffff" stroke="#4a7bbd" stroke-width="1.5" stroke-linejoin="round"/>
          <polygon points="10,8 10,18 18,13" fill="#4a7bbd"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- 全屏流体特效层 -->
  <svg id="fx-overlay"></svg>

  <div class="toast-msg" id="toast-msg"></div>

  <!-- 菜单与通关弹窗 -->
  <div class="modal-mask" id="modal-mask">
    <div class="modal-card">
      <div class="modal-title" id="modal-title">⚙️ 游戏菜单</div>
      <div class="modal-sub" id="modal-sub">集满同色瓶自动装入顶部 2.5D 礼盒袋，打包礼盒即可依次揭开 1、2、3 号针织布套！</div>
      <button class="modal-btn gold" id="modal-unlock-btn">🔓 立即揭开所有针织布套 & 空瓶</button>
      <button class="modal-btn" id="modal-restart-btn">🔄 重新开始第 5 关</button>
      <button class="modal-btn" id="modal-close-btn">▶️ 继续游戏</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 严格对照参考图调校的 2.5D 高饱和立体液体色板
    // ==========================================
    const COLORS = {
      green:  {
        name: '草木绿',
        left: '#6bc214', mid: '#78d419', highlight: '#99ed3e', right: '#488c05',
        topLight: '#b8ff66', topMid: '#8ce026',
        bagMain: '#5eb012', bagDark: '#428008'
      },
      orange: {
        name: '活力橙',
        left: '#e65500', mid: '#ff6600', highlight: '#ff8833', right: '#b33e00',
        topLight: '#ffa352', topMid: '#ff7714',
        bagMain: '#ea5504', bagDark: '#b33c00'
      },
      cyan:   {
        name: '天际青',
        left: '#0997de', mid: '#14b2fc', highlight: '#52cbff', right: '#046ca8',
        topLight: '#80dbff', topMid: '#29bdfd',
        bagMain: '#149ee3', bagDark: '#0b72ab'
      },
      yellow: {
        name: '明媚黄',
        left: '#f2b600', mid: '#ffca0a', highlight: '#ffe047', right: '#c28800',
        topLight: '#fff078', topMid: '#ffda33',
        bagMain: '#f5a600', bagDark: '#c27d00'
      },
      blue:   {
        name: '深邃蓝',
        left: '#1222bd', mid: '#1d32eb', highlight: '#475eff', right: '#09127a',
        topLight: '#6b80ff', topMid: '#3349f5',
        bagMain: '#1c31cc', bagDark: '#101d8a'
      },
      purple: {
        name: '神秘紫',
        left: '#611491', mid: '#791eb0', highlight: '#9b3bd4', right: '#420869',
        topLight: '#b961ed', topMid: '#8a2be2',
        bagMain: '#731fa8', bagDark: '#4d1078'
      },
      red:    {
        name: '绯红',
        left: '#c40a12', mid: '#e0121b', highlight: '#ff424a', right: '#8c0308',
        topLight: '#ff7077', topMid: '#f5222b',
        bagMain: '#d4151d', bagDark: '#990910'
      }
    };

    // ==========================================
    // 2. Web Audio API 合成逼真水流咕噜声与装袋音效
    // ==========================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx && AudioCtx) audioCtx = new AudioCtx();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      ensureAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === 'select') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(840, now + 0.075);
        gain.gain.setValueAtTime(0.13, now);
        gain.gain.exponentialRampToValueAtTime(0.008, now + 0.08);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.085);
      } else if (type === 'pour') {
        for (let i = 0; i < 7; i++) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          const t = now + i * 0.07;
          const f = 290 + i * 62 + (i % 2) * 25;
          osc.frequency.setValueAtTime(f, t);
          osc.frequency.exponentialRampToValueAtTime(f * 1.48, t + 0.058);
          gain.gain.setValueAtTime(0.14, t);
          gain.gain.exponentialRampToValueAtTime(0.008, t + 0.062);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.068);
        }
      } else if (type === 'pack') {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.055);
          gain.gain.setValueAtTime(0.16, now + idx * 0.055);
          gain.gain.exponentialRampToValueAtTime(0.008, now + 0.25 + idx * 0.055);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(now + idx * 0.055);
          osc.stop(now + 0.27 + idx * 0.055);
        });
      }
    }

    // ==========================================
    // 3. 预计算瓶身内壁高精度几何轮廓点（用于任意倾角下的重力液面弦宽与体积积分）
    // ==========================================
    const BOTTLE_INNER_POLY = (() => {
      const pts = [];
      // 顶口左 -> 右
      pts.push({ x: 33, y: 20 });
      pts.push({ x: 67, y: 20 });
      // 右瓶颈
      pts.push({ x: 67, y: 28 });
      // 右瓶肩二次贝塞尔 (67,28) -> ctrl(84.5,37) -> (84.5,58)
      for (let i = 1; i <= 8; i++) {
        const t = i / 8;
        const mt = 1 - t;
        pts.push({
          x: mt * mt * 67 + 2 * mt * t * 84.5 + t * t * 84.5,
          y: mt * mt * 28 + 2 * mt * t * 37 + t * t * 58
        });
      }
      // 右侧直筒壁 (84.5, 58) -> (84.5, 193)
      for (let i = 1; i <= 10; i++) {
        pts.push({ x: 84.5, y: 58 + (193 - 58) * (i / 10) });
      }
      // 底部椭圆弧: 中心 (50, 193), rx=34.5, ry=8.2, 角度 0 -> PI
      for (let i = 1; i < 12; i++) {
        const ang = (i / 12) * Math.PI;
        pts.push({
          x: 50 + 34.5 * Math.cos(ang),
          y: 193 + 8.2 * Math.sin(ang)
        });
      }
      // 左侧直筒壁 (15.5, 193) -> (15.5, 58)
      for (let i = 0; i <= 10; i++) {
        pts.push({ x: 15.5, y: 193 - (193 - 58) * (i / 10) });
      }
      // 左瓶肩二次贝塞尔 (15.5,58) -> ctrl(15.5,37) -> (33,28)
      for (let i = 1; i <= 8; i++) {
        const t = i / 8;
        const mt = 1 - t;
        pts.push({
          x: mt * mt * 15.5 + 2 * mt * t * 15.5 + t * t * 33,
          y: mt * mt * 58 + 2 * mt * t * 37 + t * t * 28
        });
      }
      return pts;
    })();

    // 将瓶身轮廓点转换到以 (50, 115) 为中心、+Y 严格垂直向下（顺应世界物理重力）的坐标系
    function getTransformedContour(rad) {
      const cosA = Math.cos(rad);
      const sinA = Math.sin(rad);
      const tPts = new Array(BOTTLE_INNER_POLY.length);
      for (let i = 0; i < BOTTLE_INNER_POLY.length; i++) {
        const p = BOTTLE_INNER_POLY[i];
        const dx = p.x - 50;
        const dy = p.y - 115;
        tPts[i] = {
          X: 50 + dx * cosA - dy * sinA,
          Y: 115 + dx * sinA + dy * cosA
        };
      }
      return tPts;
    }

    // 计算任意重力水平面 Y 与瓶身内壁的精确左右交点 [leftX, rightX]
    function getChordAtGravityY(tPts, targetY) {
      let minX = Infinity;
      let maxX = -Infinity;
      const n = tPts.length;
      for (let i = 0; i < n; i++) {
        const p1 = tPts[i];
        const p2 = tPts[(i + 1) % n];
        if ((p1.Y <= targetY && p2.Y >= targetY) || (p2.Y <= targetY && p1.Y >= targetY)) {
          const dy = p2.Y - p1.Y;
          if (Math.abs(dy) < 1e-5) {
            if (p1.X < minX) minX = p1.X;
            if (p1.X > maxX) maxX = p1.X;
          } else {
            const t = (targetY - p1.Y) / dy;
            const x = p1.X + t * (p2.X - p1.X);
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
          }
        }
      }
      if (minX > maxX) {
        return { leftX: 15.5, rightX: 84.5, cx: 50, rx: 34.5 };
      }
      const cx = 0.5 * (minX + maxX);
      const rx = Math.max(8, 0.5 * (maxX - minX));
      return { leftX: minX, rightX: maxX, cx, rx };
    }

    // 根据瓶中当前液量 V (0~4) 计算符合物理重力的临界倾倒角
    // 当剩最后一点水 (V <= 1) 时，瓶身倾角超过 90° (达 94°~100°)，瓶底略高于瓶口，使最后一点水自然汇聚在瓶肩前侧紧贴瓶口处！
    function getPhysicalSpillAngleDeg(volumeLayers) {
      const v = Math.max(0.0, Math.min(4.0, volumeLayers));
      if (v >= 1.0) {
        // 4层: 63°, 3层: 74°, 2层: 85°, 1层: 96°
        return 96.0 - (v - 1.0) * 11.0;
      }
      // 最后 1 层排空过程 (1.0 -> 0.0): 从 96° 平滑加深至 103°（还原图2瓶底微翘 10°~13°、余水短促饱满聚于瓶口前肩肚）
      return 96.0 + (1.0 - v) * 7.0;
    }

    // ==========================================
    // 6. 符合物理重力的 2.5D 动态液层渲染器
    // 无论瓶身处于 0° 还是任意倾角，液面与各层分界面始终保持世界水平（垂直于重力加速度 g），
    // 并根据瓶体截面弦宽自动计算 2.5D 椭圆弯月面与体积守恒层高！
    // ==========================================
    function buildLiquidLayersMarkup(layers, idx, options = {}) {
      const {
        topLayerScale = 1,      // 顶层同色液体块的动态缩放比例 (0~1)
        tiltAngle = 0,          // 瓶子当前在屏幕上的旋转角度 (度)
        sloshAngle = 0,         // 液体惯性晃动附加角 (度)
        pourDir = 1,            // 1: 向右倾倒, -1: 向左倾倒
        spillProgress = 0,      // 0: 竖直静止态, 1: 液面涌至瓶口下唇倾倒态
        splashColorKey = null,  // 接水时的翻涌水花与 3D 气泡颜色
        splashPhase = 0
      } = options;

      if (layers.length === 0) return '';

      // 合并顶层连续相同颜色，支持倾倒/接水时连续平滑升降
      let topSameCount = 1;
      for (let i = layers.length - 2; i >= 0; i--) {
        if (layers[i] === layers[layers.length - 1]) topSameCount++;
        else break;
      }
      const baseLayersCount = layers.length - topSameCount;

      // 构造每一独立色块的(颜色, 体积层数)列表（从底层到顶层）
      const groups = [];
      let idxCursor = 0;
      while (idxCursor < baseLayersCount) {
        const cKey = layers[idxCursor];
        let cnt = 1;
        while (idxCursor + cnt < baseLayersCount && layers[idxCursor + cnt] === cKey) {
          cnt++;
        }
        groups.push({ colorKey: cKey, amount: cnt });
        idxCursor += cnt;
      }
      const topAmount = topSameCount * Math.max(0, topLayerScale);
      if (topAmount > 0.005) {
        groups.push({ colorKey: layers[layers.length - 1], amount: topAmount });
      }
      if (groups.length === 0) return '';

      const totalVolume = groups.reduce((acc, g) => acc + g.amount, 0);
      if (totalVolume <= 0.005) return '';

      const effectiveTiltDeg = tiltAngle + sloshAngle;
      const absTilt = Math.abs(effectiveTiltDeg);

      // 竖直或微晃状态（快速精确路径）
      if (absTilt < 0.08) {
        let html = '';
        let curY = 193;
        const rx = 34.5;
        const ry = 8.2;
        for (let i = 0; i < groups.length; i++) {
          const g = groups[i];
          const h = g.amount * 35.5;
          const yBot = curY;
          const yTop = curY - h;
          curY = yTop;
          const yBotDraw = (i === 0) ? yBot + 4 : yBot;
          html += `
            <path d="M 15.5,${yTop.toFixed(2)}
                     L 84.5,${yTop.toFixed(2)}
                     L 84.5,${yBotDraw.toFixed(2)}
                     A ${rx},${ry} 0 0,1 15.5,${yBotDraw.toFixed(2)}
                     Z"
                  fill="url(#liq-${g.colorKey}-${idx})" />
          `;
        }
        const topColorKey = groups[groups.length - 1].colorKey;
        html += `
          <ellipse cx="50" cy="${curY.toFixed(2)}" rx="${rx}" ry="${ry}"
                   fill="url(#top-${topColorKey}-${idx})"
                   stroke="${COLORS[topColorKey].topLight}" stroke-width="0.9" />
        `;

        return html;
      }

      // 倾斜状态：直接从旋转后的瓶身内壁真实几何轮廓 tPtsTop 中求取物理重力最低点 yBotGravity！
      // 当倾角 <= 90° 时，最低点在瓶底；当倾角 > 90°（剩最后一点水，如图2）时，最低点自动转移到瓶口后方的下瓶肩肚！
      const rad = (effectiveTiltDeg * Math.PI) / 180;
      const absSin = Math.abs(Math.sin(rad));
      const cosR = Math.cos(rad);
      const tPtsTop = getTransformedContour(rad);

      let yBotGravity = -Infinity;
      for (let i = 0; i < tPtsTop.length; i++) {
        // 排除瓶口最前端 (y < 26) 的点，使液体最低点落在瓶肩肚与瓶身内腔
        if (BOTTLE_INNER_POLY[i].y >= 28 && tPtsTop[i].Y > yBotGravity) {
          yBotGravity = tPtsTop[i].Y;
        }
      }

      // 瓶口下唇内侧出水点 (x = 50 ± 16.5, y = 25) 在重力方向的高度
      const yLipGravity = 115 + 16.5 * absSin - 90 * cosR;

      const uprightTotalH = totalVolume * 35.5;
      const fullSpillDepth = Math.max(12, yBotGravity - yLipGravity);

      // 当剩余液量很少 (totalVolume < 0.9) 且瓶身已倾倒过水平线时，液深在瓶肩前侧肚内随剩余液量自然收拢（紧贴瓶口与下瓶壁，瓶底完全腾空！）
      const drainFactor = totalVolume < 0.90
        ? Math.max(0.08, Math.pow(totalVolume / 0.90, 0.52))
        : 1.0;
      const spillTotalH = fullSpillDepth * drainFactor;

      const totalGravityDepth = (1 - spillProgress) * uprightTotalH + spillProgress * spillTotalH;
      const yTopGravity = yBotGravity - totalGravityDepth;

      // 对 [yTopGravity, yBotGravity] 区间按真实瓶腔弦宽积分求各层分界高度
      const SAMPLES = 24;
      const dY = totalGravityDepth / SAMPLES;
      const cumArea = new Float64Array(SAMPLES + 1);
      cumArea[0] = 0;
      for (let s = 1; s <= SAMPLES; s++) {
        const sampleY = yBotGravity - (s - 0.5) * dY;
        const chord = getChordAtGravityY(tPtsTop, sampleY);
        const effWidth = 0.45 * (chord.rx * 2) + 0.55 * 69;
        cumArea[s] = cumArea[s - 1] + effWidth * dY;
      }
      const totalArea = cumArea[SAMPLES] || 1;

      const interpY = (targetA) => {
        if (targetA <= 0) return yBotGravity;
        if (targetA >= totalArea) return yTopGravity;
        let lo = 0, hi = SAMPLES;
        while (lo < hi - 1) {
          const mid = (lo + hi) >> 1;
          if (cumArea[mid] < targetA) lo = mid;
          else hi = mid;
        }
        const span = (cumArea[hi] - cumArea[lo]) || 1e-6;
        const frac = (targetA - cumArea[lo]) / span;
        return yBotGravity - (lo + frac) * dY;
      };

      // 计算每个界面的高度与粘滞倾角因子：
      // 注意：k=0 (瓶底边界) 和 k=numGroups (最顶层自由液面) 的 shearFactor 恒为 1.0（严格物理水平），
      // 仅当存在多层不同颜色且倾角在 78° 以内时，内部层间分界面带有柔和粘滞过渡！
      const numGroups = groups.length;
      const multiLayerShearFade = numGroups > 1 ? Math.max(0, Math.min(1, (82 - absTilt) / 22)) : 0;
      const interfaces = [];
      let accVol = 0;
      for (let k = 0; k <= numGroups; k++) {
        const volFrac = k === 0 ? 0 : (k === numGroups ? 1 : accVol / totalVolume);
        const areaTarget = volFrac * totalArea;
        const yG = k === 0 ? yBotGravity : (k === numGroups ? yTopGravity : interpY(areaTarget));

        const rawShear = (k === 0 || k === numGroups) ? 1.0 : (0.74 + 0.22 * volFrac);
        const shearFactor = 1.0 - (1.0 - rawShear) * multiLayerShearFade;
        const chord = getChordAtGravityY(tPtsTop, yG);
        interfaces.push({
          yG,
          shearFactor,
          chord
        });
        if (k < numGroups) accVol += groups[k].amount;
      }

      let html = '';
      for (let i = 0; i < numGroups; i++) {
        const g = groups[i];
        const lowerIf = interfaces[i];
        const upperIf = interfaces[i + 1];

        const upperRelDeg = (1 - upperIf.shearFactor) * effectiveTiltDeg;
        const lowerRelDeg = (1 - lowerIf.shearFactor) * effectiveTiltDeg;
        const upperTan = Math.tan((upperRelDeg * Math.PI) / 180);
        const lowerTan = Math.tan((lowerRelDeg * Math.PI) / 180);

        const minX = -55;
        const maxX = 155;
        const cxU = upperIf.chord.cx;
        const cxL = lowerIf.chord.cx;

        const yUL = upperIf.yG + (minX - cxU) * upperTan;
        const yUR = upperIf.yG + (maxX - cxU) * upperTan;

        const yBotBase = (i === 0) ? (lowerIf.yG + 18) : lowerIf.yG;
        const yBL = yBotBase + (minX - cxL) * lowerTan;
        const yBR = yBotBase + (maxX - cxL) * lowerTan;

        const botRx = (maxX - minX) * 0.52;
        const botRy = (i === 0) ? 3 : Math.min(11.5, Math.max(6.5, lowerIf.chord.rx * 0.21));

        html += `
          <path d="M ${minX},${yUL.toFixed(2)}
                   L ${maxX},${yUR.toFixed(2)}
                   L ${maxX},${yBR.toFixed(2)}
                   A ${botRx.toFixed(2)},${botRy.toFixed(2)} ${lowerRelDeg.toFixed(2)} 0,1 ${minX},${yBL.toFixed(2)}
                   Z"
                fill="url(#liq-${g.colorKey}-${idx})" />
        `;
      }

      // 最顶层自由液面：严格世界水平的 2.5D 高光椭圆弯月面
      // 当剩最后一点水聚在瓶肩肚时，椭圆左右端点精确贴合瓶颈内侧与下瓶壁中段，呈现图2同款叶形水平液面！
      const topIf = interfaces[numGroups];
      const topChord = topIf.chord;
      const topCx = topChord.cx;
      const topRx = topChord.rx + 0.4;
      const maxRyByDepth = Math.max(6.8, totalGravityDepth * 0.72);
      const topRy = Math.min(10.8, maxRyByDepth, Math.max(7.2, topChord.rx * 0.22));
      const topColorKey = groups[numGroups - 1].colorKey;

      html += `
        <ellipse cx="${topCx.toFixed(2)}" cy="${topIf.yG.toFixed(2)}"
                 rx="${topRx.toFixed(2)}" ry="${topRy.toFixed(2)}"
                 fill="url(#top-${topColorKey}-${idx})"
                 stroke="${COLORS[topColorKey].topMid}" stroke-width="0.6" />
      `;



      return `
        <g transform="rotate(${(-effectiveTiltDeg).toFixed(2)}, 50, 115)">
          ${html}
        </g>
      `;
    }

    // 还原图2接水瓶液面中心的立体翻涌水花冠与半月高光液泡
    function renderPlumpSplashMarkup(cx, cy, splashColorKey, splashPhase, idx) {
      const col = COLORS[splashColorKey];
      const w1 = Math.sin(splashPhase * 20) * 1.4;
      const w2 = Math.cos(splashPhase * 22) * 1.2;
      return `

          <path d="M -11,0 Q -7,${-9 - w1} 0,${-7 + w2} Q 7,${-10 - w2} 11,0 Z"
                fill="${col.mid}" />
          <path d="M -7.5,0 Q 0,${-11 - w1} 7.5,0 Z"
                fill="${col.topMid}" opacity="0.9" />

            <circle cx="0" cy="0" r="4.2" fill="${col.right}" opacity="0.65" />
            <circle cx="0.5" cy="-0.8" r="3.5" fill="${col.topMid}" />
            <circle cx="1.0" cy="-1.4" r="2.2" fill="${col.topLight}" />
          </g>
          <!-- 右前侧半月高光液泡 -->
          <g transform="translate(${5.2 - w2 * 0.3}, ${1.0 - w1 * 0.2})">

    // ==========================================
    // 7. 界面渲染
    // ==========================================
    function renderAll() {
      const bagsStage = document.getElementById('bags-stage');
      bagsStage.innerHTML = '';
      bags.forEach((bag, idx) => {
        const slot = document.createElement('div');
        slot.className = 'bag-slot';
        slot.innerHTML = renderBagSVG(bag);
        slot.addEventListener('click', () => onBagClick(idx));
        bagsStage.appendChild(slot);
      });

      const grid = document.getElementById('bottles-grid');
      grid.innerHTML = '';
      bottles.forEach((b, idx) => {
        const slot = document.createElement('div');
        slot.className = 'bottle-slot';
        if (selectedIndex === idx) slot.classList.add('selected');
        slot.innerHTML = renderBottleSVG(b, idx);
        slot.addEventListener('click', () => onBottleClick(idx));
        grid.appendChild(slot);
      });

      document.getElementById('shuffle-count').textContent = shuffleUses;
    }

    // ==========================================
    // 8. 真实物理重力倾倒动画（重力水平液面 + 动态临界倾角 + 重力抛物线流束 + 惯性微晃）
    // ==========================================
    function onBagClick(bagIdx) {
      if (isAnimating) return;
      const bag = bags[bagIdx];
      if (bag.locked) {
        moveHistory.push(cloneState());
        bag.locked = false;
        bag.color = pickNextNeededBagColor();
        playSound('pack');
        showToast('🛍️ 已为您解锁第 4 个礼盒手提袋槽位！');
        renderAll();
      } else {
        showToast(`🛍️ 集满 4 层【${COLORS[bag.color].name}】药水即可自动装入此礼盒袋！`);
      }
    }

    function pickNextNeededBagColor() {
      const activeBagColors = bags.filter(b => !b.locked && b.color).map(b => b.color);
      const remainingColors = [];
      bottles.forEach(b => {
        b.layers.forEach(c => {
          if (!remainingColors.includes(c)) remainingColors.push(c);
        });
      });
      return remainingColors.find(c => !activeBagColors.includes(c)) || remainingColors[0] || 'red';
    }

    function isCompleteBottle(b) {
      return b.special === 'none' && b.layers.length === 4 && b.layers.every(c => c === b.layers[0]);
    }

    function canSelectBottle(b) {
      if (b.special === 'knit_bag') {
        showToast(`🧣 ${b.unlockOrder}号针织布套锁住中！累计打包 ${b.unlockOrder} 个礼盒即可揭开`);
        return false;
      }
      if (b.special === 'ad_cam') return false;
      if (b.layers.length === 0 || isCompleteBottle(b)) return false;
      return true;
    }

    function canPourInto(src, dst) {
      if (dst.special !== 'none') return false;
      if (dst.layers.length >= 4 || src.layers.length === 0) return false;
      if (dst.layers.length === 0) return true;
      return src.layers[src.layers.length - 1] === dst.layers[dst.layers.length - 1];
    }

    function onBottleClick(idx) {
      if (isAnimating) return;
      const clicked = bottles[idx];

      if (clicked.special === 'ad_cam') {
        moveHistory.push(cloneState());
        clicked.special = 'none';
        playSound('pack');
        showToast('📹 已为您免费解锁备用空瓶！');
        renderAll();
        return;
      }

      if (selectedIndex === null) {
        if (canSelectBottle(clicked)) {
          selectedIndex = idx;
          playSound('select');
          renderAll();
        }
        return;
      }

      if (selectedIndex === idx) {
        selectedIndex = null;
        playSound('select');
        renderAll();
        return;
      }

      const src = bottles[selectedIndex];
      const dst = clicked;

      if (canPourInto(src, dst)) {
        performLiquidPour(selectedIndex, idx);
      } else if (canSelectBottle(dst)) {
        selectedIndex = idx;
        playSound('select');
        renderAll();
      } else {
        selectedIndex = null;
        renderAll();
      }
    }

    // 绘制符合物理重力加速度 (v = sqrt(v0^2 + 2gh)) 的抛物线收窄流体水柱
    function buildGravityStreamSVG(spoutX, spoutY, mouthX, mouthY, surfaceY, dstRect, pourDir, colObj, pourProgress) {
      const headRatio = Math.min(1, pourProgress / 0.10);
      const tailRatio = pourProgress > 0.90 ? Math.min(1, (pourProgress - 0.90) / 0.10) : 0;

      const totalDrop = Math.max(20, surfaceY - spoutY);
      const yStart = spoutY + totalDrop * (tailRatio * tailRatio * 0.82);
      const yEnd = spoutY + totalDrop * (headRatio * headRatio);
      if (yEnd - yStart < 4) return '';

      const N = 22;
      const leftEdge = [];
      const rightEdge = [];
      const centerCurve = [];

      const archHeight = Math.max(15, (mouthY - spoutY) + 14);

      for (let i = 0; i <= N; i++) {
        const s = i / N;
        const y = yStart + (yEnd - yStart) * s;
        const dyFromSpout = Math.max(0, y - spoutY);
        const globalS = Math.max(0, Math.min(1, dyFromSpout / totalDrop));

        let x;
        if (dyFromSpout < archHeight) {
          const tArch = dyFromSpout / archHeight;
          const easeArch = 1 - Math.pow(1 - tArch, 2.2);
          x = spoutX + (mouthX - spoutX) * easeArch;
        } else {
          const wave = Math.sin(pourProgress * 24 - globalS * 8) * 0.35;
          x = mouthX + wave;
        }

        const halfW = (4.5 - 1.05 * Math.sqrt(globalS)) * (tailRatio > 0 ? (1 - tailRatio * 0.45) : 1);

        leftEdge.push({ x: x - halfW, y, halfW });
        rightEdge.push({ x: x + halfW, y, halfW });
        centerCurve.push(`${(x - halfW * 0.15).toFixed(2)},${y.toFixed(2)}`);
      }

      const firstL = leftEdge[0];
      const firstR = rightEdge[0];
      const lastL = leftEdge[leftEdge.length - 1];
      const lastR = rightEdge[rightEdge.length - 1];

      let streamPath = `M ${firstL.x.toFixed(2)},${firstL.y.toFixed(2)} `;
      streamPath += `A ${firstL.halfW.toFixed(2)},${(firstL.halfW * 0.85).toFixed(2)} 0 0,1 ${firstR.x.toFixed(2)},${firstR.y.toFixed(2)} `;
      for (let i = 1; i < rightEdge.length; i++) {
        streamPath += `L ${rightEdge[i].x.toFixed(2)},${rightEdge[i].y.toFixed(2)} `;
      }
      streamPath += `A ${lastL.halfW.toFixed(2)},${(lastL.halfW * 0.7).toFixed(2)} 0 0,1 ${lastL.x.toFixed(2)},${lastL.y.toFixed(2)} `;
      for (let i = leftEdge.length - 2; i >= 0; i--) {
        streamPath += `L ${leftEdge[i].x.toFixed(2)},${leftEdge[i].y.toFixed(2)} `;
      }
      streamPath += 'Z';

      const highlightPath = 'M ' + centerCurve.join(' L ');

      // 严格按照 SVG preserveAspectRatio="xMidYMid meet" 还原目标瓶口前唇与水花的屏幕像素坐标
      const scale = Math.min(dstRect.width / 100, dstRect.height / 214);
      const offX = dstRect.left + (dstRect.width - 100 * scale) * 0.5;
      const offY = dstRect.top + (dstRect.height - 214 * scale) * 0.5;
      const sx = (x) => (offX + x * scale).toFixed(2);
      const sy = (y) => (offY + y * scale).toFixed(2);
      const rx23 = (23 * scale).toFixed(2);
      const ry52 = (5.2 * scale).toFixed(2);
      const ry48 = (4.8 * scale).toFixed(2);
      const rx21 = (21 * scale).toFixed(2);

      // 液面冲击中心：还原图2同款水花冠与双半月液泡（覆盖在水柱底端前方）
      let impactFoamHTML = '';
      if (headRatio >= 0.98 && tailRatio < 0.85) {
        const w1 = Math.sin(pourProgress * 20) * 1.3;
        const w2 = Math.cos(pourProgress * 22) * 1.1;
        const cx = mouthX;
        const cy = surfaceY;
        const rScale = scale;
        impactFoamHTML = `
          <g transform="translate(${cx.toFixed(2)}, ${cy.toFixed(2)}) scale(${rScale.toFixed(3)})">
            <path d="M -11,-1 Q -7,${-10 - w1} 0,${-8 + w2} Q 7,${-11 - w2} 11,-1 Z"
                  fill="${colObj.mid}" />
            <path d="M -7.5,-1 Q 0,${-12 - w1} 7.5,-1 Z"
                  fill="${colObj.topMid}" opacity="0.92" />
            <g transform="translate(${-4.8 + w1 * 0.3}, ${0.8 + w2 * 0.2})">
              <circle cx="0" cy="0" r="4.2" fill="${colObj.right}" opacity="0.62" />
              <circle cx="0.5" cy="-0.8" r="3.4" fill="${colObj.topMid}" />
              <circle cx="0.9" cy="-1.3" r="2.1" fill="${colObj.topLight}" />
            </g>
            <g transform="translate(${4.8 - w2 * 0.3}, ${1.0 - w1 * 0.2})">
              <circle cx="0" cy="0" r="4.0" fill="${colObj.right}" opacity="0.62" />
              <circle cx="-0.5" cy="-0.8" r="3.2" fill="${colObj.topMid}" />
              <circle cx="-0.9" cy="-1.3" r="1.9" fill="${colObj.topLight}" />
            </g>
          </g>
        `;
      }

      return `
        <defs>
          <linearGradient id="liveStreamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="${colObj.left}" />
            <stop offset="45%" stop-color="${colObj.topLight}" />
            <stop offset="82%" stop-color="${colObj.mid}" />
            <stop offset="100%" stop-color="${colObj.right}" />
          </linearGradient>
          <linearGradient id="frontCollarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0b1742"/>
            <stop offset="18%" stop-color="#29489e"/>
            <stop offset="35%" stop-color="#152766"/>
            <stop offset="62%" stop-color="#2c4fb0"/>
            <stop offset="77%" stop-color="#ffffff"/>
            <stop offset="86%" stop-color="#5c87eb"/>
            <stop offset="100%" stop-color="#0d1b4d"/>
          </linearGradient>
        </defs>
        <!-- 重力抛物线液态水柱 -->
        <path d="${streamPath}" fill="url(#liveStreamGrad)" />
        <path d="${highlightPath}" fill="none" stroke="rgba(255,255,255,0.48)" stroke-width="1.6" stroke-linecap="round" />

        <!-- 液面冲击中心图2同款水花与半月液泡 -->
        ${impactFoamHTML}

        <!-- 目标瓶口前侧立体金属蓝唇环遮罩（精确对齐目标瓶口，使水柱穿入瓶口黑孔内部） -->
        <path d="M ${sx(27)},${sy(11.5)}
                 L ${sx(27)},${sy(21)}
                 A ${rx23},${ry52} 0 0,0 ${sx(73)},${sy(21)}
                 L ${sx(73)},${sy(11.5)}
                 A ${rx23},${ry48} 0 0,0 ${sx(27)},${sy(11.5)} Z"
              fill="url(#frontCollarGrad)"
              stroke="#698fe6" stroke-width="${(1.3 * scale).toFixed(2)}" />
        <path d="M ${sx(27)},${sy(11.5)} A ${rx23},${ry48} 0 0,0 ${sx(73)},${sy(11.5)}"
              fill="none" stroke="#9ec0ff" stroke-width="${(1.4 * scale).toFixed(2)}" />
        <path d="M ${sx(29)},${sy(21.5)} A ${rx21},${ry48} 0 0,0 ${sx(71)},${sy(21.5)}"
              fill="none" stroke="#8cb2ff" stroke-width="${(1.5 * scale).toFixed(2)}" stroke-linecap="round" />
      `;
    }

    // 核心：逐帧驱动的 2.5D 物理重力液态倾倒动画
    function performLiquidPour(srcIdx, dstIdx) {
      isAnimating = true;
      moveHistory.push(cloneState());

      const gridEl = document.getElementById('bottles-grid');
      const srcEl = gridEl.children[srcIdx];
      const dstEl = gridEl.children[dstIdx];

      srcEl.classList.remove('selected');
      srcEl.classList.add('pouring-source');
      dstEl.classList.add('pouring-target');

      const srcRect = srcEl.getBoundingClientRect();
      const dstRect = dstEl.getBoundingClientRect();

      const srcBottle = bottles[srcIdx];
      const dstBottle = bottles[dstIdx];
      const pourColorKey = srcBottle.layers[srcBottle.layers.length - 1];
      const colObj = COLORS[pourColorKey];

      let moveCount = 0;
      for (let i = srcBottle.layers.length - 1; i >= 0; i--) {
        if (srcBottle.layers[i] === pourColorKey && dstBottle.layers.length + moveCount < 4) {
          moveCount++;
        } else {
          break;
        }
      }

      let srcTopSameCount = 0;
      for (let i = srcBottle.layers.length - 1; i >= 0; i--) {
        if (srcBottle.layers[i] === pourColorKey) srcTopSameCount++;
        else break;
      }

      const dstFullLayers = [...dstBottle.layers];
      for (let k = 0; k < moveCount; k++) dstFullLayers.push(pourColorKey);

      let dstTopSameAfter = 0;
      for (let i = dstFullLayers.length - 1; i >= 0; i--) {
        if (dstFullLayers[i] === pourColorKey) dstTopSameAfter++;
        else break;
      }
      const dstInitialScale = (dstTopSameAfter - moveCount) / dstTopSameAfter;

      const pourDir = (srcRect.left <= dstRect.left) ? 1 : -1;

      // 旋转支点设在源瓶口下唇 (SVG: x=67/33, y=15)
      const pivotXRatio = pourDir === 1 ? 0.67 : 0.33;
      const pivotYRatio = 0.072;
      srcEl.style.transformOrigin = `${pivotXRatio * 100}% ${pivotYRatio * 100}%`;

      const srcLipX = srcRect.left + srcRect.width * pivotXRatio;
      const srcLipY = srcRect.top + srcRect.height * pivotYRatio;

      const dstMouthX = dstRect.left + dstRect.width * 0.5;
      const dstMouthY = dstRect.top + dstRect.height * 0.055;

      const targetLipX = dstMouthX - pourDir * 3.5;
      const targetLipY = dstMouthY - 5.0;

      const targetTranslateX = targetLipX - srcLipX;
      const targetTranslateY = targetLipY - srcLipY;

      const startVol = srcBottle.layers.length;
      const endVol = srcBottle.layers.length - moveCount;
      const startTiltDeg = pourDir * getPhysicalSpillAngleDeg(startVol);
      const endTiltDeg = pourDir * getPhysicalSpillAngleDeg(endVol);

      const srcLiquidGroup = document.getElementById(`liquid-group-${srcIdx}`);
      const dstLiquidGroup = document.getElementById(`liquid-group-${dstIdx}`);
      const fxSvg = document.getElementById('fx-overlay');

      const moveDuration = 280;
      const pourDuration = 580;
      const returnDuration = 280;
      const settleDuration = 180;
      const startTime = performance.now();
      let soundPlayed = false;

      function step(now) {
        const elapsed = now - startTime;

        if (elapsed < moveDuration) {
          const p = elapsed / moveDuration;
          const ease = 1 - Math.pow(1 - p, 3);
          const curX = targetTranslateX * ease;
          const curY = targetTranslateY * ease;
          const curDeg = startTiltDeg * ease;
          const slosh = -pourDir * Math.sin(p * Math.PI) * 3.2;

          srcEl.style.transform = `translate(${curX.toFixed(2)}px, ${curY.toFixed(2)}px) rotate(${curDeg.toFixed(2)}deg)`;
          srcLiquidGroup.innerHTML = buildLiquidLayersMarkup(srcBottle.layers, srcIdx, {
            topLayerScale: 1,
            tiltAngle: curDeg,
            sloshAngle: slosh,
            pourDir,
            spillProgress: ease
          });
          requestAnimationFrame(step);

        } else if (elapsed < moveDuration + pourDuration) {
          if (!soundPlayed) {
            soundPlayed = true;
            playSound('pour');
          }

          const p = (elapsed - moveDuration) / pourDuration;
          // 实时根据当前瓶内剩余水量计算物理倾角（当剩最后一点水时，瓶底微翘至 95°~100°，使余水汇聚在瓶口前侧瓶肩）
          const curRemainingVol = startVol - moveCount * p;
          const curDeg = pourDir * getPhysicalSpillAngleDeg(curRemainingVol);
          const slosh = pourDir * Math.sin(p * Math.PI * 3) * 1.0 * (1 - p);

          srcEl.style.transform = `translate(${targetTranslateX.toFixed(2)}px, ${targetTranslateY.toFixed(2)}px) rotate(${curDeg.toFixed(2)}deg)`;

          const srcEndScale = (srcTopSameCount - moveCount) / srcTopSameCount;
          const curSrcScale = 1 - (1 - srcEndScale) * p;
          srcLiquidGroup.innerHTML = buildLiquidLayersMarkup(srcBottle.layers, srcIdx, {
            topLayerScale: curSrcScale,
            tiltAngle: curDeg,
            sloshAngle: slosh,
            pourDir,
            spillProgress: 1
          });

          const fillP = Math.max(0, Math.min(1, (p - 0.08) / 0.92));
          const curDstScale = dstInitialScale + (1 - dstInitialScale) * fillP;
          const dstSlosh = Math.sin(p * Math.PI * 5) * 1.4 * Math.sin(p * Math.PI);
          dstLiquidGroup.innerHTML = buildLiquidLayersMarkup(dstFullLayers, dstIdx, {
            topLayerScale: curDstScale,
            tiltAngle: 0,
            sloshAngle: dstSlosh,
            splashColorKey: fillP > 0 ? pourColorKey : null,
            splashPhase: p
          });

          const currentTotalLayers = dstBottle.layers.length + moveCount * fillP;
          const svgSurfaceY = 193 - currentTotalLayers * 35.5;
          const screenSurfaceY = dstRect.top + (svgSurfaceY / 214) * dstRect.height;

          // 水柱起点设在倾倒瓶口内部（由于 #fx-overlay z-index=95 位于源瓶 z-index=100 后方，水柱顶部自然从源瓶口内侧流出！）
          const spoutStartX = targetLipX - pourDir * 2.5;
          const spoutStartY = targetLipY - 8.5;

          fxSvg.innerHTML = buildGravityStreamSVG(
            spoutStartX,
            spoutStartY,
            dstMouthX,
            dstMouthY,
            screenSurfaceY + 2,
            dstRect,
            pourDir,
            colObj,
            p
          );

          requestAnimationFrame(step);

        } else if (elapsed < moveDuration + pourDuration + returnDuration) {
          fxSvg.innerHTML = '';

          const p = (elapsed - moveDuration - pourDuration) / returnDuration;
          const ease = 1 - Math.pow(1 - p, 3);
          const curX = targetTranslateX * (1 - ease);
          const curY = targetTranslateY * (1 - ease);
          const curDeg = endTiltDeg * (1 - ease);
          const slosh = pourDir * Math.sin(p * Math.PI * 2) * 2.8 * (1 - p);

          srcEl.style.transform = `translate(${curX.toFixed(2)}px, ${curY.toFixed(2)}px) rotate(${curDeg.toFixed(2)}deg)`;

          const remainingSrcLayers = srcBottle.layers.slice(0, srcBottle.layers.length - moveCount);
          srcLiquidGroup.innerHTML = buildLiquidLayersMarkup(remainingSrcLayers, srcIdx, {
            topLayerScale: 1,
            tiltAngle: curDeg,
            sloshAngle: slosh,
            pourDir,
            spillProgress: 1 - ease
          });

          const dstSlosh = Math.sin(p * Math.PI * 3) * 1.8 * (1 - p);
          dstLiquidGroup.innerHTML = buildLiquidLayersMarkup(dstFullLayers, dstIdx, {
            topLayerScale: 1,
            tiltAngle: 0,
            sloshAngle: dstSlosh
          });

          requestAnimationFrame(step);

        } else if (elapsed < moveDuration + pourDuration + returnDuration + settleDuration) {
          srcEl.style.transform = '';
          const p = (elapsed - moveDuration - pourDuration - returnDuration) / settleDuration;
          const damp = Math.exp(-3.5 * p) * Math.sin(p * Math.PI * 3);

          const remainingSrcLayers = srcBottle.layers.slice(0, srcBottle.layers.length - moveCount);
          srcLiquidGroup.innerHTML = buildLiquidLayersMarkup(remainingSrcLayers, srcIdx, {
            topLayerScale: 1,
            tiltAngle: 0,
            sloshAngle: pourDir * 2.2 * damp
          });
          dstLiquidGroup.innerHTML = buildLiquidLayersMarkup(dstFullLayers, dstIdx, {
            topLayerScale: 1,
            tiltAngle: 0,
            sloshAngle: -pourDir * 1.6 * damp
          });

          requestAnimationFrame(step);

        } else {
          fxSvg.innerHTML = '';
          srcEl.style.transform = '';
          srcEl.style.transformOrigin = '';
          srcEl.classList.remove('pouring-source');
          dstEl.classList.remove('pouring-target');

          for (let k = 0; k < moveCount; k++) {
            srcBottle.layers.pop();
            dstBottle.layers.push(pourColorKey);
          }

          selectedIndex = null;

          if (isCompleteBottle(dstBottle)) {
            renderAll();
            packCompletedBottleIntoBag(dstIdx, pourColorKey);
          } else {
            isAnimating = false;
            renderAll();
          }
        }
      }

      requestAnimationFrame(step);
    }

    // 集满 4 层同色后飞入顶部 2.5D 手提礼盒袋
    function packCompletedBottleIntoBag(bottleIdx, colorKey) {
      let targetBagIdx = bags.findIndex(b => !b.locked && b.color === colorKey);
      if (targetBagIdx === -1) {
        targetBagIdx = bags.findIndex(b => !b.locked);
        if (targetBagIdx !== -1) bags[targetBagIdx].color = colorKey;
      }

      const gridEl = document.getElementById('bottles-grid');
      const bagsEl = document.getElementById('bags-stage');
      const bottleEl = gridEl.children[bottleIdx];
      const bagEl = bagsEl.children[targetBagIdx];

      const bRect = bottleEl.getBoundingClientRect();
      const bagRect = bagEl.getBoundingClientRect();

      const dx = (bagRect.left + bagRect.width / 2) - (bRect.left + bRect.width / 2);
      const dy = (bagRect.top + bagRect.height / 2) - (bRect.top + bRect.height / 2);

      playSound('pack');
      bottleEl.style.zIndex = '110';
      bottleEl.style.transition = 'transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.42s';
      bottleEl.style.transform = `translate(${dx}px, ${dy}px) scale(0.42)`;

      setTimeout(() => {
        bottles[bottleIdx].layers = [];
        bags[targetBagIdx].packedBottle = colorKey;
        packedTotal++;

        bottles.forEach(b => {
          if (b.special === 'knit_bag' && packedTotal >= b.unlockOrder) {
            b.special = 'none';
            showToast(`🧣 已打包 ${packedTotal} 个礼盒，${b.unlockOrder}号白色针织布套已揭开！`);
          }
        });

        renderAll();
        const updatedBagEl = document.getElementById('bags-stage').children[targetBagIdx];
        if (updatedBagEl) updatedBagEl.classList.add('packing-bounce');

        setTimeout(() => {
          bags[targetBagIdx].packedBottle = null;
          bags[targetBagIdx].color = pickNextNeededBagColor();
          isAnimating = false;
          renderAll();

          if (bottles.every(b => b.layers.length === 0)) {
            showWinModal();
          }
        }, 420);
      }, 420);
    }

    // ==========================================
    // 9. 底部按钮与菜单事件绑定
    // ==========================================
    document.getElementById('shuffle-btn').addEventListener('click', () => {
      if (isAnimating) return;
      const camBottle = bottles.find(b => b.special === 'ad_cam');
      if (camBottle && bottles.filter(b => b.special === 'none' && b.layers.length === 0).length === 0) {
        moveHistory.push(cloneState());
        camBottle.special = 'none';
        playSound('pack');
        showToast('✨ 已为您激活一个空瓶！');
        renderAll();
        return;
      }

      for (let i = 0; i < bottles.length; i++) {
        const src = bottles[i];
        if (src.special !== 'none' || src.layers.length === 0) continue;
        for (let j = 0; j < bottles.length; j++) {
          if (i === j) continue;
          const dst = bottles[j];
          if (canPourInto(src, dst) && dst.layers.length > 0) {
            selectedIndex = i;
            renderAll();
            setTimeout(() => performLiquidPour(i, j), 120);
            return;
          }
        }
      }

      moveHistory.push(cloneState());
      const pool = [];
      const openBottles = bottles.filter(b => b.special === 'none' && b.layers.length > 0);
      openBottles.forEach(b => {
        while (b.layers.length > 0) pool.push(b.layers.pop());
      });
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      let idx = 0;
      openBottles.forEach(b => {
        while (b.layers.length < 4 && idx < pool.length) {
          b.layers.push(pool[idx++]);
        }
      });
      if (shuffleUses > 0) shuffleUses--;
      playSound('pack');
      showToast('🔀 已为您重新洗牌整理瓶中液体！');
      renderAll();
    });

    document.getElementById('undo-btn').addEventListener('click', () => {
      if (isAnimating) return;
      if (moveHistory.length === 0) {
        showToast('当前已经是第一步了');
        return;
      }
      const prev = moveHistory.pop();
      bottles = prev.bottles;
      bags = prev.bags;
      packedTotal = prev.packedTotal;
      shuffleUses = prev.shuffleUses;
      selectedIndex = null;
      playSound('select');
      showToast('↩️ 已撤回上一步');
      renderAll();
    });

    function unlockAllSpecials() {
      moveHistory.push(cloneState());
      bottles.forEach(b => { b.special = 'none'; });
      bags.forEach(bg => {
        if (bg.locked) {
          bg.locked = false;
          bg.color = pickNextNeededBagColor();
        }
      });
      playSound('pack');
      showToast('🔓 已揭开所有白色针织布套与备用空瓶！');
      renderAll();
    }

    document.getElementById('quick-unlock-btn').addEventListener('click', unlockAllSpecials);

    const modalMask = document.getElementById('modal-mask');
    document.getElementById('settings-btn').addEventListener('click', () => {
      document.getElementById('modal-title').textContent = '⚙️ 第 5 关设置';
      document.getElementById('modal-sub').textContent = '集满 4 层同色药水自动飞入顶部 2.5D 手提礼盒袋，累计打包 1、2、3 个礼盒即可依次揭开针织布套！';
      modalMask.classList.add('show');
    });

    document.getElementById('modal-unlock-btn').addEventListener('click', () => {
      unlockAllSpecials();
      modalMask.classList.remove('show');
    });

    document.getElementById('modal-restart-btn').addEventListener('click', () => {
      initGame();
      modalMask.classList.remove('show');
      showToast('🔄 第 5 关已重置');
    });

    document.getElementById('modal-close-btn').addEventListener('click', () => {
      modalMask.classList.remove('show');
    });

    function showWinModal() {
      document.getElementById('modal-title').textContent = '🎉 第 5 关完美通关！';
      document.getElementById('modal-sub').textContent = '全部 17 瓶魔法药水均已装入 2.5D 礼盒手提袋打包完成！';
      modalMask.classList.add('show');
    }

    function initGame() {
      bottles = createReferenceLevel5();
      bags = createInitialBags();
      packedTotal = 0;
      selectedIndex = null;
      isAnimating = false;
      moveHistory = [];
      shuffleUses = 1;
      renderAll();
    }

    initGame();
  </script>
</body>
