<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>倒水不能停 - 第 5 关 (2.5D 奇幻瓶阵精修版)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #0b1c36 0%, #091326 40%, #060b18 100%);
      font-family: "PingFang SC", "Microsoft YaHei", "Arial Rounded MT Bold", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      position: relative;
    }

    .ambient-glow {
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 520px;
      height: 300px;
      background: radial-gradient(ellipse at center, rgba(42, 112, 196, 0.28) 0%, rgba(11, 28, 54, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .app-shell {
      position: relative;
      width: min(100vw, 530px);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 8px 14px;
    }

    /* ==================== 1. 顶部简洁导航栏（去除右侧胶囊，均衡排布） ==================== */
    .top-bar {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      justify-items: center;
      padding: 2px 10px;
      height: 48px;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .settings-btn {
      justify-self: start;
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: linear-gradient(180deg, #4db8ff 0%, #1f7ae0 65%, #155cb0 100%);
      border: 2px solid #8cdcff;
      box-shadow:
        inset 0 2px 2px rgba(255, 255, 255, 0.65),
        0 4px 0 #0d3b78,
        0 6px 12px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s;
    }
    .settings-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0d3b78;
    }

    .level-pill {
      justify-self: center;
      background: linear-gradient(180deg, #6b85c9 0%, #4d64a8 55%, #3c508f 100%);
      border: 2.5px solid #9bb5f7;
      outline: 2.5px solid #1b2d5e;
      border-radius: 22px;
      padding: 5px 32px;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-shadow: 0 2px 3px rgba(15, 26, 66, 0.85);
      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, 0.45),
        0 5px 12px rgba(0, 0, 0, 0.45);
    }

    .gamepad-icon {
      justify-self: end;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(15, 26, 48, 0.62);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.15s;
    }
    .gamepad-icon:hover {
      border-color: rgba(140, 220, 255, 0.65);
    }
    .gamepad-icon:active {
      transform: translateY(2px);
    }

    /* ==================== 2. 顶部 4 个 2.5D 手提礼盒袋 ==================== */
    .bags-stage {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 2px 8px 2px;
      height: 118px;
      align-items: end;
      justify-items: center;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .bag-slot {
      width: 100%;
      max-width: 104px;
      height: 114px;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .bag-slot:hover {
      transform: translateY(-3px);
    }
    .bag-slot.packing-bounce {
      animation: bagPackBounce 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes bagPackBounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.14, 0.9) translateY(4px); }
      70% { transform: scale(0.95, 1.08) translateY(-8px); }
      100% { transform: scale(1); }
    }

    /* ==================== 3. 中央 3排 × 7列 2.5D 瓶子网格 ==================== */
    .bottles-stage {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 2px;
      min-height: 0;
    }

    .bottles-grid {
      width: 100%;
      height: 100%;
      max-height: 540px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(3, 1fr);
      column-gap: 4px;
      row-gap: 10px;
      align-items: end;
      justify-items: center;
    }

    .bottle-slot {
      position: relative;
      width: 100%;
      max-width: 70px;
      height: 100%;
      max-height: 164px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
      will-change: transform;
      z-index: 20;
    }

    .bottle-slot.selected {
      transform: translateY(-18px) scale(1.05);
      filter: drop-shadow(0 14px 16px rgba(0, 0, 0, 0.72)) drop-shadow(0 0 12px rgba(255, 215, 80, 0.75));
      z-index: 50;
    }

    .bottle-slot.pouring-source {
      z-index: 100 !important;
      transition: none !important;
      filter: drop-shadow(0 18px 22px rgba(0, 0, 0, 0.75));
    }

    .bottle-slot.pouring-target {
      z-index: 85 !important;
    }

    .bottle-slot.breaking-fx {
      animation: bottleUnlockPop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes bottleUnlockPop {
      0% { transform: scale(0.92); filter: brightness(1.5); }
      55% { transform: scale(1.08); filter: brightness(1.25); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .bottle-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* ==================== 4. 底部 2.5D 双大按钮栏 ==================== */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 78px;
      padding: 4px 0 2px;
      height: 78px;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .big-action-btn {
      position: relative;
      width: 70px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(180deg, #52bfff 0%, #2684eb 55%, #1760ba 100%);
      border: 2.5px solid #9be0ff;
      box-shadow:
        inset 0 3px 5px rgba(255, 255, 255, 0.7),
        inset 0 -4px 6px rgba(10, 42, 94, 0.6),
        0 6px 0 #0c3975,
        0 10px 18px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s, filter 0.15s;
    }
    .big-action-btn:hover {
      filter: brightness(1.08);
    }
    .big-action-btn:active {
      transform: translateY(4px);
      box-shadow:
        inset 0 3px 5px rgba(255, 255, 255, 0.5),
        0 2px 0 #0c3975,
        0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .badge-red {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ff5252, #c62828 75%, #8e0000);
      border: 2px solid #ffcdd2;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      color: #fff;
    }

    .badge-cam {
      position: absolute;
      top: -7px;
      right: -10px;
      width: 30px;
      height: 22px;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.5));
    }

    /* 全屏 2.5D 液态水柱层（位于目标瓶 85 与倾倒瓶 100 之间） */
    #fx-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 95;
    }

    .toast-msg {
      position: fixed;
      top: 19%;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(18, 25, 62, 0.96);
      border: 2px solid #80d4ff;
      color: #ffffff;
      padding: 8px 20px;
      border-radius: 22px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
      z-index: 140;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
    }
    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(6, 9, 26, 0.84);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s;
    }
    .modal-mask.show {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      width: 325px;
      background: linear-gradient(180deg, #25337a 0%, #121b4a 100%);
      border: 3px solid #82c4ff;
      border-radius: 24px;
      padding: 24px 24px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
    }
    .modal-title {
      font-size: 23px;
      font-weight: 900;
      color: #ffdf5d;
      margin-bottom: 10px;
      text-shadow: 0 3px 0 #784700;
    }
    .modal-sub {
      font-size: 13.5px;
      color: #d6ecff;
      margin-bottom: 18px;
      line-height: 1.55;
    }
    .modal-btn {
      width: 100%;
      padding: 10px 0;
      margin-top: 10px;
      border-radius: 16px;
      border: 2px solid #9be0ff;
      background: linear-gradient(180deg, #4db8ff 0%, #1d72d6 100%);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #0c3975;
    }
    .modal-btn.gold {
      border-color: #ffe57f;
      background: linear-gradient(180deg, #ffd54f 0%, #f57c00 100%);
      color: #3b1700;
      box-shadow: 0 4px 0 #8f3f00;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="app-shell">
    <!-- 1. 顶部简洁导航栏（去除画圈胶囊，左设置、中关卡、右快捷解锁对称排布） -->
    <div class="top-bar">
      <div class="settings-btn" id="settings-btn" title="游戏菜单">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#ffffff">
          <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03-0.7,1.62-0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
      </div>

      <div class="level-pill">第 5 关</div>

      <div class="gamepad-icon" id="quick-unlock-btn" title="一键解锁全场特殊机关瓶">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dbeaff" stroke-width="2">
          <rect x="2" y="6" width="20" height="12" rx="6"/>
          <line x1="6" y1="12" x2="10" y2="12"/>
          <line x1="8" y1="10" x2="8" y2="14"/>
          <circle cx="15" cy="11" r="1.2" fill="#dbeaff"/>
          <circle cx="17" cy="13" r="1.2" fill="#dbeaff"/>
        </svg>
      </div>
    </div>

    <!-- 2. 顶部 4 个 2.5D 手提礼盒袋 -->
    <div class="bags-stage" id="bags-stage"></div>

    <!-- 3. 中央 3排 × 7列 2.5D 瓶子舞台 -->
    <div class="bottles-stage">
      <div class="bottles-grid" id="bottles-grid"></div>
    </div>

    <!-- 4. 底部操作按钮 -->
    <div class="bottom-bar">
      <div class="big-action-btn" id="shuffle-btn" title="智能提示 / 洗牌">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none">
          <path d="M10,34 C18,34 20,16 32,16 L37,16" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
          <polygon points="34,9 44,16 34,23" fill="#ffffff"/>
          <path d="M10,16 C18,16 20,34 32,34 L37,34" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
          <polygon points="34,27 44,34 34,41" fill="#ffffff"/>
        </svg>
        <div class="badge-red" id="shuffle-count">1</div>
      </div>

      <div class="big-action-btn" id="undo-btn" title="撤回一步">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none">
          <path d="M22,16 L11,24 L22,32 L22,26 C30,26 34,30 34,37 C37,31 37,20 26,19 L22,19 Z"
                fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <svg class="badge-cam" viewBox="0 0 36 26">
          <rect x="2" y="3" width="22" height="20" rx="5" fill="#ffffff" stroke="#4a7bbd" stroke-width="1.5"/>
          <polygon points="24,9 34,4 34,22 24,17" fill="#ffffff" stroke="#4a7bbd" stroke-width="1.5" stroke-linejoin="round"/>
          <polygon points="10,8 10,18 18,13" fill="#4a7bbd"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- 全屏流体特效层 -->
  <svg id="fx-overlay"></svg>

  <div class="toast-msg" id="toast-msg"></div>

  <!-- 菜单与通关弹窗 -->
  <div class="modal-mask" id="modal-mask">
    <div class="modal-card">
      <div class="modal-title" id="modal-title">⚙️ 倒水不能停</div>
      <div class="modal-sub" id="modal-sub">
        本关包含图 2 全新奇幻瓶阵玩法：<br/>
        ❓ <b>黑雾盲盒瓶</b>：倒出顶层水自动揭晓下层神秘颜色<br/>
        🧊 <b>寒冰/岩石底座</b>：完成倒水或打包礼盒即可震碎破冰<br/>
        🧣 <b>丝绸布幔/全身冰雕/牛皮纸袋</b>：打包礼盒依次解锁！
      </div>
      <button class="modal-btn gold" id="modal-unlock-btn">🔓 一键解锁全场特殊机关瓶</button>
      <button class="modal-btn" id="modal-restart-btn">🔄 重新开始第 5 关</button>
      <button class="modal-btn" id="modal-close-btn">▶️ 继续游戏</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 对照图1 & 图2 调校的 2.5D 饱满果冻质感液体色板
    // ==========================================
    const COLORS = {
      green:  {
        name: '草木绿',
        left: '#689c09', mid: '#76a811', highlight: '#94c91e', right: '#4e7804',
        topMid: '#95c31b', topRim: '#a4cf28', topLight: '#bde757',
        bagMain: '#5eb012', bagDark: '#428008'
      },
      orange: {
        name: '活力橙',
        left: '#d44b00', mid: '#f05a00', highlight: '#ff7b24', right: '#9e3500',
        topMid: '#ff781f', topRim: '#ff8c3b', topLight: '#ffb36b',
        bagMain: '#ea5504', bagDark: '#b33c00'
      },
      cyan:   {
        name: '天际青',
        left: '#0887c9', mid: '#12a4eb', highlight: '#47c4ff', right: '#046399',
        topMid: '#2cb9fc', topRim: '#4cc7ff', topLight: '#8ae0ff',
        bagMain: '#149ee3', bagDark: '#0b72ab'
      },
      yellow: {
        name: '明媚黄',
        left: '#d99b00', mid: '#f5b800', highlight: '#ffd438', right: '#a87400',
        topMid: '#ffcf24', topRim: '#ffdb4d', topLight: '#fff085',
        bagMain: '#f5a600', bagDark: '#c27d00'
      },
      blue:   {
        name: '深邃蓝',
        left: '#1026b0', mid: '#1c39e6', highlight: '#4766ff', right: '#091678',
        topMid: '#3858ff', topRim: '#5270ff', topLight: '#829bff',
        bagMain: '#1c31cc', bagDark: '#101d8a'
      },
      purple: {
        name: '神秘紫',
        left: '#68169e', mid: '#8422c7', highlight: '#ab47ed', right: '#480b70',
        topMid: '#9e3be0', topRim: '#b155f0', topLight: '#d48aff',
        bagMain: '#731fa8', bagDark: '#4d1078'
      },
      red:    {
        name: '珊瑚红',
        left: '#bd0f20', mid: '#de1b2f', highlight: '#ff4d5e', right: '#8c0714',
        topMid: '#f53649', topRim: '#ff5263', topLight: '#ff8a95',
        bagMain: '#d4151d', bagDark: '#990910'
      }
    };

    // ==========================================
    // 2. Web Audio API 合成逼真水流咕噜声、破冰声与装袋音效
    // ==========================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx && AudioCtx) audioCtx = new AudioCtx();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      ensureAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === 'select') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(840, now + 0.075);
        gain.gain.setValueAtTime(0.13, now);
        gain.gain.exponentialRampToValueAtTime(0.008, now + 0.08);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.085);
      } else if (type === 'pour') {
        for (let i = 0; i < 7; i++) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          const t = now + i * 0.07;
          const f = 290 + i * 62 + (i % 2) * 25;
          osc.frequency.setValueAtTime(f, t);
          osc.frequency.exponentialRampToValueAtTime(f * 1.48, t + 0.058);
          gain.gain.setValueAtTime(0.14, t);
          gain.gain.exponentialRampToValueAtTime(0.008, t + 0.062);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.068);
        }
      } else if (type === 'pack') {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.055);
          gain.gain.setValueAtTime(0.16, now + idx * 0.055);
          gain.gain.exponentialRampToValueAtTime(0.008, now + 0.25 + idx * 0.055);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(now + idx * 0.055);
          osc.stop(now + 0.27 + idx * 0.055);
        });
      }
    }

    // ==========================================
    // 3. 预计算瓶身内壁几何轮廓点（用于任意倾角下的重力液面弦宽与体积积分）
    // ==========================================
    const BOTTLE_INNER_POLY = (() => {
      const pts = [];
      pts.push({ x: 33, y: 20 });
      pts.push({ x: 67, y: 20 });
      pts.push({ x: 67, y: 28 });
      for (let i = 1; i <= 8; i++) {
        const t = i / 8;
        const mt = 1 - t;
        pts.push({
          x: mt * mt * 67 + 2 * mt * t * 84.5 + t * t * 84.5,
          y: mt * mt * 28 + 2 * mt * t * 37 + t * t * 58
        });
      }
      for (let i = 1; i <= 10; i++) {
        pts.push({ x: 84.5, y: 58 + (193 - 58) * (i / 10) });
      }
      for (let i = 1; i < 12; i++) {
        const ang = (i / 12) * Math.PI;
        pts.push({
          x: 50 + 34.5 * Math.cos(ang),
          y: 193 + 10.5 * Math.sin(ang)
        });
      }
      for (let i = 0; i <= 10; i++) {
        pts.push({ x: 15.5, y: 193 - (193 - 58) * (i / 10) });
      }
      for (let i = 1; i <= 8; i++) {
        const t = i / 8;
        const mt = 1 - t;
        pts.push({
          x: mt * mt * 15.5 + 2 * mt * t * 15.5 + t * t * 33,
          y: mt * mt * 58 + 2 * mt * t * 37 + t * t * 28
        });
      }
      return pts;
    })();

    function getTransformedContour(rad) {
      const cosA = Math.cos(rad);
      const sinA = Math.sin(rad);
      const tPts = new Array(BOTTLE_INNER_POLY.length);
      for (let i = 0; i < BOTTLE_INNER_POLY.length; i++) {
        const p = BOTTLE_INNER_POLY[i];
        const dx = p.x - 50;
        const dy = p.y - 115;
        tPts[i] = {
          X: 50 + dx * cosA - dy * sinA,
          Y: 115 + dx * sinA + dy * cosA
        };
      }
      return tPts;
    }

    function getChordAtGravityY(tPts, targetY) {
      let minX = Infinity;
      let maxX = -Infinity;
      const n = tPts.length;
      for (let i = 0; i < n; i++) {
        const p1 = tPts[i];
        const p2 = tPts[(i + 1) % n];
        if ((p1.Y <= targetY && p2.Y >= targetY) || (p2.Y <= targetY && p1.Y >= targetY)) {
          const dy = p2.Y - p1.Y;
          if (Math.abs(dy) < 1e-5) {
            if (p1.X < minX) minX = p1.X;
            if (p1.X > maxX) maxX = p1.X;
          } else {
            const t = (targetY - p1.Y) / dy;
            const x = p1.X + t * (p2.X - p1.X);
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
          }
        }
      }
      if (minX > maxX) {
        return { leftX: 15.5, rightX: 84.5, cx: 50, rx: 34.5 };
      }
      const cx = 0.5 * (minX + maxX);
      const rx = Math.max(8, 0.5 * (maxX - minX));
      return { leftX: minX, rightX: maxX, cx, rx };
    }

    function getPhysicalSpillAngleDeg(volumeLayers) {
      const v = Math.max(0.0, Math.min(4.0, volumeLayers));
      if (v >= 1.0) {
        return 96.0 - (v - 1.0) * 11.0;
      }
      return 96.0 + (1.0 - v) * 7.0;
    }

    // ==========================================
    // 6. 图1同款【饱满果冻双层厚唇液面】+ 零抖动物理重力液层渲染器
    // ==========================================
    function buildLiquidLayersMarkup(layers, idx, options = {}) {
      const {
        topLayerScale = 1,
        tiltAngle = 0,
        pourDir = 1,
        spillProgress = 0,
        mysteryCount = 0
      } = options;

      if (layers.length === 0) return '';

      // 若该瓶有黑雾盲盒层 (mysteryCount > 0)，将底部未揭晓的层渲染为黑雾层 'mystery_dark'
      const effectiveLayers = layers.map((c, i) => (i < mysteryCount ? 'mystery_dark' : c));

      let topSameCount = 1;
      for (let i = effectiveLayers.length - 2; i >= 0; i--) {
        if (effectiveLayers[i] === effectiveLayers[effectiveLayers.length - 1]) topSameCount++;
        else break;
      }
      const baseLayersCount = effectiveLayers.length - topSameCount;

      const groups = [];
      let idxCursor = 0;
      while (idxCursor < baseLayersCount) {
        const cKey = effectiveLayers[idxCursor];
        let cnt = 1;
        while (idxCursor + cnt < baseLayersCount && effectiveLayers[idxCursor + cnt] === cKey) {
          cnt++;
        }
        groups.push({ colorKey: cKey, amount: cnt });
        idxCursor += cnt;
      }
      const topAmount = topSameCount * Math.max(0, topLayerScale);
      if (topAmount > 0.005) {
        groups.push({ colorKey: effectiveLayers[effectiveLayers.length - 1], amount: topAmount });
      }
      if (groups.length === 0) return '';

      const totalVolume = groups.reduce((acc, g) => acc + g.amount, 0);
      if (totalVolume <= 0.005) return '';

      const effectiveTiltDeg = tiltAngle;
      const absTilt = Math.abs(effectiveTiltDeg);

      // 竖直状态（含倒完水后的静止状态）：还原图1饱满厚实的 2.5D 椭圆液面 (ry = 10.6 + 双层立体厚唇)
      if (absTilt < 0.08) {
        let html = '';
        let curY = 193;
        const rx = 34.5;
        const ry = 9.2; // 严格按图1实测长短轴比 0.266 设定的饱满椭圆比例
        for (let i = 0; i < groups.length; i++) {
          const g = groups[i];
          const h = g.amount * 35.5;
          const yBot = curY;
          const yTop = curY - h;
          curY = yTop;
          const yBotDraw = (i === 0) ? yBot + 4 : yBot;
          const gradId = g.colorKey === 'mystery_dark' ? `liq-mystery-${idx}` : `liq-${g.colorKey}-${idx}`;
          html += `
            <path d="M 15.5,${yTop.toFixed(2)}
                     L 84.5,${yTop.toFixed(2)}
                     L 84.5,${yBotDraw.toFixed(2)}
                     A ${rx},${ry} 0 0,1 15.5,${yBotDraw.toFixed(2)}
                     Z"
                  fill="url(#${gradId})" />
          `;
          // 层间饱满柔光过渡线
          if (i > 0) {
            const sepCol = g.colorKey === 'mystery_dark' ? '#3a3f66' : COLORS[g.colorKey].topRim;
            html += `
              <path d="M 16,${yBot.toFixed(2)} A ${rx},${ry} 0 0,0 84,${yBot.toFixed(2)}"
                    fill="none" stroke="${sepCol}" stroke-width="1.1" opacity="0.55" />
            `;
          }
        }

        // 绘制黑雾盲盒层的白色立体 '?' 问号
        if (mysteryCount > 0) {
          for (let m = 0; m < Math.min(mysteryCount, layers.length); m++) {
            const qY = 193 - m * 35.5 - 11;
            html += `
              <text x="50" y="${qY.toFixed(1)}" text-anchor="middle" fill="#ffffff"
                    font-size="22" font-weight="900" font-family="Arial Rounded MT Bold, Arial Black, sans-serif"
                    style="filter: drop-shadow(0 2px 3px rgba(0,0,0,0.85));">?</text>
            `;
          }
        }

        // 最顶层水面：严格按照参考图1打造一体成型饱满凸面椭圆 (无生硬描边与凹陷内圈，前沿自然亮唇过渡)
        const topColorKey = groups[groups.length - 1].colorKey;
        html += `
          <ellipse cx="50" cy="${curY.toFixed(2)}" rx="${rx}" ry="${ry.toFixed(2)}"
                   fill="url(#top-${topColorKey}-${idx})" />
        `;
        return html;
      }

      // 倾斜状态：真实物理重力 + 连续无跳变底部定位
      const rad = (effectiveTiltDeg * Math.PI) / 180;
      const absSin = Math.abs(Math.sin(rad));
      const cosR = Math.cos(rad);
      const tPtsTop = getTransformedContour(rad);

      // 关键修复：求 yBotGravity 时将瓶底采样点 Y 上限约束在直筒底 y=193，使 tiltAngle->0° 时 yBotGravity 精确收敛于 193.00，彻底消除回瓶时的液面跳动！
      let yBotGravity = -Infinity;
      for (let i = 0; i < tPtsTop.length; i++) {
        const origP = BOTTLE_INNER_POLY[i];
        if (origP.y >= 28) {
          const clampedY = Math.min(193, origP.y);
          const dx = origP.x - 50;
          const dy = clampedY - 115;
          const gY = 115 + dx * Math.sin(rad) + dy * cosR;
          if (gY > yBotGravity) yBotGravity = gY;
        }
      }

      const yLipGravity = 115 + 16.5 * absSin - 90 * cosR;
      const uprightTotalH = totalVolume * 35.5;
      const fullSpillDepth = Math.max(12, yBotGravity - yLipGravity);

      const drainFactor = totalVolume < 0.90
        ? Math.max(0.08, Math.pow(totalVolume / 0.90, 0.52))
        : 1.0;
      const spillTotalH = fullSpillDepth * drainFactor;

      const totalGravityDepth = (1 - spillProgress) * uprightTotalH + spillProgress * spillTotalH;
      const yTopGravity = yBotGravity - totalGravityDepth;

      const SAMPLES = 24;
      const dY = totalGravityDepth / SAMPLES;
      const cumArea = new Float64Array(SAMPLES + 1);
      cumArea[0] = 0;
      for (let s = 1; s <= SAMPLES; s++) {
        const sampleY = yBotGravity - (s - 0.5) * dY;
        const chord = getChordAtGravityY(tPtsTop, sampleY);
        const effWidth = 0.45 * (chord.rx * 2) + 0.55 * 69;
        cumArea[s] = cumArea[s - 1] + effWidth * dY;
      }
      const totalArea = cumArea[SAMPLES] || 1;

      const interpY = (targetA) => {
        if (targetA <= 0) return yBotGravity;
        if (targetA >= totalArea) return yTopGravity;
        let lo = 0, hi = SAMPLES;
        while (lo < hi - 1) {
          const mid = (lo + hi) >> 1;
          if (cumArea[mid] < targetA) lo = mid;
          else hi = mid;
        }
        const span = (cumArea[hi] - cumArea[lo]) || 1e-6;
        const frac = (targetA - cumArea[lo]) / span;
        return yBotGravity - (lo + frac) * dY;
      };

      const numGroups = groups.length;
      const multiLayerShearFade = numGroups > 1 ? Math.max(0, Math.min(1, (82 - absTilt) / 22)) : 0;
      const interfaces = [];
      let accVol = 0;
      for (let k = 0; k <= numGroups; k++) {
        const volFrac = k === 0 ? 0 : (k === numGroups ? 1 : accVol / totalVolume);
        const areaTarget = volFrac * totalArea;
        const yG = k === 0 ? yBotGravity : (k === numGroups ? yTopGravity : interpY(areaTarget));

        const rawShear = (k === 0 || k === numGroups) ? 1.0 : (0.74 + 0.22 * volFrac);
        const shearFactor = 1.0 - (1.0 - rawShear) * multiLayerShearFade;
        const chord = getChordAtGravityY(tPtsTop, yG);
        interfaces.push({ yG, shearFactor, chord });
        if (k < numGroups) accVol += groups[k].amount;
      }

      let html = '';
      for (let i = 0; i < numGroups; i++) {
        const g = groups[i];
        const lowerIf = interfaces[i];
        const upperIf = interfaces[i + 1];

        const upperRelDeg = (1 - upperIf.shearFactor) * effectiveTiltDeg;
        const lowerRelDeg = (1 - lowerIf.shearFactor) * effectiveTiltDeg;
        const upperTan = Math.tan((upperRelDeg * Math.PI) / 180);
        const lowerTan = Math.tan((lowerRelDeg * Math.PI) / 180);

        const minX = -55;
        const maxX = 155;
        const cxU = upperIf.chord.cx;
        const cxL = lowerIf.chord.cx;

        const yUL = upperIf.yG + (minX - cxU) * upperTan;
        const yUR = upperIf.yG + (maxX - cxU) * upperTan;

        const yBotBase = (i === 0) ? (lowerIf.yG + 18) : lowerIf.yG;
        const yBL = yBotBase + (minX - cxL) * lowerTan;
        const yBR = yBotBase + (maxX - cxL) * lowerTan;

        const botRx = (maxX - minX) * 0.52;
        const botRy = (i === 0) ? 4 : Math.min(12.0, Math.max(7.5, lowerIf.chord.rx * 0.24));
        const gradId = g.colorKey === 'mystery_dark' ? `liq-mystery-${idx}` : `liq-${g.colorKey}-${idx}`;

        html += `
          <path d="M ${minX},${yUL.toFixed(2)}
                   L ${maxX},${yUR.toFixed(2)}
                   L ${maxX},${yBR.toFixed(2)}
                   A ${botRx.toFixed(2)},${botRy.toFixed(2)} ${lowerRelDeg.toFixed(2)} 0,1 ${minX},${yBL.toFixed(2)}
                   Z"
                fill="url(#${gradId})" />
        `;
      }

      const topIf = interfaces[numGroups];
      const topChord = topIf.chord;
      const topCx = topChord.cx;
      const topRx = topChord.rx + 0.4;
      const maxRyByDepth = Math.max(6.8, totalGravityDepth * 0.72);
      const topRy = Math.min(11.0, maxRyByDepth, Math.max(7.5, topChord.rx * 0.24));
      const topColorKey = groups[numGroups - 1].colorKey;
      const colTop = COLORS[topColorKey] || COLORS.green;

      html += `
        <ellipse cx="${topCx.toFixed(2)}" cy="${topIf.yG.toFixed(2)}"
                 rx="${topRx.toFixed(2)}" ry="${topRy.toFixed(2)}"
                 fill="url(#top-${topColorKey}-${idx})" />
      `;

      return `
        <g transform="rotate(${(-effectiveTiltDeg).toFixed(2)}, 50, 115)">
          ${html}
        </g>
      `;
    }

    // ==========================================
    // 7. 图2全套新奇瓶子样式与高质感玻璃瓶渲染器
    // ==========================================
    function renderBottleSVG(b, idx) {
      let defsHTML = '';
      Object.entries(COLORS).forEach(([key, col]) => {

          <linearGradient id="top-${key}-${idx}" x1="0%" y1="0%" x2="0%" y2="100%">

        slot.innerHTML = renderBottleSVG(b, idx);
        slot.addEventListener('click', () => onBottleClick(idx));
        grid.appendChild(slot);
      });

      document.getElementById('shuffle-count').textContent = shuffleUses;
    }

    // ==========================================
    // 9. 新奇瓶子机关交互 + 零抖动真实物理重力倾倒动画
    // ==========================================
    function onBagClick(bagIdx) {
      if (isAnimating) return;
      const bag = bags[bagIdx];
      if (bag.locked) {
        moveHistory.push(cloneState());
        bag.locked = false;
        bag.color = pickNextNeededBagColor();
        playSound('pack');
        showToast('🛍️ 已为您解锁第 4 个礼盒手提袋槽位！');
        renderAll();
      } else {
        showToast(`🛍️ 集满 4 层【${COLORS[bag.color].name}】药水即可自动装入此礼盒袋！`);
      }
    }

    function pickNextNeededBagColor() {
      const activeBagColors = bags.filter(b => !b.locked && b.color).map(b => b.color);
      const remainingColors = [];
      bottles.forEach(b => {
        b.layers.forEach(c => {
          if (!remainingColors.includes(c)) remainingColors.push(c);
        });
      });
      return remainingColors.find(c => !activeBagColors.includes(c)) || remainingColors[0] || 'red';
    }

    function isCompleteBottle(b) {
      return b.special === 'none' && (!b.mysteryCount || b.mysteryCount === 0) && b.layers.length === 4 && b.layers.every(c => c === b.layers[0]);
    }

    // 判断瓶子是否可作为倾倒源拿起
    function canSelectBottle(b) {
      if (b.special === 'silk_drape') {
        showToast(`🧣 蓝白丝绸布幔锁住中！打包 ${b.unlockOrder} 个礼盒即可掀开`);
        return false;
      }
      if (b.special === 'full_ice') {
        showToast(`🧊 全冰雕冻结中！累计打包 ${b.unlockOrder} 个礼盒即可破冰融化`);
        return false;
      }
      if (b.special === 'paper_bag') {
        showToast(`🛍️ 牛皮纸袋包裹中！打包 ${b.unlockOrder} 个礼盒即可拆开纸袋`);
        return false;
      }
      if (b.special === 'ice_base') {
        showToast(`❄️ 瓶底被寒冰冻结（还可接水）！再完成 ${b.poursToBreak || 1} 次倒水自动震碎寒冰`);
        return false;
      }
      if (b.special === 'stone_base') {
        showToast(`🪨 瓶底被岩石卡住（还可接水）！再完成 ${b.poursToBreak || 1} 次倒水自动震碎岩石`);
        return false;
      }
      if (b.special === 'ad_cam') return false;
      if (b.layers.length === 0 || isCompleteBottle(b)) return false;
      return true;
    }

    // 判断瓶子是否可以接收倾倒的水（冰封底座瓶 ice_base 与岩石底座瓶 stone_base 瓶口敞开，允许接水！）
    function canPourInto(src, dst) {
      const openMouthSpecials = ['none', 'ice_base', 'stone_base'];
      if (!openMouthSpecials.includes(dst.special)) return false;
      if (dst.layers.length >= 4 || src.layers.length === 0) return false;
      if (dst.layers.length === 0) return true;
      return src.layers[src.layers.length - 1] === dst.layers[dst.layers.length - 1];
    }

    function onBottleClick(idx) {
      if (isAnimating) return;
      const clicked = bottles[idx];

      if (clicked.special === 'ad_cam') {
        moveHistory.push(cloneState());
        clicked.special = 'none';
        playSound('pack');
        showToast('🎬 紫光魔法场记板已激活为免费空瓶！');
        renderAll();
        return;
      }

      if (selectedIndex === null) {
        if (canSelectBottle(clicked)) {
          selectedIndex = idx;
          playSound('select');
          renderAll();
        }
        return;
      }

      if (selectedIndex === idx) {
        selectedIndex = null;
        playSound('select');
        renderAll();
        return;
      }

      const src = bottles[selectedIndex];
      const dst = clicked;

      if (canPourInto(src, dst)) {
        performLiquidPour(selectedIndex, idx);
      } else if (canSelectBottle(dst)) {
        selectedIndex = idx;
        playSound('select');
        renderAll();
      } else {
        selectedIndex = null;
        renderAll();
      }
    }

    function buildGravityStreamSVG(spoutX, spoutY, mouthX, mouthY, surfaceY, dstRect, pourDir, colObj, pourProgress, splashCtx) {
      const {
        initialDstLayers = 0, // 接水前目标瓶原有的水层数 (0 = 空瓶, 1~3 = 原先有水)
        moveCount = 1,        // 本次倾倒的格数 (1格 vs 2~3格大水量)
        currentTotalLayers = 0
      } = splashCtx || {};

      const headRatio = Math.min(1, pourProgress / 0.10);
      const tailRatio = pourProgress > 0.90 ? Math.min(1, (pourProgress - 0.90) / 0.10) : 0;

      const totalDrop = Math.max(20, surfaceY - spoutY);
      const yStart = spoutY + totalDrop * (tailRatio * tailRatio * 0.82);
      const yEnd = spoutY + totalDrop * (headRatio * headRatio);
      if (yEnd - yStart < 4) return '';

      const N = 22;
      const leftEdge = [];
      const rightEdge = [];
      const centerCurve = [];

      const archHeight = Math.max(15, (mouthY - spoutY) + 14);
      // 倾倒 2~3 格水时水柱流量更大，半径略粗于 1 格水
      const fluxRadiusBoost = 1 + (moveCount - 1) * 0.12;

      for (let i = 0; i <= N; i++) {
        const s = i / N;
        const y = yStart + (yEnd - yStart) * s;
        const dyFromSpout = Math.max(0, y - spoutY);
        const globalS = Math.max(0, Math.min(1, dyFromSpout / totalDrop));

        let x;
        if (dyFromSpout < archHeight) {
          const tArch = dyFromSpout / archHeight;
          const easeArch = 1 - Math.pow(1 - tArch, 2.2);
          x = spoutX + (mouthX - spoutX) * easeArch;
        } else {
          x = mouthX;
        }

        const halfW = (4.3 * fluxRadiusBoost - 1.0 * Math.sqrt(globalS)) * (tailRatio > 0 ? (1 - tailRatio * 0.45) : 1);

        leftEdge.push({ x: x - halfW, y, halfW });
        rightEdge.push({ x: x + halfW, y, halfW });
        centerCurve.push(`${(x - halfW * 0.15).toFixed(2)},${y.toFixed(2)}`);
      }

      const firstL = leftEdge[0];
      const firstR = rightEdge[0];
      const lastL = leftEdge[leftEdge.length - 1];
      const lastR = rightEdge[rightEdge.length - 1];

      let streamPath = `M ${firstL.x.toFixed(2)},${firstL.y.toFixed(2)} `;
      streamPath += `A ${firstL.halfW.toFixed(2)},${(firstL.halfW * 0.85).toFixed(2)} 0 0,1 ${firstR.x.toFixed(2)},${firstR.y.toFixed(2)} `;
      for (let i = 1; i < rightEdge.length; i++) {
        streamPath += `L ${rightEdge[i].x.toFixed(2)},${rightEdge[i].y.toFixed(2)} `;
      }
      streamPath += `A ${lastL.halfW.toFixed(2)},${(lastL.halfW * 0.7).toFixed(2)} 0 0,1 ${lastL.x.toFixed(2)},${lastL.y.toFixed(2)} `;
      for (let i = leftEdge.length - 2; i >= 0; i--) {
        streamPath += `L ${leftEdge[i].x.toFixed(2)},${leftEdge[i].y.toFixed(2)} `;
      }
      streamPath += 'Z';

      const highlightPath = 'M ' + centerCurve.join(' L ');

      const scale = Math.min(dstRect.width / 100, dstRect.height / 214);
      const offX = dstRect.left + (dstRect.width - 100 * scale) * 0.5;
      const offY = dstRect.top + (dstRect.height - 214 * scale) * 0.5;
      const sx = (x) => (offX + x * scale).toFixed(2);
      const sy = (y) => (offY + y * scale).toFixed(2);
      const rx23 = (23 * scale).toFixed(2);
      const ry52 = (5.2 * scale).toFixed(2);
      const ry48 = (4.8 * scale).toFixed(2);
      const rx21 = (21 * scale).toFixed(2);

      // ==========================================================
      // 物理差异化水花溅落系统：
      // 区分 [空瓶 vs 原有水瓶] × [接收1格水 vs 接收2~3格水]
      // ==========================================================
      let impactFoamHTML = '';
      if (headRatio >= 0.98 && tailRatio < 0.88) {
        const cx = mouthX;
        const cy = surfaceY;
        const rScale = scale;

        const isEmptyBottleStart = (initialDstLayers === 0);
        const isMultiUnitPour = (moveCount >= 2);
        // 湍流强度因子：1格水轻巧 (0.85)，2格水饱满 (1.22)，3格水澎湃 (1.45)
        // 且多格水在倾倒中后段随能量累积而愈发翻涌
        const buildup = isMultiUnitPour ? (0.88 + 0.38 * Math.sin(pourProgress * Math.PI)) : 0.85;
        const intensity = (0.85 + (moveCount - 1) * 0.28) * buildup;

        const w1 = Math.sin(pourProgress * (16 + moveCount * 4)) * (1.1 * intensity);
        const w2 = Math.cos(pourProgress * (18 + moveCount * 4)) * (0.95 * intensity);

        let subWaterFX = '';
        let ripplesFX = '';
        let crownAndBubblesFX = '';
        let airborneDropsFX = '';

        // --- A. 水下缓冲池效应 vs 空瓶硬底撞击效应 ---
        if (!isEmptyBottleStart || currentTotalLayers > 0.55) {
          // 【原有水瓶（或水位已积起深水垫）】：
          // 水柱冲击液面后向下贯入深水层，形成半透明【水下下潜气穴漏斗】与【向上浮起的晶莹水下气泡群】！
          const maxPoolDepthPx = Math.min(48, currentTotalLayers * 28);
          const plungeDepth = Math.min(maxPoolDepthPx, (isEmptyBottleStart ? 11 : 17) * intensity);

          // 1) 水下下潜气柱锥影
          subWaterFX += `
            <path d="M ${(-3.8 * fluxRadiusBoost).toFixed(1)},1
                     Q ${(-2.2 * fluxRadiusBoost).toFixed(1)},${(plungeDepth * 0.7).toFixed(1)} 0,${plungeDepth.toFixed(1)}
                     Q ${(2.2 * fluxRadiusBoost).toFixed(1)},${(plungeDepth * 0.7).toFixed(1)} ${(3.8 * fluxRadiusBoost).toFixed(1)},1 Z"
                  fill="${colObj.topLight}" opacity="0.42" />
          `;

          // 2) 水下上浮珍珠气泡群（原有水瓶或接收2~3格水时气泡更密集、下潜更深）
          const bubbleCount = (isEmptyBottleStart ? 2 : 4) + (moveCount - 1) * 3;
          for (let b = 0; b < bubbleCount; b++) {
            const phaseB = (pourProgress * (2.6 + b * 0.35) + b * 0.27) % 1.0;
            // 气泡先随水柱下潜随后向两侧散开并上浮至液面 (y > 0 为液面以下)
            const spreadDir = (b % 2 === 0 ? 1 : -1) * (1 + (b % 3) * 0.45);
            const bx = spreadDir * (3.2 + phaseB * 9.5 * intensity) + Math.sin(phaseB * 8 + b) * 1.4;
            const by = 3.0 + (1 - phaseB) * Math.min(maxPoolDepthPx - 3, plungeDepth * 1.35);
            const br = (1.5 + (b % 3) * 0.65) * (1 - phaseB * 0.25);
            subWaterFX += `
              <circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${br.toFixed(1)}"
                      fill="${colObj.topLight}" stroke="#ffffff" stroke-width="0.45" opacity="${(0.78 - phaseB * 0.45).toFixed(2)}" />
            `;
          }

          // 3) 深水缓冲池的同心椭圆涟漪波纹（原有水瓶液面宽广稳定，荡开双层柔润波纹）
          const ripplePhase1 = (pourProgress * 3.2) % 1.0;
          const ripplePhase2 = (pourProgress * 3.2 + 0.5) % 1.0;
          const rxMax = isMultiUnitPour ? 28 : 21;
          ripplesFX += `
            <ellipse cx="0" cy="0.6" rx="${(7 + ripplePhase1 * rxMax).toFixed(1)}" ry="${(1.8 + ripplePhase1 * 5.2).toFixed(1)}"
                     fill="none" stroke="${colObj.topLight}" stroke-width="${(1.3 * (1 - ripplePhase1)).toFixed(2)}"
                     opacity="${(0.75 * (1 - ripplePhase1)).toFixed(2)}" />
            <ellipse cx="0" cy="0.6" rx="${(7 + ripplePhase2 * rxMax).toFixed(1)}" ry="${(1.8 + ripplePhase2 * 5.2).toFixed(1)}"
                     fill="none" stroke="#ffffff" stroke-width="${(1.0 * (1 - ripplePhase2)).toFixed(2)}"
                     opacity="${(0.55 * (1 - ripplePhase2)).toFixed(2)}" />
          `;
        }

        // --- B. 空瓶初段直接撞击硬质玻璃瓶底的高速放射飞溅皇冠与高弹水珠 ---
        if (isEmptyBottleStart && currentTotalLayers < 0.92) {
          // 空瓶底部无深水缓冲，高落差水流直击硬玻璃底，激起向外张开的皇冠溅射水花瓣与高抛飞珠！
          const hardFactor = Math.max(0.15, 1 - currentTotalLayers / 0.95);
          const splashDropCount = 5 + (moveCount - 1) * 4;
          const crownSpread = (12 + (moveCount - 1) * 4.5) * (0.75 + 0.25 * hardFactor);
          const crownHeight = (11 + (moveCount - 1) * 4.0) * (0.75 + 0.25 * hardFactor);

          ripplesFX += `
            <!-- 空瓶硬底撞击扩散水环 -->
            <ellipse cx="0" cy="0.8" rx="${(15 + (moveCount - 1) * 4 + Math.abs(w1) * 2.5).toFixed(1)}"
                     ry="${(3.4 + Math.abs(w2) * 0.6).toFixed(1)}"
                     fill="${colObj.topLight}" opacity="${(0.58 * hardFactor).toFixed(2)}" />
            <!-- 空瓶硬底专属：向外飞溅的皇冠侧翼水花尖瓣 -->
            <path d="M -3,0
                     Q ${(-crownSpread * 0.55).toFixed(1)},${(-crownHeight * 0.95 - w1).toFixed(1)} ${(-crownSpread).toFixed(1)},${(-crownHeight * 0.55 + w2).toFixed(1)}
                     Q ${(-crownSpread * 0.65).toFixed(1)},${(-crownHeight * 0.15).toFixed(1)} -2,1 Z"
                  fill="${colObj.topLight}" opacity="${(0.88 * hardFactor).toFixed(2)}" />
            <path d="M 3,0
                     Q ${(crownSpread * 0.55).toFixed(1)},${(-crownHeight * 0.95 + w2).toFixed(1)} ${(crownSpread).toFixed(1)},${(-crownHeight * 0.55 - w1).toFixed(1)}
                     Q ${(crownSpread * 0.65).toFixed(1)},${(-crownHeight * 0.15).toFixed(1)} 2,1 Z"
                  fill="${colObj.topLight}" opacity="${(0.88 * hardFactor).toFixed(2)}" />
          `;

          for (let d = 0; d < splashDropCount; d++) {
            const tDrop = (pourProgress * (3.8 + d * 0.35) + d * 0.17) % 1.0;
            const side = d % 2 === 0 ? 1 : -1;
            const maxXReach = side * (9 + (d % 3) * 5.2 + (moveCount - 1) * 3.5);
            const peakHeight = (10 + (d % 3) * 4.8 + (moveCount - 1) * 3.8) * (0.7 + 0.3 * hardFactor);
            // 严格在液面上方 (dy <= 0) 做抛物线弹射，绝不穿出瓶底
            const dx = maxXReach * (0.25 + 0.75 * tDrop);
            const dy = -Math.sin(tDrop * Math.PI) * peakHeight - 1.5;
            const dr = (1.6 + (d % 2) * 0.65 + (moveCount - 1) * 0.25) * (1 - tDrop * 0.35);
            airborneDropsFX += `
              <circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="${dr.toFixed(1)}"
                      fill="${colObj.topLight}" stroke="#ffffff" stroke-width="0.35" opacity="${(0.92 * hardFactor).toFixed(2)}" />
            `;
          }
        }

        // --- C. 接收 1 格水 vs 接收 2~3 格水的中央翻涌水冠与飞珠差异 ---
        const cW = 10.5 * intensity;
        const cH = (9.5 + (moveCount - 1) * 3.2) * buildup;
        crownAndBubblesFX += `
          <!-- 中央主翻涌液冠（随倾倒格数 moveCount 增高拓宽） -->
          <path d="M ${(-cW).toFixed(1)},-0.5
                   Q ${(-cW * 0.65).toFixed(1)},${(-cH - w1).toFixed(1)} 0,${(-cH * 0.82 + w2).toFixed(1)}
                   Q ${(cW * 0.65).toFixed(1)},${(-cH - w2).toFixed(1)} ${cW.toFixed(1)},-0.5 Z"
                fill="${colObj.mid}" />
          <path d="M ${(-cW * 0.7).toFixed(1)},-0.5
                   Q 0,${(-cH * 1.12 - w1).toFixed(1)} ${(cW * 0.7).toFixed(1)},-0.5 Z"
                fill="${colObj.topMid}" opacity="0.94" />
        `;

        // 基础左右双半月立体液泡（1格水紧凑小巧，2~3格水饱满硕大）
        const bScale = 0.86 + (moveCount - 1) * 0.18;
        crownAndBubblesFX += `
          <g transform="translate(${(-4.6 * bScale + w1 * 0.25).toFixed(1)}, ${(0.8 + w2 * 0.15).toFixed(1)}) scale(${bScale.toFixed(2)})">
            <circle cx="0" cy="0" r="4.1" fill="${colObj.right}" opacity="0.62" />
            <circle cx="0.5" cy="-0.8" r="3.3" fill="${colObj.topMid}" />
            <circle cx="0.9" cy="-1.3" r="2.0" fill="${colObj.topLight}" />
          </g>
          <g transform="translate(${(4.6 * bScale - w2 * 0.25).toFixed(1)}, ${(1.0 - w1 * 0.15).toFixed(1)}) scale(${bScale.toFixed(2)})">
            <circle cx="0" cy="0" r="3.9" fill="${colObj.right}" opacity="0.62" />
            <circle cx="-0.5" cy="-0.8" r="3.1" fill="${colObj.topMid}" />
            <circle cx="-0.9" cy="-1.3" r="1.8" fill="${colObj.topLight}" />
          </g>
        `;

        // 若接收 2 格或 3 格水 (isMultiUnitPour)，额外激起【外侧次级翻滚泡沫簇 + 空中跃起水珠】！
        if (isMultiUnitPour) {
          const extraS = 0.72 + (moveCount - 2) * 0.22;
          crownAndBubblesFX += `
            <!-- 多格大水量专属：外侧次级翻涌液泡簇与中央高突浪尖 -->
            <g transform="translate(${(-9.2 + w2 * 0.35).toFixed(1)}, ${(-0.4 - w1 * 0.2).toFixed(1)}) scale(${extraS.toFixed(2)})">
              <circle cx="0" cy="0" r="3.8" fill="${colObj.right}" opacity="0.55" />
              <circle cx="0.4" cy="-0.7" r="3.1" fill="${colObj.topMid}" />
              <circle cx="0.8" cy="-1.2" r="1.8" fill="${colObj.topLight}" />
            </g>
            <g transform="translate(${(9.2 - w1 * 0.35).toFixed(1)}, ${(-0.2 + w2 * 0.2).toFixed(1)}) scale(${extraS.toFixed(2)})">
              <circle cx="0" cy="0" r="3.7" fill="${colObj.right}" opacity="0.55" />
              <circle cx="-0.4" cy="-0.7" r="3.0" fill="${colObj.topMid}" />
              <circle cx="-0.8" cy="-1.2" r="1.7" fill="${colObj.topLight}" />
            </g>
            <circle cx="${(w1 * 0.3).toFixed(1)}" cy="${(-2.2 + w2 * 0.2).toFixed(1)}" r="${(3.2 * extraS).toFixed(1)}"
                    fill="${colObj.topLight}" opacity="0.88" />
          `;

          // 多格大水量持续冲击激起的跃空水滴
          const jetDrops = moveCount * 2;
          for (let jd = 0; jd < jetDrops; jd++) {
            const tp = (pourProgress * (3.6 + jd * 0.3) + jd * 0.23) % 1.0;
            const dir = jd % 2 === 0 ? 1 : -1;
            const jx = dir * (6.0 + (jd % 3) * 4.5) * (0.2 + 0.8 * tp);
            const jy = -2.5 - Math.sin(tp * Math.PI) * (8.5 + (jd % 3) * 3.5 + (moveCount - 2) * 3.0);
            const jr = (1.5 + (jd % 2) * 0.55) * (1 - tp * 0.35);
            airborneDropsFX += `
              <circle cx="${jx.toFixed(1)}" cy="${jy.toFixed(1)}" r="${jr.toFixed(1)}"
                      fill="${colObj.topLight}" stroke="#ffffff" stroke-width="0.3" opacity="0.92" />
            `;
          }
        }

        impactFoamHTML = `
          <g transform="translate(${cx.toFixed(2)}, ${cy.toFixed(2)}) scale(${rScale.toFixed(3)})">
            ${ripplesFX}
            ${subWaterFX}
            ${crownAndBubblesFX}
            ${airborneDropsFX}
          </g>
        `;
      }

      return `
        <defs>
          <linearGradient id="liveStreamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="${colObj.left}" />
            <stop offset="45%" stop-color="${colObj.topLight}" />
            <stop offset="82%" stop-color="${colObj.mid}" />
            <stop offset="100%" stop-color="${colObj.right}" />
          </linearGradient>
          <linearGradient id="frontCollarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#1c2747"/>
            <stop offset="22%" stop-color="#52689c"/>
            <stop offset="48%" stop-color="#253561"/>
            <stop offset="75%" stop-color="#ffffff"/>
            <stop offset="88%" stop-color="#6884c7"/>
            <stop offset="100%" stop-color="#16203d"/>
          </linearGradient>
        </defs>
        <path d="${streamPath}" fill="url(#liveStreamGrad)" />
        <path d="${highlightPath}" fill="none" stroke="rgba(255,255,255,0.48)" stroke-width="1.6" stroke-linecap="round" />
        ${impactFoamHTML}
        <path d="M ${sx(27)},${sy(11.5)}
                 L ${sx(27)},${sy(21)}
                 A ${rx23},${ry52} 0 0,0 ${sx(73)},${sy(21)}
                 L ${sx(73)},${sy(11.5)}
                 A ${rx23},${ry48} 0 0,0 ${sx(27)},${sy(11.5)} Z"
              fill="url(#frontCollarGrad)"
              stroke="#7b9be0" stroke-width="${(1.3 * scale).toFixed(2)}" />
        <path d="M ${sx(27)},${sy(11.5)} A ${rx23},${ry48} 0 0,0 ${sx(73)},${sy(11.5)}"
              fill="none" stroke="#adc4f7" stroke-width="${(1.4 * scale).toFixed(2)}" />
        <path d="M ${sx(29)},${sy(21.5)} A ${rx21},${ry48} 0 0,0 ${sx(71)},${sy(21.5)}"
              fill="none" stroke="#9ab8ff" stroke-width="${(1.5 * scale).toFixed(2)}" stroke-linecap="round" />
      `;
    }

    // 核心：零抖动、丝滑物理重力倾倒动画（支持按倾倒水量动态调整时长与水花物理形态）
    function performLiquidPour(srcIdx, dstIdx) {
      isAnimating = true;
      moveHistory.push(cloneState());

      const gridEl = document.getElementById('bottles-grid');
      const srcEl = gridEl.children[srcIdx];
      const dstEl = gridEl.children[dstIdx];

      srcEl.classList.remove('selected');
      srcEl.classList.add('pouring-source');
      dstEl.classList.add('pouring-target');

      const srcRect = srcEl.getBoundingClientRect();
      const dstRect = dstEl.getBoundingClientRect();

      const srcBottle = bottles[srcIdx];
      const dstBottle = bottles[dstIdx];
      const initialDstLayers = dstBottle.layers.length;
      const pourColorKey = srcBottle.layers[srcBottle.layers.length - 1];
      const colObj = COLORS[pourColorKey];

      const srcRevealedStart = srcBottle.mysteryCount || 0;
      let moveCount = 0;
      for (let i = srcBottle.layers.length - 1; i >= srcRevealedStart; i--) {
        if (srcBottle.layers[i] === pourColorKey && dstBottle.layers.length + moveCount < 4) {
          moveCount++;
        } else {
          break;
        }
      }

      let srcTopSameCount = 0;
      for (let i = srcBottle.layers.length - 1; i >= srcRevealedStart; i--) {
        if (srcBottle.layers[i] === pourColorKey) srcTopSameCount++;
        else break;
      }

      const dstFullLayers = [...dstBottle.layers];
      for (let k = 0; k < moveCount; k++) dstFullLayers.push(pourColorKey);

      const dstMyst = dstBottle.mysteryCount || 0;
      let dstTopSameAfter = 0;
      for (let i = dstFullLayers.length - 1; i >= dstMyst; i--) {
        if (dstFullLayers[i] === pourColorKey) dstTopSameAfter++;
        else break;
      }
      const dstInitialScale = (dstTopSameAfter - moveCount) / dstTopSameAfter;

      const pourDir = (srcRect.left <= dstRect.left) ? 1 : -1;

      const pivotXRatio = pourDir === 1 ? 0.67 : 0.33;
      const pivotYRatio = 0.072;
      srcEl.style.transformOrigin = `${pivotXRatio * 100}% ${pivotYRatio * 100}%`;

      const srcLipX = srcRect.left + srcRect.width * pivotXRatio;
      const srcLipY = srcRect.top + srcRect.height * pivotYRatio;

      const dstMouthX = dstRect.left + dstRect.width * 0.5;
      const dstMouthY = dstRect.top + dstRect.height * 0.055;

      const targetLipX = dstMouthX - pourDir * 3.5;
      const targetLipY = dstMouthY - 5.0;

      const targetTranslateX = targetLipX - srcLipX;
      const targetTranslateY = targetLipY - srcLipY;

      const startVol = srcBottle.layers.length;
      const endVol = srcBottle.layers.length - moveCount;
      const startTiltDeg = pourDir * getPhysicalSpillAngleDeg(startVol);
      const endTiltDeg = pourDir * getPhysicalSpillAngleDeg(endVol);

      const srcLiquidGroup = document.getElementById(`liquid-group-${srcIdx}`);
      const dstLiquidGroup = document.getElementById(`liquid-group-${dstIdx}`);
      const fxSvg = document.getElementById('fx-overlay');

      const moveDuration = 250;
      // 倾倒时长随倾倒格数 (1格 vs 2~3格) 物理延长，使多格倒水更具分量感
      const pourDuration = 460 + (moveCount - 1) * 110;
      const returnDuration = 240;
      const startTime = performance.now();
      let soundPlayed = false;

      function step(now) {
        const elapsed = now - startTime;

        if (elapsed < moveDuration) {
          const p = elapsed / moveDuration;
          const ease = 1 - Math.pow(1 - p, 3);
          const curX = targetTranslateX * ease;
          const curY = targetTranslateY * ease;
          const curDeg = startTiltDeg * ease;

          srcEl.style.transform = `translate(${curX.toFixed(2)}px, ${curY.toFixed(2)}px) rotate(${curDeg.toFixed(2)}deg)`;
          srcLiquidGroup.innerHTML = buildLiquidLayersMarkup(srcBottle.layers, srcIdx, {
            topLayerScale: 1,
            tiltAngle: curDeg,
            pourDir,
            spillProgress: ease,
            mysteryCount: srcBottle.mysteryCount || 0
          });
          requestAnimationFrame(step);

        } else if (elapsed < moveDuration + pourDuration) {
          if (!soundPlayed) {
            soundPlayed = true;
            playSound('pour');
          }

          const p = (elapsed - moveDuration) / pourDuration;
          const curRemainingVol = startVol - moveCount * p;
          const curDeg = pourDir * getPhysicalSpillAngleDeg(curRemainingVol);

          srcEl.style.transform = `translate(${targetTranslateX.toFixed(2)}px, ${targetTranslateY.toFixed(2)}px) rotate(${curDeg.toFixed(2)}deg)`;

          const srcEndScale = (srcTopSameCount - moveCount) / srcTopSameCount;
          const curSrcScale = 1 - (1 - srcEndScale) * p;
          srcLiquidGroup.innerHTML = buildLiquidLayersMarkup(srcBottle.layers, srcIdx, {
            topLayerScale: curSrcScale,
            tiltAngle: curDeg,
            pourDir,
            spillProgress: 1,
            mysteryCount: srcBottle.mysteryCount || 0
          });

          const fillP = Math.max(0, Math.min(1, (p - 0.08) / 0.92));
          const curDstScale = dstInitialScale + (1 - dstInitialScale) * fillP;
          dstLiquidGroup.innerHTML = buildLiquidLayersMarkup(dstFullLayers, dstIdx, {
            topLayerScale: curDstScale,
            tiltAngle: 0,
            mysteryCount: dstBottle.mysteryCount || 0
          });

          const currentTotalLayers = initialDstLayers + moveCount * fillP;
          const svgSurfaceY = 193 - currentTotalLayers * 35.5;
          const screenSurfaceY = dstRect.top + (svgSurfaceY / 214) * dstRect.height;

          const spoutStartX = targetLipX - pourDir * 2.5;
          const spoutStartY = targetLipY - 8.5;

          fxSvg.innerHTML = buildGravityStreamSVG(
            spoutStartX,
            spoutStartY,
            dstMouthX,
            dstMouthY,
            screenSurfaceY + 2,
            dstRect,
            pourDir,
            colObj,
            p,
            {
              initialDstLayers,
              moveCount,
              currentTotalLayers
            }
          );

          requestAnimationFrame(step);

        } else if (elapsed < moveDuration + pourDuration + returnDuration) {
          fxSvg.innerHTML = '';

          const p = (elapsed - moveDuration - pourDuration) / returnDuration;
          const ease = 1 - Math.pow(1 - p, 3);
          const curX = targetTranslateX * (1 - ease);
          const curY = targetTranslateY * (1 - ease);
          const curDeg = endTiltDeg * (1 - ease);

          srcEl.style.transform = `translate(${curX.toFixed(2)}px, ${curY.toFixed(2)}px) rotate(${curDeg.toFixed(2)}deg)`;

          const remainingSrcLayers = srcBottle.layers.slice(0, srcBottle.layers.length - moveCount);
          const nextSrcMystery = Math.min(srcBottle.mysteryCount || 0, Math.max(0, remainingSrcLayers.length - 1));
          srcLiquidGroup.innerHTML = buildLiquidLayersMarkup(remainingSrcLayers, srcIdx, {
            topLayerScale: 1,
            tiltAngle: curDeg,
            pourDir,
            spillProgress: 1 - ease,
            mysteryCount: nextSrcMystery
          });

          dstLiquidGroup.innerHTML = buildLiquidLayersMarkup(dstFullLayers, dstIdx, {
            topLayerScale: 1,
            tiltAngle: 0,
            mysteryCount: dstBottle.mysteryCount || 0
          });

          requestAnimationFrame(step);

        } else {
          fxSvg.innerHTML = '';
          srcEl.style.transform = '';
          srcEl.style.transformOrigin = '';
          srcEl.classList.remove('pouring-source');
          dstEl.classList.remove('pouring-target');

          for (let k = 0; k < moveCount; k++) {
            srcBottle.layers.pop();
            dstBottle.layers.push(pourColorKey);
          }

          if (srcBottle.mysteryCount && srcBottle.mysteryCount > 0 && srcBottle.layers.length <= srcBottle.mysteryCount) {
            srcBottle.mysteryCount = Math.max(0, srcBottle.layers.length - 1);
            showToast('❓ 黑雾盲盒瓶已揭晓下一层神秘药水颜色！');
          }

          pourCountTotal++;
          bottles.forEach((b) => {
            if ((b.special === 'ice_base' || b.special === 'stone_base') && b.poursToBreak) {
              b.poursToBreak--;
              if (b.poursToBreak <= 0) {
                const wasIce = b.special === 'ice_base';
                b.special = 'none';
                showToast(wasIce ? '❄️ 咔嚓！寒冰底座已震碎破冰！' : '🪨 轰隆！岩石底座已震碎解锁！');
              }
            }
          });

          selectedIndex = null;

          if (isCompleteBottle(dstBottle)) {
            dstBottle.corked = true;
            playSound('pack');
            renderAll();
            setTimeout(() => {
              packCompletedBottleIntoBag(dstIdx, pourColorKey);
            }, 340);
          } else {
            isAnimating = false;
            renderAll();
          }
        }
      }

      requestAnimationFrame(step);
    }

    // 集满 4 层同色并盖上软木塞后飞入顶部 2.5D 手提礼盒袋
    function packCompletedBottleIntoBag(bottleIdx, colorKey) {
      let targetBagIdx = bags.findIndex(b => !b.locked && b.color === colorKey);
      if (targetBagIdx === -1) {
        targetBagIdx = bags.findIndex(b => !b.locked);
        if (targetBagIdx !== -1) bags[targetBagIdx].color = colorKey;
      }

      const gridEl = document.getElementById('bottles-grid');
      const bagsEl = document.getElementById('bags-stage');
      const bottleEl = gridEl.children[bottleIdx];
      const bagEl = bagsEl.children[targetBagIdx];

      const bRect = bottleEl.getBoundingClientRect();
      const bagRect = bagEl.getBoundingClientRect();

      const dx = (bagRect.left + bagRect.width / 2) - (bRect.left + bRect.width / 2);
      const dy = (bagRect.top + bagRect.height / 2) - (bRect.top + bRect.height / 2);

      bottleEl.style.zIndex = '110';
      bottleEl.style.transition = 'transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.42s';
      bottleEl.style.transform = `translate(${dx}px, ${dy}px) scale(0.42)`;

      setTimeout(() => {
        bottles[bottleIdx].layers = [];
        bottles[bottleIdx].corked = false;
        bags[targetBagIdx].packedBottle = colorKey;
        packedTotal++;

        // 打包礼盒自动解锁对应的丝绸布幔、全身冰雕、牛皮纸袋或残余底座！
        bottles.forEach(b => {
          if (['silk_drape', 'full_ice', 'paper_bag'].includes(b.special) && packedTotal >= (b.unlockOrder || 1)) {
            const labelMap = {
              silk_drape: '🧣 蓝白丝绸垂坠布幔已掀开！',
              full_ice: '🧊 全身冰雕已破冰融化！',
              paper_bag: '🛍️ 折痕牛皮纸袋已拆开！'
            };
            const msg = labelMap[b.special];
            b.special = 'none';
            showToast(msg);
          }
        });

        renderAll();
        const updatedBagEl = document.getElementById('bags-stage').children[targetBagIdx];
        if (updatedBagEl) updatedBagEl.classList.add('packing-bounce');

        setTimeout(() => {
          bags[targetBagIdx].packedBottle = null;
          bags[targetBagIdx].color = pickNextNeededBagColor();
          isAnimating = false;
          renderAll();

          if (bottles.every(b => b.layers.length === 0)) {
            showWinModal();
          }
        }, 400);
      }, 400);
    }

    // ==========================================
    // 10. 底部按钮与菜单事件绑定
    // ==========================================
    document.getElementById('shuffle-btn').addEventListener('click', () => {
      if (isAnimating) return;
      const camBottle = bottles.find(b => b.special === 'ad_cam');
      if (camBottle && bottles.filter(b => b.special === 'none' && b.layers.length === 0).length === 0) {
        moveHistory.push(cloneState());
        camBottle.special = 'none';
        playSound('pack');
        showToast('🎬 已为您激活一个紫光魔法空瓶！');
        renderAll();
        return;
      }

      for (let i = 0; i < bottles.length; i++) {
        const src = bottles[i];
        if (!canSelectBottleNoToast(src)) continue;
        for (let j = 0; j < bottles.length; j++) {
          if (i === j) continue;
          const dst = bottles[j];
          if (canPourInto(src, dst) && dst.layers.length > 0) {
            selectedIndex = i;
            renderAll();
            setTimeout(() => performLiquidPour(i, j), 120);
            return;
          }
        }
      }

      moveHistory.push(cloneState());
      const pool = [];
      const openBottles = bottles.filter(b => b.special === 'none' && b.layers.length > 0);
      openBottles.forEach(b => {
        b.mysteryCount = 0;
        while (b.layers.length > 0) pool.push(b.layers.pop());
      });
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      let idx = 0;
      openBottles.forEach(b => {
        while (b.layers.length < 4 && idx < pool.length) {
          b.layers.push(pool[idx++]);
        }
      });
      if (shuffleUses > 0) shuffleUses--;
      playSound('pack');
      showToast('🔀 已为您重新洗牌整理瓶中液体！');
      renderAll();
    });

    function canSelectBottleNoToast(b) {
      return b.special === 'none' && b.layers.length > 0 && !isCompleteBottle(b);
    }

    document.getElementById('undo-btn').addEventListener('click', () => {
      if (isAnimating) return;
      if (moveHistory.length === 0) {
        showToast('当前已经是第一步了');
        return;
      }
      const prev = moveHistory.pop();
      bottles = prev.bottles;
      bags = prev.bags;
      packedTotal = prev.packedTotal;
      pourCountTotal = prev.pourCountTotal || 0;
      shuffleUses = prev.shuffleUses;
      selectedIndex = null;
      playSound('select');
      showToast('↩️ 已撤回上一步');
      renderAll();
    });

    function unlockAllSpecials() {
      moveHistory.push(cloneState());
      bottles.forEach(b => {
        b.special = 'none';
        b.mysteryCount = 0;
      });
      bags.forEach(bg => {
        if (bg.locked) {
          bg.locked = false;
          bg.color = pickNextNeededBagColor();
        }
      });
      playSound('pack');
      showToast('🔓 已解锁全场丝绸布幔、冰雕、盲盒、纸袋与魔法空瓶！');
      renderAll();
    }

    document.getElementById('quick-unlock-btn').addEventListener('click', unlockAllSpecials);

    const modalMask = document.getElementById('modal-mask');
    document.getElementById('settings-btn').addEventListener('click', () => {
      document.getElementById('modal-title').textContent = '⚙️ 倒水不能停 · 设置';
      modalMask.classList.add('show');
    });

    document.getElementById('modal-unlock-btn').addEventListener('click', () => {
      unlockAllSpecials();
      modalMask.classList.remove('show');
    });

    document.getElementById('modal-restart-btn').addEventListener('click', () => {
      initGame();
      modalMask.classList.remove('show');
      showToast('🔄 第 5 关已重置');
    });

    document.getElementById('modal-close-btn').addEventListener('click', () => {
      modalMask.classList.remove('show');
    });

    function showWinModal() {
      document.getElementById('modal-title').textContent = '🎉 倒水不能停 · 完美通关！';
      document.getElementById('modal-sub').textContent = '太棒了！全部奇幻机关瓶均已破除，所有魔法药水均已加塞软木塞并装入 2.5D 礼盒袋打包完成！';
      modalMask.classList.add('show');
    }

    function initGame() {
      bottles = createReferenceLevel5();
      bags = createInitialBags();
      packedTotal = 0;
      pourCountTotal = 0;
      selectedIndex = null;
      isAnimating = false;
      moveHistory = [];
      shuffleUses = 1;
      renderAll();
    }

    initGame();
  </script>
